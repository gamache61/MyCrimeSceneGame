<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Castle Bedroom</title>
<style>
#exitFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.6s ease;}
#exitFade.show{opacity:1;}
#instructionLine{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:14px;color:#eee;background:rgba(0,0,0,0.6);border-radius:6px;z-index:30;pointer-events:none;white-space:nowrap;}
body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;}
canvas{display:block;}
#fadeOverlay{position:fixed;inset:0;background:#000;z-index:9999;animation:fadeOut 0.8s ease forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
#editHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;}
#editBtn,#saveBtn,#loadBtn,#clearBtn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.72);color:#eee;cursor:pointer;user-select:none;}
#editIndicator{padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,0.20);background:rgba(80,20,20,0.8);color:#ffd0d0;}
#editIndicator.on{background:rgba(20,80,20,0.85);color:#d5ffd5;}
#autoStatus{position:fixed;top:108px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:rgba(0,0,0,0.65);color:#d7f7d7;font:12px/1.35 system-ui,Arial;display:none;z-index:70;pointer-events:none;}
#selInfo{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,0.8);color:#aaddff;border-radius:8px;font-size:13px;display:none;z-index:60;pointer-events:none;}
</style>
</head>
<body>
<div id="exitFade"></div>
<div id="instructionLine">W/↑ Forward &nbsp; S/↓ Back &nbsp; ←/→ Turn &nbsp; E = Interact &nbsp; M = Edit Mode</div>
<div id="doorHint" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#e8c87a;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,160,60,0.4);">Press E — Return to Floor 2</div>
<div id="chestHint" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#c8a820;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,160,60,0.4);">Press E — Open Chest</div>
<div id="fadeOverlay"></div>
<div id="editHud">
  <button id="editBtn" type="button">Edit Mode</button>
  <button id="saveBtn" type="button">Save Layout</button>
  <button id="loadBtn" type="button">Load Layout</button>
  <button id="clearBtn" type="button">Clear Save</button>
  <div id="editIndicator">OFF</div>
</div>
<div id="autoStatus"></div>
<div id="selInfo"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const STORAGE_KEY = "castle_bedroom_layout";
let scene,camera,renderer;
let moveForward=false,moveBackward=false,turnLeft=false,turnRight=false;
let yaw=0,prevTime=performance.now();
const S=0.5;
const RW=1200*S, RD=1000*S, RH=520*S;

// ── Edit system ──
let EDIT_MODE=false, selectedObject=null;
const editableObjects=[];
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let _ec=0;
function addGroup(g,id){
  if(!g.userData) g.userData={};
  g.userData.editId=id||("grp_"+(++_ec));
  editableObjects.push(g); scene.add(g); return g;
}
function showStatus(msg,ok=true){
  const el=document.getElementById("autoStatus");
  el.style.display="block"; el.style.color=ok?"#d7f7d7":"#ffd7d7"; el.textContent=msg;
  setTimeout(()=>{el.style.display="none";},2200);
}
function updateEditUI(){
  const ind=document.getElementById("editIndicator");
  ind.textContent=EDIT_MODE?"ON":"OFF"; ind.classList.toggle("on",EDIT_MODE);
  const btn=document.getElementById("editBtn");
  btn.textContent=EDIT_MODE?"✏️ Edit Mode: ON":"Edit Mode: OFF";
  btn.style.background=EDIT_MODE?"rgba(20,80,20,0.85)":"rgba(0,0,0,0.72)";
  btn.style.color=EDIT_MODE?"#d5ffd5":"#eee";
}
function toggleEditMode(){
  EDIT_MODE=!EDIT_MODE;
  if(!EDIT_MODE){selectedObject=null;document.getElementById("selInfo").style.display="none";}
  updateEditUI();
}
function saveLayout(){
  const objects=editableObjects.map(o=>{
    const wp=new THREE.Vector3(); o.getWorldPosition(wp);
    const wq=new THREE.Quaternion(); o.getWorldQuaternion(wq);
    return {id:o.userData.editId,position:{x:wp.x,y:wp.y,z:wp.z},quaternion:{x:wq.x,y:wq.y,z:wq.z,w:wq.w},scale:{x:o.scale.x,y:o.scale.y,z:o.scale.z}};
  });
  localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,savedAt:Date.now(),objects}));
  showStatus("✅ Layout saved",true);
}
function loadLayout(){
  const json=localStorage.getItem(STORAGE_KEY);
  if(!json){showStatus("No saved layout",false);return;}
  try{
    const d=JSON.parse(json);
    for(const e of d.objects){
      const o=editableObjects.find(x=>x.userData.editId===e.id);
      if(!o) continue;
      o.position.set(e.position.x,e.position.y,e.position.z);
      o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);
      o.scale.set(e.scale.x,e.scale.y,e.scale.z);
    }
    showStatus("✅ Layout loaded",true);
  }catch(e){showStatus("Load failed",false);}
}
function clearSave(){localStorage.removeItem(STORAGE_KEY);showStatus("🗑 Save cleared",true);}

function onMouseClick(e){
  if(!EDIT_MODE) return;
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const meshes=[];
  editableObjects.forEach(o=>{if(o.isMesh)meshes.push(o);else o.traverse(ch=>{if(ch.isMesh)meshes.push(ch);});});
  const hits=raycaster.intersectObjects(meshes,false);
  if(!hits.length){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
  let obj=hits[0].object;
  let cur=obj; while(cur){if(editableObjects.includes(cur)){obj=cur;break;}cur=cur.parent;}
  if(!editableObjects.includes(obj)){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
  selectedObject=obj;
  document.getElementById("selInfo").style.display="block";
  document.getElementById("selInfo").textContent=`✏️ ${obj.userData.editId} | Arrows=Move  Shift+↑↓=Height  R=Rotate  Del=Delete`;
  showStatus("Selected: "+obj.userData.editId,true);
}

function onKeyDown(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();

  if(e.code==="KeyG"){
    window.coordOn = !window.coordOn;
    if(window.coordOn){
      window.coordTimer = setInterval(()=>{
        const el = document.getElementById("selInfo");
        el.style.display = "block";
        el.textContent = `X:${camera.position.x.toFixed(0)} Y:${camera.position.y.toFixed(0)} Z:${camera.position.z.toFixed(0)}`;
      },100);
    } else {
      clearInterval(window.coordTimer);
      document.getElementById("selInfo").style.display="none";
    }
    return;
  }

  if(e.code==="KeyM"){toggleEditMode();return;}
if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
    if(e.code==="KeyE"){
    if(nearChest&&!nearExit){
      chestOpen=!chestOpen;
      return;
    }
    if(nearExit&&!exitTriggered){
      exitTriggered=true;
      document.getElementById("doorHint").style.display="none";
      document.getElementById("exitFade").classList.add("show");
      setTimeout(()=>window.location.href="floor2.html?from=castle_bedroom",600);
      return;
    }
    return;
  }
  if(EDIT_MODE&&selectedObject){
    if(e.code==="Delete"||e.code==="Backspace"){
      e.preventDefault();
      scene.remove(selectedObject);
      const idx=editableObjects.indexOf(selectedObject);
      if(idx>-1) editableObjects.splice(idx,1);
      showStatus("🗑 Deleted: "+selectedObject.userData.editId,true);
      selectedObject=null; document.getElementById("selInfo").style.display="none"; return;
    }
    const speed=e.shiftKey?1:8; let moved=false;
    if(!e.shiftKey){
      if(e.code==="ArrowUp")   {selectedObject.position.z-=speed;moved=true;}
      if(e.code==="ArrowDown") {selectedObject.position.z+=speed;moved=true;}
      if(e.code==="ArrowLeft") {selectedObject.position.x-=speed;moved=true;}
      if(e.code==="ArrowRight"){selectedObject.position.x+=speed;moved=true;}
    }
    if(e.shiftKey&&e.code==="ArrowUp")  {selectedObject.position.y+=speed;moved=true;}
    if(e.shiftKey&&e.code==="ArrowDown"){selectedObject.position.y-=speed;moved=true;}
    if(e.code==="KeyR"){selectedObject.rotation.y+=e.shiftKey?0.05:0.1;moved=true;}
    if(moved) return;
  }
  if(!EDIT_MODE){
    if(e.code==="KeyW"||e.code==="ArrowUp")   moveForward=true;
    if(e.code==="KeyS"||e.code==="ArrowDown") moveBackward=true;
    if(e.code==="ArrowLeft")  turnLeft=true;
    if(e.code==="ArrowRight") turnRight=true;
  }
}
function onKeyUp(e){
  if(e.code==="KeyW"||e.code==="ArrowUp")   moveForward=false;
  if(e.code==="KeyS"||e.code==="ArrowDown") moveBackward=false;
  if(e.code==="ArrowLeft")  turnLeft=false;
  if(e.code==="ArrowRight") turnRight=false;
}

// ── SVG textures ──
const _svgMatCache={};
function makeSVGTexture(svgStr){
  if(_svgMatCache[svgStr]) return _svgMatCache[svgStr];
  try{
    const blob=new Blob([svgStr],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    const canvas=document.createElement('canvas'); canvas.width=512; canvas.height=512;
    const ctx=canvas.getContext('2d');
    const tex=new THREE.CanvasTexture(canvas);
    const mat=new THREE.MeshLambertMaterial({map:tex,color:0xffffff,side:THREE.DoubleSide});
    img.onload=()=>{ctx.drawImage(img,0,0,512,512);tex.needsUpdate=true;URL.revokeObjectURL(url);};
    img.src=url;
    _svgMatCache[svgStr]=mat;
    return mat;
  }catch(e){return new THREE.MeshLambertMaterial({color:0x4a3a2a,side:THREE.DoubleSide});}
}

function init(){
  setTimeout(()=>{const f=document.getElementById("fadeOverlay");if(f)f.remove();},800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x060402);
  scene.fog=new THREE.Fog(0x060402,300,1400);
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Warm firelight + torch lighting
  scene.add(new THREE.AmbientLight(0x1a1008,1.0));
  const overhead=new THREE.PointLight(0xffd090,1.2,900); overhead.position.set(0,RH-40*S,0); scene.add(overhead);
  const fire=new THREE.PointLight(0xff6600,2.5,400); fire.position.set(0,80*S,-RD/2+60*S); scene.add(fire);
  const fire2=new THREE.PointLight(0xff4400,1.2,220); fire2.position.set(0,50*S,-RD/2+40*S); scene.add(fire2);
  // Torch sconces
  [[-RW/2+80*S,220*S,-RD/4],[RW/2-80*S,220*S,-RD/4],[-RW/2+80*S,220*S,RD/4],[RW/2-80*S,220*S,RD/4]].forEach(([x,y,z])=>{
    const t=new THREE.PointLight(0xff9900,0.9,250); t.position.set(x,y,z); scene.add(t);
  });

  buildRoom();

  // Auto-load
  const _saved=localStorage.getItem(STORAGE_KEY);
  if(_saved){try{const d=JSON.parse(_saved);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}}catch(err){}}

  document.getElementById("editBtn").addEventListener("click",toggleEditMode);
  document.getElementById("saveBtn").addEventListener("click",saveLayout);
  document.getElementById("loadBtn").addEventListener("click",loadLayout);
  document.getElementById("clearBtn").addEventListener("click",clearSave);
  renderer.domElement.addEventListener("click",onMouseClick);
  document.addEventListener("keydown",onKeyDown);
  document.addEventListener("keyup",onKeyUp);
  window.addEventListener("resize",onResize);

  camera.position.set(0,240*S,RD/2-150*S);
  yaw=0; updateRotation(); animate();

  // Grab chest lid pivot reference
  const chestGroup=editableObjects.find(o=>o.userData.editId==="chest");
  if(chestGroup) chestLidPivot=chestGroup.userData.lidPivot;
  console.log("chestLidPivot:",chestLidPivot,"chestGroup:",chestGroup);
}

function buildRoom(){
  // Materials
  const stoneMat  =new THREE.MeshLambertMaterial({color:0x3a3428});
  const stoneDark =new THREE.MeshLambertMaterial({color:0x2a2418});
  const stoneLight=new THREE.MeshLambertMaterial({color:0x4a4438});
  const floorMat  =new THREE.MeshLambertMaterial({color:0x2a2010});
  const ceilMat   =new THREE.MeshLambertMaterial({color:0x1a1808});
  const darkWood  =new THREE.MeshLambertMaterial({color:0x1a0c04});
  const midWood   =new THREE.MeshLambertMaterial({color:0x2a1408});
  const richWood  =new THREE.MeshLambertMaterial({color:0x4a2010});
  const ironMat   =new THREE.MeshLambertMaterial({color:0x1a1818});
  const brassMat  =new THREE.MeshLambertMaterial({color:0xb8860b});
  const goldMat   =new THREE.MeshLambertMaterial({color:0xd4a820});
  const marbleMat =new THREE.MeshLambertMaterial({color:0xc8c0b0});
  const emberMat  =new THREE.MeshLambertMaterial({color:0xff4400,emissive:0xaa2200,emissiveIntensity:1.0});
  const creamMat  =new THREE.MeshLambertMaterial({color:0xe8e0c8});
  const velvetDeep=new THREE.MeshLambertMaterial({color:0x3a0808});
  const velvetBurg=new THREE.MeshLambertMaterial({color:0x5a0a20});
  const furMat    =new THREE.MeshLambertMaterial({color:0xc8c0b0});
  const glassMat  =new THREE.MeshLambertMaterial({color:0x88aabb,transparent:true,opacity:0.3,side:THREE.DoubleSide});
  const torchMat  =new THREE.MeshLambertMaterial({color:0xd4a820,emissive:0x884400,emissiveIntensity:0.8});

  // ── Stone floor with flag pattern ──
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),stoneDark);
  floor.rotation.x=-Math.PI/2; floor.position.y=0; scene.add(floor);
  const tSz=60*S;
  for(let ix=0;ix<Math.ceil(RW/tSz);ix++)
    for(let iz=0;iz<Math.ceil(RD/tSz);iz++){
      const m=(ix+iz)%2===0?stoneMat:stoneDark;
      const t=new THREE.Mesh(new THREE.BoxGeometry(tSz-3,2*S,tSz-3),m);
      t.position.set(-RW/2+tSz*(ix+0.5),1*S,-RD/2+tSz*(iz+0.5)); scene.add(t);
    }
  // Stone floor joints
  const jointMat=new THREE.MeshLambertMaterial({color:0x1a1408});
  for(let ix=0;ix<=Math.ceil(RW/tSz);ix++){
    const j=new THREE.Mesh(new THREE.BoxGeometry(2*S,2.5*S,RD),jointMat);
    j.position.set(-RW/2+tSz*ix,1.5*S,0); scene.add(j);
  }

  // ── Vaulted stone ceiling ──
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),ceilMat);
  ceil.rotation.x=Math.PI/2; ceil.position.y=RH; scene.add(ceil);
  // Ceiling ribs (gothic arches)
  [-RW/4,0,RW/4].forEach(rx=>{
    const rib=new THREE.Mesh(new THREE.BoxGeometry(12*S,RH,12*S),stoneDark);
    rib.position.set(rx,RH/2,-RD/2+8*S); scene.add(rib);
    const rib2=rib.clone(); rib2.position.z=RD/2-8*S; scene.add(rib2);
    const crossrib=new THREE.Mesh(new THREE.BoxGeometry(12*S,12*S,RD),stoneDark);
    crossrib.position.set(rx,RH-6*S,0); scene.add(crossrib);
  });

  // ── Stone walls with rough texture variation ──
  // Back wall
  const backWall=new THREE.Mesh(new THREE.BoxGeometry(RW,RH,20*S),stoneMat);
  backWall.position.set(0,RH/2,-RD/2+10*S); scene.add(backWall);
  // Stone blocks on back wall
  for(let bx=0;bx<5;bx++) for(let by=0;by<4;by++){
    const bk=new THREE.Mesh(new THREE.BoxGeometry(RW/5-6,RH/4-6,4*S),by%2===0?stoneLight:stoneMat);

  makePainting(SVG_PAINTING_KNIGHT,100*S,130*S,"painting_knight",
    new THREE.Vector3(RW/4,260*S,-RD/2+14*S));
  // Landscape — back wall left side
  makePainting(SVG_PAINTING_LANDSCAPE,120*S,90*S,"painting_landscape",
    new THREE.Vector3(-RW/4,270*S,-RD/2+14*S));
  // Dragon — right wall
  makePainting(SVG_PAINTING_DRAGON,100*S,120*S,"painting_dragon",
    new THREE.Vector3(RW/2-14*S,270*S,RD/4),Math.PI/2);
}

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
function updateRotation(){camera.rotation.order="YXZ";camera.rotation.set(0,yaw,0);}

const exitCooldown=(new URLSearchParams(window.location.search).get("from")==="floor2")?Date.now()+4000:0;
let exitTriggered=false, nearExit=false;
let nearChest=false, chestOpen=false, chestLidPivot=null;
let chestLidAngle=0;
function checkExitDoor(){
  if(exitTriggered) return;
  if(Date.now()<exitCooldown) return;
  nearExit=camera.position.x>-220*S&&camera.position.x<220*S&&camera.position.z>RD/2-200*S;
  document.getElementById("doorHint").style.display=nearExit?"block":"none";
}

function checkChest(){
  const chestGroup=editableObjects.find(o=>o.userData.editId==="chest");
  if(!chestGroup) return;
  const cp=new THREE.Vector3(); chestGroup.getWorldPosition(cp);
  const dist=camera.position.distanceTo(cp);
  const coordDist = camera.position.distanceTo(new THREE.Vector3(0,120,48));
nearChest = (dist<180*S) || (coordDist < 120);
  console.log("dist to chest:",dist,"nearChest:",nearChest,"chestLidPivot:",!!chestLidPivot);
  const hint=document.getElementById("chestHint");
  if(nearChest&&!nearExit){
    hint.textContent=chestOpen?"Press E — Close Chest":"Press E — Open Chest";
    hint.style.display="block";
  } else {
    hint.style.display="none";
  }
}

function animateChest(delta){
  if(!chestLidPivot) return;
  const target=chestOpen?-Math.PI*0.75:0;
  chestLidPivot.rotation.x+=(target-chestLidPivot.rotation.x)*Math.min(1,delta*6);
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(); const delta=(now-prevTime)/1000; prevTime=now;
  if(!EDIT_MODE){
    if(turnLeft) yaw+=2.2*delta; if(turnRight) yaw-=2.2*delta;
    const mv=Number(moveForward)-Number(moveBackward);
    if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    camera.position.x+=fwd.x*mv*110*delta;
    camera.position.z+=fwd.z*mv*110*delta;
    camera.position.x=Math.max(-RW/2+20*S,Math.min(RW/2-20*S,camera.position.x));
    camera.position.z=Math.max(-RD/2+20*S,Math.min(RD/2-15*S,camera.position.z));
    camera.position.y=240*S;
  }
  checkExitDoor(); checkChest(); animateChest(delta); updateRotation(); renderer.render(scene,camera);
  EvidenceSystem.update();
}
// engine scripts loaded below
</script>
<script src="../floor1/sound-system.js"></script>
<script src="../floor1/mystery-engine.js"></script>
<script src="../floor1/mystery-state.js"></script>
<script src="../floor1/mystery-ui.js"></script>
<script src="../floor1/evidence-system.js"></script>
<script>
(async()=>{
  await MysteryEngine.init();
  let scenario=await MysteryState.load();
  const isNew=!scenario;
  if(isNew){scenario=MysteryEngine.generate();await MysteryState.save(scenario);}
  window._scenario=scenario;
  MysteryUI.init(scenario,isNew);
  MysteryUI.setZone('medievalroom');
  init();
  EvidenceSystem.init({ camera, scene, renderer, zoneId: 'medievalroom' });
  const _sa=()=>{if(window.SoundSystem)SoundSystem.startAmbient();window.removeEventListener('keydown',_sa);window.removeEventListener('click',_sa);};
  window.addEventListener('keydown',_sa);window.addEventListener('click',_sa);

})();
</script>
