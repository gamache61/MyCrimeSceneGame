<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Victorian Living Room</title>
<style>
#exitFade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 9999; transition: opacity 0.6s ease; }
#exitFade.show { opacity: 1; }
#doorHint { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); padding: 10px 24px; background: rgba(0,0,0,0.85); color: #ffdd88; border-radius: 8px; font-size: 17px; display: none; z-index: 50; font-family: system-ui, Arial, sans-serif; }
#instructionLine {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
  padding: 8px 16px; font-size: 14px; color: #eee;
  background: rgba(0,0,0,0.6); border-radius: 6px; z-index: 30;
  pointer-events: none; white-space: nowrap;
}
body { margin: 0; overflow: hidden; background: #000; font-family: Arial, sans-serif; }
#info {
  position: absolute; top: 15px; left: 15px; color: #ddd; font-size: 14px;
  background: rgba(0,0,0,0.7); padding: 10px; border-radius: 6px; z-index: 10;
}
canvas { display: block; }
#fadeOverlay { position: fixed; inset: 0; background: #000; z-index: 9999; animation: fadeOut 0.8s ease forwards; }
@keyframes fadeOut { from { opacity:1; } to { opacity:0; } }

/* Editor */
#editToggle {
  position: fixed; bottom: 20px; right: 20px; z-index: 100;
  background: rgba(20,10,4,0.92); color: #c8a060; border: 1px solid #5a3010;
  padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer;
}
#editToggle:hover { background: rgba(40,20,8,0.96); }
#editPanel {
  position: fixed; top: 0; right: -320px; width: 300px; height: 100vh;
  background: rgba(12,7,3,0.97); border-left: 1px solid #3a1a08;
  z-index: 200; transition: right .3s ease; overflow-y: auto; display: flex; flex-direction: column;
}
#editPanel.open { right: 0; }
#editHeader {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; border-bottom: 1px solid #2a1204;
  background: rgba(30,14,4,0.95); flex-shrink: 0;
}
#editHeader span { color: #c8a060; font-size: 15px; font-weight: 600; }
#editClose { background: none; border: none; color: #7a5030; font-size: 18px; cursor: pointer; }
#editClose:hover { color: #c8a060; }
.piece-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 12px 14px 8px; }
.piece-btn {
  padding: 8px 4px; border: 1px solid #3a1a08; background: transparent;
  color: #7a5030; border-radius: 6px; cursor: pointer; font-size: 10px;
  transition: all .2s; text-align: center; line-height: 1.3;
}
.piece-btn.active { background: #4a1e06; color: #f0c888; border-color: #7a4820; }
.piece-btn:hover:not(.active) { border-color: #5a2a10; color: #a07040; }
.ctrl-group { padding: 10px 16px; border-top: 1px solid #1e0e04; }
.ctrl-label { color: #8a6040; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: block; }
.ctrl-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.ctrl-row label { color: #b08060; font-size: 12px; width: 22px; flex-shrink: 0; }
.ctrl-row input[type=range] { flex: 1; accent-color: #7a4820; height: 4px; cursor: pointer; }
.ctrl-val { color: #f0c888; font-size: 12px; width: 46px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
.reset-btn {
  width: 100%; margin: 4px 0 12px; padding: 8px; border: 1px solid #3a1a08;
  background: transparent; color: #8a6040; border-radius: 6px; cursor: pointer; font-size: 13px;
}
.reset-btn:hover { border-color: #7a4820; color: #c8a060; background: rgba(70,30,8,0.3); }
.hint { color: #4a2a10; font-size: 11px; padding: 0 16px 12px; line-height: 1.5; }
</style>
</head>
<body>
<div id="exitFade"></div>
<div id="doorHint">Press E — Return to Floor 1</div>
<div id="instructionLine">Walk to the doors (rear) to exit</div>
<div id="fadeOverlay"></div>
<div id="info">W / ↑ Forward &nbsp; S / ↓ Backward<br>← Turn Left &nbsp; → Turn Right</div>

<button id="editToggle">⤢ Arrange Room</button>
<div id="editPanel">
  <div id="editHeader"><span>Move &amp; Rotate</span><button id="editClose">✕</button></div>
  <div class="piece-grid">
    <button class="piece-btn active" data-piece="sofa_main">Main<br>Sofa</button>
    <button class="piece-btn" data-piece="sofa_left">Left<br>Sofa</button>
    <button class="piece-btn" data-piece="sofa_right">Right<br>Sofa</button>
    <button class="piece-btn" data-piece="chair_l">Left<br>Chair</button>
    <button class="piece-btn" data-piece="chair_r">Right<br>Chair</button>
    <button class="piece-btn" data-piece="coffee">Coffee<br>Table</button>
    <button class="piece-btn" data-piece="side_l">Side<br>Table L</button>
    <button class="piece-btn" data-piece="side_r">Side<br>Table R</button>
    <button class="piece-btn" data-piece="bookcase_l">Books<br>Left</button>
    <button class="piece-btn" data-piece="bookcase_r">Books<br>Right</button>
    <button class="piece-btn" data-piece="piano">Piano</button>
    <button class="piece-btn" data-piece="plant_l">Plant<br>Left</button>
    <button class="piece-btn" data-piece="plant_r">Plant<br>Right</button>
    <button class="piece-btn" data-piece="cand_l">Cand<br>Left</button>
    <button class="piece-btn" data-piece="cand_r">Cand<br>Right</button>
    <button class="piece-btn" data-piece="pic_back_l">Pic<br>Back L</button>
    <button class="piece-btn" data-piece="pic_back_r">Pic<br>Back R</button>
    <button class="piece-btn" data-piece="pic_fire">Pic<br>Fire</button>
  </div>
  <div class="ctrl-group">
    <span class="ctrl-label">Position &amp; Rotation</span>
    <div class="ctrl-row"><label>X</label><input type="range" id="sl-x" min="-340" max="340" step="1" value="0"><span class="ctrl-val" id="val-x">0</span></div>
    <div class="ctrl-row"><label>Z</label><input type="range" id="sl-z" min="-340" max="340" step="1" value="0"><span class="ctrl-val" id="val-z">0</span></div>
    <div class="ctrl-row"><label>↻</label><input type="range" id="sl-r" min="0" max="359" step="1" value="0"><span class="ctrl-val" id="val-r">0°</span></div>
    <button class="reset-btn" id="resetBtn">Reset to Default</button>
    <button class="reset-btn" id="hideBtn" style="margin-top:6px;background:#3a1a08;">Hide / Show</button>
  </div>
  <div class="hint">Select a piece above, then drag sliders to reposition.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
let scene, camera, renderer;
let moveForward=false, moveBackward=false, turnLeft=false, turnRight=false;
let yaw=0, prevTime=performance.now();
const SCALE=0.5;
const FURNITURE={};
const SAVE_KEY='livingroom2_layout';

// ── Canvas texture helper ──
function canvasTex(drawFn, w=256, h=256) {
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  drawFn(c.getContext('2d'),w,h);
  return new THREE.CanvasTexture(c);
}

function init() {
  setTimeout(()=>{ const f=document.getElementById('fadeOverlay'); if(f)f.remove(); },800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0c0806);
  scene.fog=new THREE.Fog(0x0c0806,280,700);

  camera=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Lighting — warm firelit
  scene.add(new THREE.AmbientLight(0x180c04,1.2));
  const fireLight=new THREE.PointLight(0xff6010,4.2,420); fireLight.position.set(0,55*SCALE,-300*SCALE); scene.add(fireLight);
  const fire2=new THREE.PointLight(0xff3800,1.7,220); fire2.position.set(0,30*SCALE,-280*SCALE); scene.add(fire2);
  const fill=new THREE.PointLight(0xffcc88,1.0,600); fill.position.set(0,200*SCALE,0); scene.add(fill);
  const wL=new THREE.PointLight(0xff9933,0.84,200); wL.position.set(-200*SCALE,120*SCALE,60*SCALE); scene.add(wL);
  const wR=new THREE.PointLight(0xff9933,0.84,200); wR.position.set(200*SCALE,120*SCALE,60*SCALE); scene.add(wR);

  buildRoom();
  buildFurniture();
  loadLayout();
  initEditor();

  document.addEventListener('keydown',onKeyDown);
  document.addEventListener('keyup',onKeyUp);
  window.addEventListener('resize',onResize);

  const fromFloor1=new URLSearchParams(window.location.search).get('from')==='floor1';
  camera.position.set(0,100,fromFloor1?155*SCALE:130*SCALE);
  yaw=0;
  updateRotation();
  animate();
}

function onResize(){ camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); }

// ══════════════════════════════════════
//  ROOM SHELL
// ══════════════════════════════════════
function buildRoom(){
  const S=SCALE;
  const RW=750*S, RH=420*S, RD=750*S;

  // Materials
  const floorMat   = new THREE.MeshLambertMaterial({color:0x1a0e06});
  const floorStrip = new THREE.MeshLambertMaterial({color:0x2e1a0a});
  const wallMat    = new THREE.MeshLambertMaterial({color:0x1c1408});
  const wallPaper  = new THREE.MeshLambertMaterial({color:0x2a1e10});
  const ceilMat    = new THREE.MeshLambertMaterial({color:0x160e06});
  const trimMat    = new THREE.MeshLambertMaterial({color:0x5c3010});
  const goldMat    = new THREE.MeshLambertMaterial({color:0xb8860b});
  const darkWood   = new THREE.MeshLambertMaterial({color:0x1e0e04});
  const midWood    = new THREE.MeshLambertMaterial({color:0x3a1c08});
  const richWood   = new THREE.MeshLambertMaterial({color:0x5c2e0e});
  const marble     = new THREE.MeshLambertMaterial({color:0xc8bfb0});
  const marbleDk   = new THREE.MeshLambertMaterial({color:0x6a6050});
  const blackMat   = new THREE.MeshLambertMaterial({color:0x080402});
  const brassMat   = new THREE.MeshLambertMaterial({color:0x9a7020});
  const creamMat   = new THREE.MeshLambertMaterial({color:0xd4c9a8});
  const fireBrick  = new THREE.MeshLambertMaterial({color:0x6a3020});
  const emberMat   = new THREE.MeshLambertMaterial({color:0xff4400,emissive:0xff2200,emissiveIntensity:1.0});
  const flameMat   = new THREE.MeshLambertMaterial({color:0xff8800,emissive:0xff6600,emissiveIntensity:1.0});
  const candleWax  = new THREE.MeshLambertMaterial({color:0xf0e8c0});
  const candleFire = new THREE.MeshLambertMaterial({color:0xffcc44,emissive:0xff8800,emissiveIntensity:1.0});
  const curtainMat = new THREE.MeshLambertMaterial({color:0x4a1008,side:THREE.DoubleSide});
  const glassMat   = new THREE.MeshLambertMaterial({color:0x88aabb,transparent:true,opacity:0.3});

  // ── Floor — hardwood planks ──
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),floorMat); floor.rotation.x=-Math.PI/2; scene.add(floor);
  for(let x=-RW/2+20*S;x<RW/2;x+=20*S){
    const p=new THREE.Mesh(new THREE.BoxGeometry(1.5*S,0.8*S,RD),floorStrip); p.position.set(x,0.4*S,0); scene.add(p);
  }

  // ── Ceiling ──
  const ceil=new THREE.Mesh(new THREE.BoxGeometry(RW,12*S,RD),ceilMat); ceil.position.set(0,RH+6*S,0); scene.add(ceil);
  // Plasterwork cornice
  [[new THREE.BoxGeometry(RW+8*S,10*S,10*S),0,RH-5*S,-RD/2+5*S],
   [new THREE.BoxGeometry(RW+8*S,10*S,10*S),0,RH-5*S, RD/2-5*S],
   [new THREE.BoxGeometry(10*S,10*S,RD+8*S),-RW/2+5*S,RH-5*S,0],
   [new THREE.BoxGeometry(10*S,10*S,RD+8*S), RW/2-5*S,RH-5*S,0],
  ].forEach(([geo,x,y,z])=>{ const m=new THREE.Mesh(geo,creamMat); m.position.set(x,y,z); scene.add(m); });
  // Ceiling rose
  const rose=new THREE.Mesh(new THREE.CylinderGeometry(30*S,30*S,6*S,16),creamMat); rose.position.set(0,RH+3*S,0); scene.add(rose);
  const roseInner=new THREE.Mesh(new THREE.CylinderGeometry(18*S,18*S,7*S,12),goldMat); roseInner.position.set(0,RH+3*S,0); scene.add(roseInner);

  // ── Walls ──
  // Back wall
  const bk=new THREE.Mesh(new THREE.BoxGeometry(RW,RH,16*S),wallMat); bk.position.set(0,RH/2,-RD/2+8*S); scene.add(bk);
  // Wallpaper panel overlay
  const bkWP=new THREE.Mesh(new THREE.BoxGeometry(RW-30*S,RH-80*S,15*S),wallPaper); bkWP.position.set(0,RH/2+10*S,-RD/2+8*S); scene.add(bkWP);
  // Front wall (double doors, ceiling height)
  const doorW=250*S, doorH=RH;
  const fSideW=(RW-doorW)/2;
  const fL=new THREE.Mesh(new THREE.BoxGeometry(fSideW,RH,16*S),wallMat); fL.position.set(-(doorW/2+fSideW/2),RH/2,RD/2-8*S); scene.add(fL);
  const fR=fL.clone(); fR.position.x=doorW/2+fSideW/2; scene.add(fR);
  // No fTop — doors reach ceiling
  (()=>{
    const woodMat=new THREE.MeshLambertMaterial({color:0x3d2010});
    const raisedMat=new THREE.MeshLambertMaterial({color:0x2a1508});
    const brassMat2=new THREE.MeshLambertMaterial({color:0xb8860b});
    const gap=4*S;
    const slabW=doorW/2-gap/2;
    const wallZ=RD/2-8*S;
    // Outer jambs
    [-1,1].forEach(s=>{
      const jamb=new THREE.Mesh(new THREE.BoxGeometry(10*S,doorH,18*S),richWood);
      jamb.position.set(s*(doorW/2+5*S),doorH/2,wallZ); scene.add(jamb);
    });
    // Two door slabs
    [-1,1].forEach(s=>{
      const cx=s*(gap/2+slabW/2);
      const slab=new THREE.Mesh(new THREE.BoxGeometry(slabW,doorH,10*S),woodMat);
      slab.position.set(cx,doorH/2,wallZ+3*S); scene.add(slab);
      [[doorH*0.78,doorH*0.16],[doorH*0.50,doorH*0.20],[doorH*0.18,doorH*0.22]].forEach(([py,ph])=>{
        const panel=new THREE.Mesh(new THREE.BoxGeometry(slabW-16*S,ph,5*S),raisedMat);
        panel.position.set(cx,py,wallZ+8*S); scene.add(panel);
      });
      const knobX=cx+s*(-slabW/2+9*S);
      const knob=new THREE.Mesh(new THREE.SphereGeometry(5*S,10,10),brassMat2);
      knob.position.set(knobX,doorH*0.45,wallZ+9*S); scene.add(knob);
      const plate=new THREE.Mesh(new THREE.CylinderGeometry(7*S,7*S,2*S,12),brassMat2);
      plate.rotation.x=Math.PI/2;
      plate.position.set(knobX,doorH*0.45,wallZ+6*S); scene.add(plate);
    });
    // Dark gap strip
    const gapStrip=new THREE.Mesh(new THREE.BoxGeometry(gap,doorH,16*S),
      new THREE.MeshLambertMaterial({color:0x080400}));
    gapStrip.position.set(0,doorH/2,wallZ+2*S); scene.add(gapStrip);
  })();
  // Left wall
  const lW=new THREE.Mesh(new THREE.BoxGeometry(16*S,RH,RD),wallMat); lW.position.set(-RW/2+8*S,RH/2,0); scene.add(lW);
  const lWP=new THREE.Mesh(new THREE.BoxGeometry(15*S,RH-80*S,RD-30*S),wallPaper); lWP.position.set(-RW/2+8*S,RH/2+10*S,0); scene.add(lWP);
  // Right wall
  const rW=lW.clone(); rW.position.x=RW/2-8*S; scene.add(rW);
  const rWP=lWP.clone(); rWP.position.x=RW/2-8*S; scene.add(rWP);

  // ── Wainscoting ──
  const wH=80*S;
  [[new THREE.BoxGeometry(RW,wH,18*S),0,wH/2,-RD/2+9*S],
   [new THREE.BoxGeometry(16*S,wH,RD),-RW/2+8*S,wH/2,0],
   [new THREE.BoxGeometry(16*S,wH,RD), RW/2-8*S,wH/2,0],
  ].forEach(([geo,x,y,z])=>{ const m=new THREE.Mesh(geo,midWood); m.position.set(x,y,z); scene.add(m); });
  // Front wainscot split
  [-1,1].forEach(s=>{
    const fw2=new THREE.Mesh(new THREE.BoxGeometry(fSideW,wH,18*S),midWood);
    fw2.position.set(s*(125*S+fSideW/2),wH/2,RD/2-9*S); scene.add(fw2);
  });
  // Rail
  [[new THREE.BoxGeometry(RW+10*S,8*S,20*S),0,wH+4*S,-RD/2+10*S],
   [new THREE.BoxGeometry(20*S,8*S,RD+10*S),-RW/2+10*S,wH+4*S,0],
   [new THREE.BoxGeometry(20*S,8*S,RD+10*S), RW/2-10*S,wH+4*S,0],
  ].forEach(([geo,x,y,z])=>{ const m=new THREE.Mesh(geo,richWood); m.position.set(x,y,z); scene.add(m); });
  [-1,1].forEach(s=>{
    const fr=new THREE.Mesh(new THREE.BoxGeometry(fSideW,8*S,20*S),richWood);
    fr.position.set(s*(125*S+fSideW/2),wH+4*S,RD/2-10*S); scene.add(fr);
  });

  // ── Back wall panel mouldings ──
  [-210*S,-70*S,70*S,210*S].forEach(px=>{
    const mo=new THREE.Mesh(new THREE.BoxGeometry(100*S,wH-12*S,20*S),richWood); mo.position.set(px,wH/2,-RD/2+10*S); scene.add(mo);
    const inn=new THREE.Mesh(new THREE.BoxGeometry(84*S,wH-26*S,19*S),midWood); inn.position.set(px,wH/2,-RD/2+10.5*S); scene.add(inn);
  });

  // ── Windows — left wall ──
  function makeWindow(x,y,z,rotY){
    const g=new THREE.Group();
    // Frame
    const fr=new THREE.Mesh(new THREE.BoxGeometry(90*S,130*S,10*S),trimMat); g.add(fr);
    // Glass panes
    [[-20*S,20*S],[20*S,20*S],[-20*S,-30*S],[20*S,-30*S]].forEach(([px,py])=>{
      const pane=new THREE.Mesh(new THREE.PlaneGeometry(32*S,44*S),glassMat); pane.position.set(px,py,6*S); g.add(pane);
    });
    // Glazing bars
    const hBar=new THREE.Mesh(new THREE.BoxGeometry(82*S,3*S,8*S),creamMat); hBar.position.set(0,0,5*S); g.add(hBar);
    const vBar=new THREE.Mesh(new THREE.BoxGeometry(3*S,122*S,8*S),creamMat); vBar.position.set(0,0,5*S); g.add(vBar);
    // Curtains
    [-1,1].forEach(s=>{
      const curtain=new THREE.Mesh(new THREE.BoxGeometry(28*S,145*S,6*S),curtainMat); curtain.position.set(s*58*S,0,3*S); g.add(curtain);
      // Swag fold effect
      for(let i=0;i<4;i++){
        const fold=new THREE.Mesh(new THREE.BoxGeometry(6*S,145*S,8*S),new THREE.MeshLambertMaterial({color:0x3a0c06,side:THREE.DoubleSide}));
        fold.position.set(s*(58*S-8+i*7*S),0,2*S); g.add(fold);
      }
    });
    // Pelmet
    const pelm=new THREE.Mesh(new THREE.BoxGeometry(130*S,18*S,14*S),curtainMat); pelm.position.set(0,73*S,0); g.add(pelm);
    const pelmTrim=new THREE.Mesh(new THREE.BoxGeometry(132*S,6*S,14*S),goldMat); pelmTrim.position.set(0,65*S,0); g.add(pelmTrim);
    g.position.set(x,y,z); g.rotation.y=rotY; scene.add(g);
  }

  // ── Fireplace — back wall ──
  (function(){
    const fw=180*S,fh=190*S,fd=55*S,fx=0,fz=-RD/2+28*S;
    // Marble surround
    const surL=new THREE.Mesh(new THREE.BoxGeometry(30*S,fh,fd),marble); surL.position.set(fx-fw/2-15*S,fh/2,fz); scene.add(surL);
    const surR=surL.clone(); surR.position.x=fx+fw/2+15*S; scene.add(surR);
    const surT=new THREE.Mesh(new THREE.BoxGeometry(fw+60*S,24*S,fd),marble); surT.position.set(fx,fh-12*S,fz); scene.add(surT);
    // Mantelshelf
    const mant=new THREE.Mesh(new THREE.BoxGeometry(fw+90*S,12*S,64*S),marble); mant.position.set(fx,fh+6*S,fz-5*S); scene.add(mant);
    // Overmantel frame
    const omF=new THREE.Mesh(new THREE.BoxGeometry(fw+56*S,140*S,10*S),richWood); omF.position.set(fx,fh+83*S,fz-4*S); scene.add(omF);
    const omG=new THREE.Mesh(new THREE.BoxGeometry(fw+44*S,128*S,9*S),goldMat); omG.position.set(fx,fh+83*S,fz-3.5*S); scene.add(omG);
    // Painting in overmantel
    const paintTex=canvasTex((ctx,w,h)=>{
      const bg=ctx.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#1a3a5c'); bg.addColorStop(0.5,'#2a5a3a'); bg.addColorStop(1,'#1a2a10');
      ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
      // Sky
      ctx.fillStyle='rgba(100,160,200,0.5)'; ctx.fillRect(0,0,w,h*0.4);
      // Mountains
      ctx.fillStyle='#3a4a2a';
      ctx.beginPath(); ctx.moveTo(0,h*0.45); ctx.lineTo(w*0.2,h*0.2); ctx.lineTo(w*0.4,h*0.38); ctx.lineTo(w*0.6,h*0.15); ctx.lineTo(w*0.8,h*0.35); ctx.lineTo(w,h*0.4); ctx.lineTo(w,h*0.6); ctx.lineTo(0,h*0.6); ctx.fill();
      // Foreground trees
      ctx.fillStyle='#1a3010';
      [[w*0.1,h*0.55],[w*0.25,h*0.52],[w*0.75,h*0.54],[w*0.88,h*0.56]].forEach(([tx,ty])=>{
        ctx.beginPath(); ctx.moveTo(tx,ty-40); ctx.lineTo(tx-18,ty+40); ctx.lineTo(tx+18,ty+40); ctx.fill();
      });
      // River
      ctx.fillStyle='rgba(80,140,180,0.6)';
      ctx.beginPath(); ctx.moveTo(w*0.38,h*0.55); ctx.quadraticCurveTo(w*0.5,h*0.7,w*0.45,h); ctx.lineTo(w*0.55,h); ctx.quadraticCurveTo(w*0.6,h*0.7,w*0.55,h*0.55); ctx.fill();
      // Vignette
      const vig=ctx.createRadialGradient(w/2,h/2,w*0.2,w/2,h/2,w*0.7);
      vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.5)');
      ctx.fillStyle=vig; ctx.fillRect(0,0,w,h);
    },400,300);
    const paintGroup=new THREE.Group();
    const paint=new THREE.Mesh(new THREE.PlaneGeometry(fw+34*S,120*S),new THREE.MeshBasicMaterial({map:paintTex,side:THREE.DoubleSide}));
    paintGroup.add(paint);
    paintGroup.position.set(fx,fh+83*S,fz);
    scene.add(paintGroup);
    FURNITURE['pic_fire']={group:paintGroup,defaults:{x:fx,z:fz,r:0}};

    // Firebox
    const box=new THREE.Mesh(new THREE.BoxGeometry(fw,fh-30*S,fd+10*S),blackMat); box.position.set(fx,(fh-30*S)/2+8*S,fz+5*S); scene.add(box);
    const fback=new THREE.Mesh(new THREE.BoxGeometry(fw-8*S,fh-32*S,6*S),fireBrick); fback.position.set(fx,(fh-32*S)/2+8*S,fz-28*S); scene.add(fback);
    // Hearth
    const hearth=new THREE.Mesh(new THREE.BoxGeometry(fw+46*S,6*S,66*S),marbleDk); hearth.position.set(fx,3*S,fz+22*S); scene.add(hearth);
    // Grate
    for(let i=-3;i<=3;i++){ const bar=new THREE.Mesh(new THREE.BoxGeometry(4*S,28*S,42*S),blackMat); bar.position.set(fx+i*18*S,18*S,fz-4*S); scene.add(bar); }
    // Embers & flames
    const eb=new THREE.Mesh(new THREE.BoxGeometry(fw-20*S,8*S,32*S),emberMat); eb.position.set(fx,12*S,fz-4*S); scene.add(eb);
    [[fx,36*S],[fx-35*S,26*S],[fx+35*S,26*S],[fx-66*S,18*S],[fx+66*S,18*S]].forEach(([flx,flh])=>{
      const fl=new THREE.Mesh(new THREE.BoxGeometry(22*S,flh,12*S),flameMat); fl.position.set(flx,12*S+flh/2,fz-4*S); scene.add(fl);
    });
    // Fender & tools
    const fend=new THREE.Mesh(new THREE.BoxGeometry(fw+26*S,14*S,6*S),brassMat); fend.position.set(fx,7*S,fz+45*S); scene.add(fend);
    const tp=new THREE.Mesh(new THREE.CylinderGeometry(3*S,3*S,58*S,6),brassMat); tp.position.set(fx+fw/2+26*S,29*S,fz+18*S); scene.add(tp);
    const tb=new THREE.Mesh(new THREE.CylinderGeometry(10*S,10*S,5*S,8),brassMat); tb.position.set(fx+fw/2+26*S,2*S,fz+18*S); scene.add(tb);
    // Mantel clock
    const ck=new THREE.Mesh(new THREE.BoxGeometry(28*S,40*S,16*S),darkWood); ck.position.set(fx,fh+30*S,fz-2*S); scene.add(ck);
    const ckface=new THREE.Mesh(new THREE.PlaneGeometry(22*S,22*S),creamMat); ckface.position.set(fx,fh+30*S,fz+6*S); scene.add(ckface);
    // Mantel candles
    [fw/2+42*S,fw/2+60*S,-fw/2-42*S,-fw/2-60*S].forEach(cx=>{
      const cst=new THREE.Mesh(new THREE.CylinderGeometry(4*S,4*S,5*S,8),brassMat); cst.position.set(cx,fh+5*S,fz-2*S); scene.add(cst);
      const cnd=new THREE.Mesh(new THREE.CylinderGeometry(3*S,3*S,20*S,8),candleWax); cnd.position.set(cx,fh+16*S,fz-2*S); scene.add(cnd);
      const cfl=new THREE.Mesh(new THREE.SphereGeometry(3*S,6,6),candleFire); cfl.scale.set(0.6,1.4,0.6); cfl.position.set(cx,fh+28*S,fz-2*S); scene.add(cfl);
    });
    // Mantel vases
    [-1,1].forEach(s=>{
      const vase=new THREE.Mesh(new THREE.CylinderGeometry(6*S,8*S,24*S,10),new THREE.MeshLambertMaterial({color:0x1a4a6a})); vase.position.set(s*(fw/2+30*S),fh+18*S,fz-2*S); scene.add(vase);
    });
  })();

  // ── Portraits on walls ──
  function makePortrait(x,y,z,rotY,drawFn){
    const g=new THREE.Group();
    const fw2=100*S,fh2=130*S;
    g.add(new THREE.Mesh(new THREE.BoxGeometry(fw2+18*S,fh2+18*S,8*S),richWood));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(fw2+6*S,fh2+6*S,7*S),goldMat));
    const tex=canvasTex(drawFn,200,260);
    const pic=new THREE.Mesh(new THREE.PlaneGeometry(fw2,fh2),new THREE.MeshBasicMaterial({map:tex,side:THREE.DoubleSide}));
    pic.position.z=5*S; g.add(pic);
    g.position.set(x,y,z); g.rotation.y=rotY; scene.add(g);
  }

  function drawPortrait1(ctx,w,h){
    ctx.fillStyle='#2a1a0a'; ctx.fillRect(0,0,w,h);
    const bg=ctx.createLinearGradient(0,0,w,h); bg.addColorStop(0,'#3a2010'); bg.addColorStop(1,'#180a04');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#c8a878'; ctx.beginPath(); ctx.ellipse(w/2,78,30,34,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a0808'; ctx.beginPath(); ctx.ellipse(w/2,56,32,26,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#2a1040'; ctx.beginPath(); ctx.moveTo(w*0.25,112); ctx.lineTo(w*0.75,112); ctx.lineTo(w*0.78,h); ctx.lineTo(w*0.22,h); ctx.fill();
    ctx.fillStyle='#d4c0a0'; ctx.beginPath(); ctx.ellipse(w/2,110,14,10,0,0,Math.PI*2); ctx.fill();
  }
  function drawPortrait2(ctx,w,h){
    ctx.fillStyle='#1a1408'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#c8a070'; ctx.beginPath(); ctx.ellipse(w/2,72,28,32,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#0a0806'; ctx.beginPath(); ctx.ellipse(w/2,52,30,22,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#080808'; ctx.beginPath(); ctx.moveTo(w*0.26,104); ctx.lineTo(w*0.74,104); ctx.lineTo(w*0.78,h); ctx.lineTo(w*0.22,h); ctx.fill();
    ctx.fillStyle='#e8e0d0'; ctx.beginPath(); ctx.ellipse(w/2,106,12,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#8a5010'; ctx.beginPath(); ctx.ellipse(w/2-20,116,8,3,0.3,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#8a5010'; ctx.beginPath(); ctx.ellipse(w/2+20,116,8,3,-0.3,0,Math.PI*2); ctx.fill();
  }
  function drawPortrait3(ctx,w,h){
    const bg=ctx.createLinearGradient(0,0,0,h); bg.addColorStop(0,'#1a2a3a'); bg.addColorStop(1,'#0a1420');
    ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#3a6a8a'; ctx.fillRect(0,h*0.55,w,h*0.45);
    ctx.fillStyle='rgba(180,220,255,0.6)';
    [[w*0.2,h*0.12,45,16],[w*0.7,h*0.08,60,18]].forEach(([cx,cy,rw,rh])=>{ ctx.beginPath(); ctx.ellipse(cx,cy,rw,rh,0,0,Math.PI*2); ctx.fill(); });
    ctx.fillStyle='#2a4a2a'; ctx.fillRect(0,h*0.5,w,h*0.1);
    ctx.fillStyle='#1a3010';
    [[w*0.15,h*0.52],[w*0.82,h*0.5]].forEach(([tx,ty])=>{ ctx.beginPath(); ctx.moveTo(tx,ty-30); ctx.lineTo(tx-14,ty+40); ctx.lineTo(tx+14,ty+40); ctx.fill(); });
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,w,h);

  makePortrait( RW/2-13*S,200*S,-260*S,-Math.PI/2,drawPortrait2);
  makePortrait( RW/2-13*S,200*S,  10*S,-Math.PI/2,drawPortrait3);

  // ── Wall sconces ──
  function makeSconce(x,y,z,rotY){
    const g=new THREE.Group();
    const bk=new THREE.Mesh(new THREE.BoxGeometry(22*S,30*S,6*S),goldMat); g.add(bk);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(24*S,4*S,4*S),brassMat); arm.position.x=12*S; g.add(arm);
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(5*S,3*S,8*S,8),brassMat); cup.position.set(24*S,0,0); g.add(cup);
    const wax=new THREE.Mesh(new THREE.CylinderGeometry(3*S,3*S,16*S,8),candleWax); wax.position.set(24*S,10*S,0); g.add(wax);
    const fl=new THREE.Mesh(new THREE.SphereGeometry(3*S,6,6),candleFire); fl.scale.set(0.6,1.3,0.6); fl.position.set(24*S,20*S,0); g.add(fl);
    const pl=new THREE.PointLight(0xff9922,1.0,95*S); pl.position.set(24*S,22*S,0); g.add(pl);
    g.position.set(x,y,z); g.rotation.y=rotY; scene.add(g);
  }
  [-220*S,-60*S,120*S,260*S].forEach(sz=>{ makeSconce(-RW/2+20*S,160*S,sz,0); makeSconce(RW/2-20*S,160*S,sz,Math.PI); });
  [-200*S,0,200*S].forEach(sx=>{ makeSconce(sx,160*S,-RD/2+20*S,Math.PI/2); });

  // ── Chandelier ──
  (function(){
    const g=new THREE.Group();
    const chain=new THREE.Mesh(new THREE.CylinderGeometry(2*S,2*S,55*S,6),brassMat); chain.position.y=28*S; g.add(chain);
    const body=new THREE.Mesh(new THREE.CylinderGeometry(38*S,28*S,20*S,12),brassMat); g.add(body);
    for(let i=0;i<6;i++){
      const ang=i/6*Math.PI*2;
      const arm=new THREE.Mesh(new THREE.BoxGeometry(58*S,4*S,4*S),brassMat); arm.rotation.y=ang; g.add(arm);
      const cup=new THREE.Mesh(new THREE.CylinderGeometry(4*S,3*S,8*S,8),brassMat); cup.position.set(Math.cos(ang)*29*S,-8*S,Math.sin(ang)*29*S); g.add(cup);
      const cnd=new THREE.Mesh(new THREE.CylinderGeometry(3*S,3*S,18*S,8),candleWax); cnd.position.set(Math.cos(ang)*29*S,-1*S,Math.sin(ang)*29*S); g.add(cnd);
      const cfl=new THREE.Mesh(new THREE.SphereGeometry(3*S,6,6),candleFire); cfl.scale.set(0.6,1.4,0.6); cfl.position.set(Math.cos(ang)*29*S,10*S,Math.sin(ang)*29*S); g.add(cfl);
    }
    const pl=new THREE.PointLight(0xffcc88,2.2,400*S); g.add(pl);
    g.position.set(0,RH-18*S,-40*S); scene.add(g);
  })();


  function makeWallPic(regId, x, y, z, rotY, imgKey, picW, picH) {
    const g = new THREE.Group();
    const S = SCALE;
    const fw = picW, fh = picH;
    g.add(new THREE.Mesh(new THREE.BoxGeometry(fw+16*S, fh+16*S, 8*S),
      new THREE.MeshLambertMaterial({color:0x1e0e04})));
    g.add(new THREE.Mesh(new THREE.BoxGeometry(fw+6*S, fh+6*S, 7*S),
      new THREE.MeshLambertMaterial({color:0xb8860b})));
    const img = new Image();
    img.onload = () => {
      const tex = new THREE.Texture(img); tex.needsUpdate = true;
      const pic = new THREE.Mesh(
        new THREE.PlaneGeometry(fw, fh),
        new THREE.MeshBasicMaterial({map:tex, side:THREE.DoubleSide})
      );
      pic.position.z = 5*S; g.add(pic);
    };
    img.src = WALL_PICS[imgKey];
    g.position.set(x, y, z);
    g.rotation.y = rotY;
    scene.add(g);
    FURNITURE[regId] = { group:g, defaults:{x, z:z, r:rotY*180/Math.PI} };
  }


  // ── Persian rug ──
  const rugTex=canvasTex((ctx,w,h)=>{
    ctx.fillStyle='#5a1006'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle='#8a5c10'; ctx.lineWidth=4; ctx.strokeRect(10,10,w-20,h-20);
    ctx.lineWidth=2; ctx.strokeRect(22,22,w-44,h-44);
    ctx.strokeStyle='rgba(150,110,30,0.5)'; ctx.lineWidth=1.5;
    for(let i=0;i<8;i++) for(let j=0;j<10;j++){
      const cx2=30+i*28,cy2=30+j*28;
      ctx.beginPath(); ctx.moveTo(cx2,cy2-11); ctx.lineTo(cx2+11,cy2); ctx.lineTo(cx2,cy2+11); ctx.lineTo(cx2-11,cy2); ctx.closePath(); ctx.stroke();
    }
    ctx.fillStyle='rgba(100,60,5,0.25)'; ctx.beginPath(); ctx.ellipse(w/2,h/2,55,75,0,0,Math.PI*2); ctx.fill();
  },256,320);
  const rug=new THREE.Mesh(new THREE.PlaneGeometry(330*S,400*S),new THREE.MeshBasicMaterial({map:rugTex,side:THREE.DoubleSide}));
  rug.rotation.x=-Math.PI/2; rug.position.set(0,1.5*S,-20*S); scene.add(rug);

  // ── Entrance doors ──
  const dW=120*S,dH=220*S,dfMat=new THREE.MeshLambertMaterial({color:0x1a0a02});
  [-1,1].forEach(s=>{ const post=new THREE.Mesh(new THREE.BoxGeometry(10*S,dH,10*S),dfMat); post.position.set(s*(dW/2+5*S),dH/2,RD/2-8*S); scene.add(post); });
  const lin=new THREE.Mesh(new THREE.BoxGeometry(dW+20*S,12*S,10*S),dfMat); lin.position.set(0,dH-6*S,RD/2-8*S); scene.add(lin);
  [-1,1].forEach(s=>{
    const door=new THREE.Mesh(new THREE.BoxGeometry(dW/2-2*S,dH-14*S,8*S),midWood); door.position.set(s*dW/4,dH/2,RD/2-6*S); scene.add(door);
    [dH*0.18,dH*0.52].forEach(py=>{ const pnl=new THREE.Mesh(new THREE.BoxGeometry(dW/2-16*S,dH*0.25,4*S),richWood); pnl.position.set(s*dW/4,py,RD/2-2*S); scene.add(pnl); });
    const hdl=new THREE.Mesh(new THREE.SphereGeometry(4*S,8,8),brassMat); hdl.position.set(s*(dW/4-14*S),dH*0.4,RD/2-2*S); scene.add(hdl);
  });
  const div=new THREE.Mesh(new THREE.BoxGeometry(4*S,dH-14*S,9*S),darkWood); div.position.set(0,dH/2,RD/2-5*S); scene.add(div);
}

// ══════════════════════════════════════
//  FURNITURE
// ══════════════════════════════════════
function buildFurniture(){
  const S=SCALE;
  const brassMat   = new THREE.MeshLambertMaterial({color:0x9a7020});
  const goldMat    = new THREE.MeshLambertMaterial({color:0xb8860b});
  const darkWood   = new THREE.MeshLambertMaterial({color:0x1e0e04});
  const midWood    = new THREE.MeshLambertMaterial({color:0x3a1c08});
  const richWood   = new THREE.MeshLambertMaterial({color:0x5c2e0e});
  const leather    = new THREE.MeshLambertMaterial({color:0x5a1a08});
  const leatherDk  = new THREE.MeshLambertMaterial({color:0x350e04});
  const velvet     = new THREE.MeshLambertMaterial({color:0x2a1a3a});
  const velvetDk   = new THREE.MeshLambertMaterial({color:0x18101e});
  const creamMat   = new THREE.MeshLambertMaterial({color:0xd4c9a8});
  const blackMat   = new THREE.MeshLambertMaterial({color:0x080402});
  const glassMat   = new THREE.MeshLambertMaterial({color:0x88aabb,transparent:true,opacity:0.35});
  const candleWax  = new THREE.MeshLambertMaterial({color:0xf0e8c0});
  const candleFire = new THREE.MeshLambertMaterial({color:0xffcc44,emissive:0xff8800,emissiveIntensity:1.0});
  const ivoryMat   = new THREE.MeshLambertMaterial({color:0xf0e8d0});
  const plantGreen = new THREE.MeshLambertMaterial({color:0x1a4010});
  const potMat     = new THREE.MeshLambertMaterial({color:0x6a3a20});
  const bookMats   = [
    new THREE.MeshLambertMaterial({color:0x5a1a08}),
    new THREE.MeshLambertMaterial({color:0x1a3a1a}),
    new THREE.MeshLambertMaterial({color:0x1a1a4a}),
    new THREE.MeshLambertMaterial({color:0x4a3a10}),
    new THREE.MeshLambertMaterial({color:0x3a1a2a}),
  ];

  function reg(id,group,x,z,rotDeg){
    group.position.set(x,0,z);
    group.rotation.y=rotDeg*Math.PI/180;
    scene.add(group);
    FURNITURE[id]={group,defaults:{x,z,r:rotDeg}};
  }

  // ── Chesterfield sofa ──
  function makeChesterfield(matBase,matDk){
    const g=new THREE.Group();
    const W=240*S,D=90*S,SH=52*S,BH=68*S,legH=14*S;
    [[-W/2+14*S,D/2-14*S],[W/2-14*S,D/2-14*S],[-W/2+14*S,-D/2+14*S],[W/2-14*S,-D/2+14*S]].forEach(([lx,lz])=>{
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(4*S,5*S,legH,6),brassMat); leg.position.set(lx,legH/2,lz); g.add(leg);
    });
    const base=new THREE.Mesh(new THREE.BoxGeometry(W,SH,D),matBase); base.position.y=legH+SH/2; g.add(base);
    const back=new THREE.Mesh(new THREE.BoxGeometry(W,BH,18*S),matBase); back.position.set(0,legH+SH+BH/2,-D/2+9*S); g.add(back);
    [-1,1].forEach(s=>{
      const arm=new THREE.Mesh(new THREE.BoxGeometry(22*S,SH+BH*0.65,D),matBase); arm.position.set(s*(W/2-11*S),legH+(SH+BH*0.65)/2,0); g.add(arm);
      const aTop=new THREE.Mesh(new THREE.BoxGeometry(28*S,12*S,D+4*S),matDk); aTop.position.set(s*(W/2-11*S),legH+SH+BH*0.65+6*S,0); g.add(aTop);
    });
    for(let i=0;i<3;i++){
      const cush=new THREE.Mesh(new THREE.BoxGeometry((W-44*S)/3-4*S,16*S,D-20*S),matDk);
      cush.position.set(-W/2+22*S+((W-44*S)/3+2*S)*(i+0.5),legH+SH+8*S,8*S); g.add(cush);
    }
    for(let i=0;i<4;i++) for(let j=0;j<2;j++){
      const btn=new THREE.Mesh(new THREE.SphereGeometry(2.5*S,6,6),goldMat);
      btn.position.set(-W/2+30*S+(W-60*S)/3*i,legH+SH+18*S+j*26*S,-D/2+2*S); g.add(btn);
    }
    return g;
  }

  // ── Wingback chair ──
  function makeWingback(matBase){
    const g=new THREE.Group();
    const W=88*S,D=86*S,SH=48*S,legH=14*S;
    [[-W/2+10*S,D/2-10*S],[W/2-10*S,D/2-10*S],[-W/2+10*S,-D/2+10*S],[W/2-10*S,-D/2+10*S]].forEach(([lx,lz])=>{
      const leg=new THREE.Mesh(new THREE.BoxGeometry(6*S,legH,6*S),richWood); leg.position.set(lx,legH/2,lz); g.add(leg);
    });
    const base=new THREE.Mesh(new THREE.BoxGeometry(W,SH,D),matBase); base.position.y=legH+SH/2; g.add(base);
    const back=new THREE.Mesh(new THREE.BoxGeometry(W,88*S,16*S),matBase); back.position.set(0,legH+SH+44*S,-D/2+8*S); g.add(back);
    [-1,1].forEach(s=>{
      const wing=new THREE.Mesh(new THREE.BoxGeometry(16*S,54*S,D/2),matBase); wing.position.set(s*(W/2-8*S),legH+SH+48*S,-D/4); g.add(wing);
      const arm=new THREE.Mesh(new THREE.BoxGeometry(16*S,SH*0.55,D),matBase); arm.position.set(s*(W/2-8*S),legH+SH*0.68,0); g.add(arm);
    });
    return g;
  }

  reg('sofa_main', makeChesterfield(leather,leatherDk),    0,     90*S, 180);
  reg('sofa_left', makeChesterfield(velvet,velvetDk),  -280*S,   -20*S,  90);
  reg('sofa_right',makeChesterfield(velvet,velvetDk),   280*S,   -20*S, -90);
  reg('chair_l',   makeWingback(leather),              -130*S,    30*S, 150);
  reg('chair_r',   makeWingback(leather),               130*S,    30*S,-150);

  // ── Coffee table ──
  function makeCoffeeTable(){
    const g=new THREE.Group();
    [[-65*S,-28*S],[65*S,-28*S],[-65*S,28*S],[65*S,28*S]].forEach(([lx,lz])=>{
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(4*S,5*S,44*S,8),richWood); leg.position.set(lx,22*S,lz); g.add(leg);
    });
    const shelf=new THREE.Mesh(new THREE.BoxGeometry(140*S,5*S,62*S),midWood); shelf.position.y=14*S; g.add(shelf);
    const top=new THREE.Mesh(new THREE.BoxGeometry(162*S,8*S,82*S),richWood); top.position.y=46*S; g.add(top);
    const glass=new THREE.Mesh(new THREE.BoxGeometry(152*S,4*S,72*S),glassMat); glass.position.y=50*S; g.add(glass);
    // Items: book, teacup, small vase
    const bk=new THREE.Mesh(new THREE.BoxGeometry(32*S,5*S,24*S),bookMats[0]); bk.position.set(28*S,55*S,10*S); bk.rotation.y=0.2; g.add(bk);
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(6*S,5*S,8*S,8),creamMat); cup.position.set(-28*S,55*S,-8*S); g.add(cup);
    const vase=new THREE.Mesh(new THREE.CylinderGeometry(5*S,7*S,16*S,8),new THREE.MeshLambertMaterial({color:0x1a4a6a})); vase.position.set(-28*S,55*S,14*S); g.add(vase);
    return g;
  }
  reg('coffee', makeCoffeeTable(), 0, -20*S, 0);

  // ── Side tables ──
  function makeSideTable(){
    const g=new THREE.Group();
    [[-22*S,-16*S],[22*S,-16*S],[-22*S,16*S],[22*S,16*S]].forEach(([lx,lz])=>{
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(3*S,4*S,70*S,6),midWood); leg.position.set(lx,35*S,lz); g.add(leg);
    });
    const top=new THREE.Mesh(new THREE.BoxGeometry(60*S,7*S,48*S),richWood); top.position.y=72*S; g.add(top);
    // Lamp
    const base=new THREE.Mesh(new THREE.CylinderGeometry(7*S,9*S,6*S,8),brassMat); base.position.y=79*S; g.add(base);
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(2*S,2*S,40*S,6),brassMat); pole.position.y=102*S; g.add(pole);
    const shade=new THREE.Mesh(new THREE.CylinderGeometry(18*S,10*S,22*S,10,1,true),new THREE.MeshLambertMaterial({color:0xd4a060,side:THREE.DoubleSide})); shade.position.y=130*S; g.add(shade);
    const bulb=new THREE.Mesh(new THREE.SphereGeometry(5*S,8,8),new THREE.MeshLambertMaterial({color:0xffeecc,emissive:0xffcc88,emissiveIntensity:0.8})); bulb.position.y=122*S; g.add(bulb);
    const lp=new THREE.PointLight(0xffcc88,1.4,130*S); lp.position.y=130*S; g.add(lp);
    return g;
  }
  reg('side_l', makeSideTable(), -190*S, 50*S, 0);
  reg('side_r', makeSideTable(),  190*S, 50*S, 0);

  // ── Bookcase ──
  function makeBookcase(){
    const g=new THREE.Group();
    const BW=200*S,BH=280*S,BD=36*S;
    const back=new THREE.Mesh(new THREE.BoxGeometry(BW,BH,6*S),darkWood); back.position.set(0,BH/2,-BD/2+3*S); g.add(back);
    [-1,1].forEach(s=>{ const side=new THREE.Mesh(new THREE.BoxGeometry(10*S,BH,BD),midWood); side.position.set(s*(BW/2-5*S),BH/2,0); g.add(side); });
    new THREE.Mesh(new THREE.BoxGeometry(BW,10*S,BD),midWood); // base
    const btm=new THREE.Mesh(new THREE.BoxGeometry(BW,10*S,BD),midWood); btm.position.set(0,5*S,0); g.add(btm);
    const crown=new THREE.Mesh(new THREE.BoxGeometry(BW+8*S,18*S,BD+6*S),richWood); crown.position.set(0,BH+9*S,0); g.add(crown);
    [50*S,110*S,170*S,230*S].forEach(sy=>{
      const shelf=new THREE.Mesh(new THREE.BoxGeometry(BW-20*S,6*S,BD-4*S),midWood); shelf.position.set(0,sy,0); g.add(shelf);
      let bx=-BW/2+14*S;
      while(bx<BW/2-14*S){
        const bw=(8+Math.random()*10)*S,bh=(52+Math.random()*32)*S;
        const bk=new THREE.Mesh(new THREE.BoxGeometry(bw,bh,BD-10*S),bookMats[Math.floor(Math.random()*5)]);
        bk.position.set(bx+bw/2,sy+3*S+bh/2,0); g.add(bk); bx+=bw+1*S;
      }
    });
    [-1,1].forEach(s=>{ const gd=new THREE.Mesh(new THREE.BoxGeometry((BW-20*S)/2-2*S,BH/2-10*S,4*S),glassMat); gd.position.set(s*(BW/4-5*S),BH*0.75,BD/2-2*S); g.add(gd); });
    const mbar=new THREE.Mesh(new THREE.BoxGeometry(6*S,BH/2,5*S),richWood); mbar.position.set(0,BH*0.75,BD/2-2*S); g.add(mbar);
    const grl=new THREE.Mesh(new THREE.BoxGeometry(BW,6*S,5*S),richWood); grl.position.set(0,BH/2+3*S,BD/2-2*S); g.add(grl);
    return g;
  }
  reg('bookcase_l', makeBookcase(), -330*S, -220*S,  90);
  reg('bookcase_r', makeBookcase(),  330*S, -220*S, -90);

  // ── Upright piano ──
  function makePiano(){
    const g=new THREE.Group();
    const body=new THREE.Mesh(new THREE.BoxGeometry(180*S,130*S,60*S),blackMat); body.position.y=65*S; g.add(body);
    const top2=new THREE.Mesh(new THREE.BoxGeometry(182*S,6*S,62*S),blackMat); top2.position.y=132*S; g.add(top2);
    const keys=new THREE.Mesh(new THREE.BoxGeometry(140*S,6*S,18*S),ivoryMat); keys.position.set(0,82*S,32*S); g.add(keys);
    // Black keys
    for(let i=0;i<10;i++){
      const bk=new THREE.Mesh(new THREE.BoxGeometry(6*S,8*S,12*S),blackMat); bk.position.set(-65*S+i*14*S,88*S,28*S); g.add(bk);
    }
    const music=new THREE.Mesh(new THREE.BoxGeometry(130*S,60*S,4*S),new THREE.MeshLambertMaterial({color:0x1a1a2a})); music.position.set(0,106*S,26*S); music.rotation.x=-0.3; g.add(music);
    // Legs
    [[-80*S,0],[80*S,0]].forEach(([lx,lz])=>{
      const leg=new THREE.Mesh(new THREE.BoxGeometry(12*S,20*S,12*S),blackMat); leg.position.set(lx,10*S,lz); g.add(leg);
    });
    // Stool
    const stool=new THREE.Mesh(new THREE.BoxGeometry(80*S,36*S,40*S),new THREE.MeshLambertMaterial({color:0x2a1a0a})); stool.position.set(0,18*S,60*S); g.add(stool);
    return g;
  }
  reg('piano', makePiano(), -280*S, -270*S, 90);

  // ── Potted plants ──
  function makePlant(){
    const g=new THREE.Group();
    const pot=new THREE.Mesh(new THREE.CylinderGeometry(16*S,12*S,22*S,10),potMat); pot.position.y=11*S; g.add(pot);
    const soil=new THREE.Mesh(new THREE.CylinderGeometry(15*S,15*S,4*S,10),new THREE.MeshLambertMaterial({color:0x1a0e04})); soil.position.y=22*S; g.add(soil);
    // Leaves (overlapping planes)
    for(let i=0;i<8;i++){
      const ang=i/8*Math.PI*2;
      const leaf=new THREE.Mesh(new THREE.PlaneGeometry(20*S,40*S),plantGreen);
      leaf.position.set(Math.cos(ang)*8*S,44*S,Math.sin(ang)*8*S);
      leaf.rotation.y=ang; leaf.rotation.z=0.4; g.add(leaf);
    }
    for(let i=0;i<6;i++){
      const ang=i/6*Math.PI*2+0.3;
      const leaf=new THREE.Mesh(new THREE.PlaneGeometry(16*S,32*S),new THREE.MeshLambertMaterial({color:0x1e5014,side:THREE.DoubleSide}));
      leaf.position.set(Math.cos(ang)*12*S,56*S,Math.sin(ang)*12*S);
      leaf.rotation.y=ang; leaf.rotation.z=0.6; g.add(leaf);
    }
    return g;
  }
  reg('plant_l', makePlant(), -300*S, 270*S, 0);
  reg('plant_r', makePlant(),  300*S, 270*S, 0);

  // ── Floor candelabra ──
  function makeCandelabra(){
    const g=new THREE.Group();
    const base=new THREE.Mesh(new THREE.CylinderGeometry(18*S,22*S,10*S,8),brassMat); base.position.y=5*S; g.add(base);
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(4*S,7*S,136*S,8),brassMat); pole.position.y=73*S; g.add(pole);
    const mid=new THREE.Mesh(new THREE.SphereGeometry(9*S,8,8),brassMat); mid.position.y=73*S; g.add(mid);
    const arm1=new THREE.Mesh(new THREE.BoxGeometry(76*S,5*S,9*S),brassMat); arm1.position.y=140*S; g.add(arm1);
    const arm2=new THREE.Mesh(new THREE.BoxGeometry(9*S,5*S,76*S),brassMat); arm2.position.y=140*S; g.add(arm2);
    [[0,0],[30*S,0],[-30*S,0],[0,30*S],[0,-30*S]].forEach(([cx,cz])=>{
      const wax=new THREE.Mesh(new THREE.CylinderGeometry(3*S,3*S,20*S,6),candleWax); wax.position.set(cx,152*S,cz); g.add(wax);
      const fl=new THREE.Mesh(new THREE.SphereGeometry(3*S,6,6),candleFire); fl.scale.set(0.6,1.3,0.6); fl.position.set(cx,164*S,cz); g.add(fl);
    });
    const pl=new THREE.PointLight(0xff9922,1.3,150*S); pl.position.y=166*S; g.add(pl);
    return g;
  }
  reg('cand_l', makeCandelabra(), -280*S, 200*S, 0);
  reg('cand_r', makeCandelabra(),  280*S, 200*S, 0);
}

function saveLayout(){
  const data={};
  Object.keys(FURNITURE).forEach(id=>{ const f=FURNITURE[id]; data[id]={x:f.group.position.x,z:f.group.position.z,r:f.group.rotation.y,v:f.group.visible}; });
  localStorage.setItem(SAVE_KEY,JSON.stringify(data));
}
function loadLayout(){
  const raw=localStorage.getItem(SAVE_KEY); if(!raw)return;
  try{ const data=JSON.parse(raw); Object.keys(data).forEach(id=>{ const f=FURNITURE[id]; if(!f)return; f.group.position.x=data[id].x; f.group.position.z=data[id].z; f.group.rotation.y=data[id].r; if(data[id].v===false) f.group.visible=false; }); }catch(e){}
}
function initEditor(){
  let sel='sofa_main';
  const slX=document.getElementById('sl-x'),slZ=document.getElementById('sl-z'),slR=document.getElementById('sl-r');
  const valX=document.getElementById('val-x'),valZ=document.getElementById('val-z'),valR=document.getElementById('val-r');
  function sync(){ const f=FURNITURE[sel]; if(!f)return; slX.value=Math.round(f.group.position.x); slZ.value=Math.round(f.group.position.z); const deg=Math.round(f.group.rotation.y*180/Math.PI+720)%360; slR.value=deg; valX.textContent=slX.value; valZ.textContent=slZ.value; valR.textContent=deg+'°'; }
  function apply(){ const f=FURNITURE[sel]; if(!f)return; f.group.position.x=parseFloat(slX.value); f.group.position.z=parseFloat(slZ.value); f.group.rotation.y=parseFloat(slR.value)*Math.PI/180; valX.textContent=slX.value; valZ.textContent=slZ.value; valR.textContent=slR.value+'°'; }
  document.getElementById('editToggle').onclick=()=>document.getElementById('editPanel').classList.toggle('open');
  document.getElementById('editClose').onclick=()=>document.getElementById('editPanel').classList.remove('open');
  document.querySelectorAll('.piece-btn').forEach(btn=>{ btn.onclick=()=>{ document.querySelectorAll('.piece-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); sel=btn.dataset.piece; sync(); }; });
  slX.oninput=slZ.oninput=slR.oninput=()=>{ apply(); saveLayout(); };
  document.getElementById('resetBtn').onclick=()=>{ const f=FURNITURE[sel]; if(!f)return; const d=f.defaults; f.group.position.set(d.x,0,d.z); f.group.rotation.y=d.r*Math.PI/180; sync(); saveLayout(); };
  document.getElementById('hideBtn').onclick=()=>{ const f=FURNITURE[sel]; if(!f)return; f.group.visible=!f.group.visible; document.getElementById('hideBtn').textContent=f.group.visible?'Hide / Show':'Show (hidden)'; saveLayout(); };
  sync();
}

// ══════════════════════════════════════
//  EXIT & MOVEMENT
// ══════════════════════════════════════
const exitCooldown=0;
let exitTriggered=false;
let nearExit=false;
function checkExitDoor(){
  if(exitTriggered)return;
  if(Date.now()<exitCooldown)return;
  nearExit=camera.position.x>-150*SCALE&&camera.position.x<150*SCALE&&camera.position.z>140*SCALE;
  const hint=document.getElementById('doorHint');
  if(hint)hint.style.display=nearExit?'block':'none';
}
function updateRotation(){ camera.rotation.order='YXZ'; camera.rotation.set(0,yaw,0); }
function onKeyDown(e){
  if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
  if(e.code==='KeyE'&&nearExit&&!exitTriggered){
    // Don't trigger exit if typing in an input field
    if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA')return;
    exitTriggered=true;
    document.getElementById('doorHint').style.display='none';
    document.getElementById('exitFade').classList.add('show');
    if(window.SoundSystem)SoundSystem.play('doorOpen');
    setTimeout(()=>window.location.href='floor1.html?from=drawingroom',600);
    return;
  }
  if(e.code==='KeyW'||e.code==='ArrowUp')moveForward=true; if(e.code==='KeyS'||e.code==='ArrowDown')moveBackward=true; if(e.code==='ArrowLeft')turnLeft=true; if(e.code==='ArrowRight')turnRight=true;
}
function onKeyUp(e){ if(e.code==='KeyW'||e.code==='ArrowUp')moveForward=false; if(e.code==='KeyS'||e.code==='ArrowDown')moveBackward=false; if(e.code==='ArrowLeft')turnLeft=false; if(e.code==='ArrowRight')turnRight=false; }
function animate(){
  requestAnimationFrame(animate);
  const delta=(performance.now()-prevTime)/1000; prevTime=performance.now();
  if(turnLeft)yaw+=2.7*delta; if(turnRight)yaw-=2.7*delta;
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  const mv=Number(moveForward)-Number(moveBackward);
  if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
  camera.position.x+=fwd.x*mv*205*delta; camera.position.z+=fwd.z*mv*205*delta;
  camera.position.x=Math.max(-330*SCALE,Math.min(330*SCALE,camera.position.x));
  camera.position.z=Math.max(-330*SCALE,Math.min(330*SCALE,camera.position.z));
  camera.position.y=100;
  checkExitDoor(); updateRotation(); renderer.render(scene,camera);
  EvidenceSystem.update();
}

window.addEventListener('error', function(e) {
  document.body.style.background = '#111';
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#300;color:#f88;padding:20px;font:14px monospace;z-index:99999;border-radius:8px;white-space:pre-wrap';
  div.textContent = 'ERROR: ' + e.message + '\nFile: ' + e.filename + '\nLine: ' + e.lineno;
  document.body.appendChild(div);
});

try {
  // init called after engine loads
} catch(e) {
  document.body.style.background = '#111';
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#300;color:#f88;padding:20px;font:14px monospace;z-index:99999;border-radius:8px;white-space:pre-wrap';
  div.textContent = 'INIT ERROR: ' + e.message + '\n' + e.stack;
  document.body.appendChild(div);
}

<script>
(async () => {
  await MysteryEngine.init();
  let scenario = await MysteryState.load();
  const isNew = !scenario;
  if (isNew) { scenario = MysteryEngine.generate(); await MysteryState.save(scenario); }
  window._scenario = scenario;
  init();
  MysteryUI.init(scenario, isNew);
  MysteryUI.setZone('drawingroom');
  EvidenceSystem.init({ camera, scene, renderer, zoneId: 'drawingroom' });
  const _sa=()=>{if(window.SoundSystem)SoundSystem.startAmbient();window.removeEventListener('keydown',_sa);window.removeEventListener('click',_sa);};
  window.addEventListener('keydown',_sa);window.addEventListener('click',_sa);
})();
</script>
