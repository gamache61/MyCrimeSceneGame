<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baroque Room</title>
<style>
#exitFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.6s ease;}
#exitFade.show{opacity:1;}
#instructionLine{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:14px;color:#eee;background:rgba(0,0,0,0.6);border-radius:6px;z-index:30;pointer-events:none;white-space:nowrap;}
body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;}
canvas{display:block;}
#fadeOverlay{position:fixed;inset:0;background:#000;z-index:9999;animation:fadeOut 0.8s ease forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
#editHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;}
#editBtn,#saveBtn,#loadBtn,#clearBtn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.72);color:#eee;cursor:pointer;}
#editIndicator{padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,0.20);background:rgba(80,20,20,0.8);color:#ffd0d0;}
#editIndicator.on{background:rgba(20,80,20,0.85);color:#d5ffd5;}
#autoStatus{position:fixed;top:108px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:rgba(0,0,0,0.65);color:#d7f7d7;font:12px/1.35 system-ui;display:none;z-index:70;pointer-events:none;}
#selInfo{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,0.8);color:#aaddff;border-radius:8px;font-size:13px;display:none;z-index:60;pointer-events:none;}
#debugHud{position:fixed;left:10px;bottom:10px;color:#9ff;font:12px monospace;background:rgba(0,0,0,0.7);padding:8px;border-radius:6px;display:none;z-index:100;pointer-events:none;}
</style>
</head>
<body>
<div id="exitFade"></div>
<div id="instructionLine">W/↑ Forward &nbsp; S/↓ Back &nbsp; ←/→ Turn &nbsp; E = Exit &nbsp; M = Edit Mode &nbsp; G = Grid</div>
<div id="doorHint" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#e8c87a;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,160,60,0.4);">Press E — Return to Floor 2</div>
<div id="closetHint" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#f0d060;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,160,60,0.4);">Press E — Enter Dressing Room</div>
<div id="fadeOverlay"></div>
<div id="editHud">
  <button id="editBtn" type="button">Edit Mode</button>
  <button id="saveBtn" type="button">Save Layout</button>
  <button id="loadBtn" type="button">Load Layout</button>
  <button id="clearBtn" type="button">Clear Save</button>
  <div id="editIndicator">OFF</div>
</div>
<div id="autoStatus"></div>
<div id="selInfo"></div>
<div id="debugHud"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const STORAGE_KEY="baroque_room_layout";
const S=0.5;
const RW=1600*S, RD=1600*S, RH=650*S;
let scene,camera,renderer,yaw=0,prevTime=performance.now();
let moveForward=false,moveBackward=false,turnLeft=false,turnRight=false;
let EDIT_MODE=false,selectedObject=null;
const editableObjects=[];
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let _ec=0;
let DEBUG_ON=false,debugGroup=null,positionDisplayInterval=null;
let nearCloset=false,closetTriggered=false,closetDoorsOpen=false;
let closetDoorPivots=[];

function addGroup(g,id){g.userData.editId=id||("grp_"+(++_ec));editableObjects.push(g);scene.add(g);return g;}
function showStatus(msg,ok=true){const el=document.getElementById("autoStatus");el.style.display="block";el.style.color=ok?"#d7f7d7":"#ffd7d7";el.textContent=msg;setTimeout(()=>{el.style.display="none";},2200);}
function updateEditUI(){const ind=document.getElementById("editIndicator");ind.textContent=EDIT_MODE?"ON":"OFF";ind.classList.toggle("on",EDIT_MODE);const btn=document.getElementById("editBtn");btn.textContent=EDIT_MODE?"✏️ Edit Mode: ON":"Edit Mode: OFF";btn.style.background=EDIT_MODE?"rgba(20,80,20,0.85)":"rgba(0,0,0,0.72)";}
function toggleEditMode(){EDIT_MODE=!EDIT_MODE;if(!EDIT_MODE){selectedObject=null;document.getElementById("selInfo").style.display="none";}updateEditUI();}
function saveLayout(){const objects=editableObjects.map(o=>{const wp=new THREE.Vector3();o.getWorldPosition(wp);const wq=new THREE.Quaternion();o.getWorldQuaternion(wq);return{id:o.userData.editId,position:{x:wp.x,y:wp.y,z:wp.z},quaternion:{x:wq.x,y:wq.y,z:wq.z,w:wq.w},scale:{x:o.scale.x,y:o.scale.y,z:o.scale.z}};});localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,objects}));showStatus("✅ Saved");}
function loadLayout(){const json=localStorage.getItem(STORAGE_KEY);if(!json){showStatus("No saved layout",false);return;}try{const d=JSON.parse(json);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}showStatus("✅ Loaded");}catch(e){showStatus("Load failed",false);}}
function clearSave(){localStorage.removeItem(STORAGE_KEY);showStatus("🗑 Cleared");}
function onMouseClick(e){if(!EDIT_MODE)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const meshes=[];editableObjects.forEach(o=>{if(o.isMesh)meshes.push(o);else o.traverse(ch=>{if(ch.isMesh)meshes.push(ch);});});const hits=raycaster.intersectObjects(meshes,false);if(!hits.length){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}let obj=hits[0].object;let cur=obj;while(cur){if(editableObjects.includes(cur)){obj=cur;break;}cur=cur.parent;}selectedObject=obj;document.getElementById("selInfo").style.display="block";document.getElementById("selInfo").textContent=`✏️ ${obj.userData.editId} | Arrows=Move Shift+↑↓=Height R=Rotate Del=Delete`;showStatus("Selected: "+obj.userData.editId);}
function buildDebug(){debugGroup=new THREE.Group();debugGroup.visible=false;scene.add(debugGroup);const g=new THREE.GridHelper(4000,80,0x4488ff,0x222244);g.position.y=5;debugGroup.add(g);const f=new THREE.GridHelper(4000,400,0x335577,0x1a1a22);f.position.y=3;debugGroup.add(f);const a=new THREE.AxesHelper(400);a.position.y=10;debugGroup.add(a);}
function toggleDebug(){DEBUG_ON=!DEBUG_ON;if(debugGroup)debugGroup.visible=DEBUG_ON;const hud=document.getElementById("debugHud");hud.style.display=DEBUG_ON?"block":"none";if(DEBUG_ON){positionDisplayInterval=setInterval(()=>{const p=camera.position,yd=((yaw||0)*(180/Math.PI)).toFixed(1);document.getElementById("debugHud").innerHTML=`X: ${p.x.toFixed(1)}<br>Y: ${p.y.toFixed(1)}<br>Z: ${p.z.toFixed(1)}<br>Yaw: ${yd}°`;},100);}else{clearInterval(positionDisplayInterval);}}

// SVG Texture
const _svgMatCache={};
function makeSVGTexture(svgStr){
  if(_svgMatCache[svgStr])return _svgMatCache[svgStr];
  try{const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;const ctx=canvas.getContext('2d');const blob=new Blob([svgStr],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const tex=new THREE.CanvasTexture(canvas);const mat=new THREE.MeshLambertMaterial({map:tex,color:0xffffff,side:THREE.DoubleSide});const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,512,512);tex.needsUpdate=true;URL.revokeObjectURL(url);};img.src=url;_svgMatCache[svgStr]=mat;return mat;}
  catch(e){return new THREE.MeshLambertMaterial({color:0x2a1a0a,side:THREE.DoubleSide});}
}

const SVG_BAROQUE_PORTRAIT=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300"><rect width="220" height="300" fill="#1a1208"/><rect x="0" y="220" width="220" height="80" fill="#100c04"/>
<rect x="0" y="0" width="220" height="120" fill="#1a1a2a" opacity="0.6"/>
<ellipse cx="110" cy="118" rx="36" ry="44" fill="#c8a060"/><ellipse cx="110" cy="104" rx="30" ry="30" fill="#d4aa70"/>
<ellipse cx="98" cy="109" rx="8" ry="6" fill="#2a1808"/><ellipse cx="98" cy="109" rx="4" ry="4" fill="#060402"/>
<ellipse cx="122" cy="109" rx="8" ry="6" fill="#2a1808"/><ellipse cx="122" cy="109" rx="4" ry="4" fill="#060402"/>
<ellipse cx="96" cy="107" rx="2" ry="1.5" fill="#e8e0d0" opacity="0.6"/><ellipse cx="120" cy="107" rx="2" ry="1.5" fill="#e8e0d0" opacity="0.6"/>
<path d="M82 98 Q90 92 98 97" fill="none" stroke="#2a1808" stroke-width="1.2"/>
<path d="M112 97 Q120 92 128 98" fill="none" stroke="#2a1808" stroke-width="1.2"/>
<path d="M94 126 Q110 134 126 126" fill="#c06050" opacity="0.6"/>
<ellipse cx="110" cy="230" rx="68" ry="80" fill="#2a1848"/>
<ellipse cx="110" cy="222" rx="56" ry="72" fill="#382060"/>
<path d="M42 222 Q110 206 178 222" fill="none" stroke="#d4a820" stroke-width="3"/>
<rect x="80" y="170" width="60" height="16" fill="#d4a820" opacity="0.8"/>
<ellipse cx="110" cy="168" rx="40" ry="12" fill="#d4a820" opacity="0.6"/>
<rect x="50" y="222" width="18" height="78" fill="#2a1848"/>
<rect x="152" y="222" width="18" height="78" fill="#2a1848"/>
<ellipse cx="72" cy="185" rx="8" ry="26" fill="#c8a060" opacity="0.9"/>
<ellipse cx="148" cy="185" rx="8" ry="26" fill="#c8a060" opacity="0.9"/>
<text x="110" y="292" text-anchor="middle" fill="#9a7830" font-size="10" font-family="Georgia,serif" font-style="italic">Louis XIV, 1670</text></svg>`;

const SVG_BAROQUE_CEILING=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#c8b870"/>
<rect x="10" y="10" width="280" height="280" fill="#d4c880" rx="4"/>
<ellipse cx="150" cy="150" rx="120" ry="120" fill="#e8d890" opacity="0.6"/>
<ellipse cx="150" cy="150" rx="80" ry="80" fill="#f0e0a0" opacity="0.5"/>
<ellipse cx="150" cy="150" rx="40" ry="40" fill="#f8e8b0" opacity="0.4"/>
<polygon points="150,30 160,140 150,160 140,140" fill="#c8a820" opacity="0.7"/>
<polygon points="270,150 160,160 140,150 160,140" fill="#c8a820" opacity="0.7"/>
<polygon points="150,270 140,160 150,140 160,160" fill="#c8a820" opacity="0.7"/>
<polygon points="30,150 140,140 160,150 140,160" fill="#c8a820" opacity="0.7"/>
<polygon points="226,74 164,148 148,132" fill="#c8a820" opacity="0.5"/>
<polygon points="226,226 152,164 168,148" fill="#c8a820" opacity="0.5"/>
<polygon points="74,226 136,152 152,168" fill="#c8a820" opacity="0.5"/>
<polygon points="74,74 148,136 132,152" fill="#c8a820" opacity="0.5"/>
<circle cx="150" cy="150" r="20" fill="#d4a820" opacity="0.9"/>
<circle cx="150" cy="150" r="10" fill="#f0c840" opacity="0.8"/>
</svg>`;

function init(){
  setTimeout(()=>{const f=document.getElementById("fadeOverlay");if(f)f.remove();},800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0e0c08);
  scene.fog=new THREE.FogExp2(0x0a0806,0.0004);
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Grand chandelier lighting — warm gold
  scene.add(new THREE.AmbientLight(0x060402,1.0));
  const chandLight=new THREE.PointLight(0xfff0c0,1.5,900);chandLight.position.set(0,RH-60*S,0);scene.add(chandLight);
  const chandLight2=new THREE.PointLight(0xffe8a0,0.9,700);chandLight2.position.set(-RW/4,RH-80*S,0);scene.add(chandLight2);
  const chandLight3=new THREE.PointLight(0xffe8a0,0.9,700);chandLight3.position.set(RW/4,RH-80*S,0);scene.add(chandLight3);
  const fire=new THREE.PointLight(0xff8800,2.0,300);fire.position.set(0,80*S,-RD/2+70*S);scene.add(fire);
  const fire2=new THREE.PointLight(0xff5500,1.0,180);fire2.position.set(0,50*S,-RD/2+50*S);scene.add(fire2);

  buildRoom();
  buildDebug();

  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){try{const d=JSON.parse(saved);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}}catch(err){}}

  document.getElementById("editBtn").addEventListener("click",toggleEditMode);
  document.getElementById("saveBtn").addEventListener("click",saveLayout);
  document.getElementById("loadBtn").addEventListener("click",loadLayout);
  document.getElementById("clearBtn").addEventListener("click",clearSave);
  renderer.domElement.addEventListener("click",onMouseClick);
  document.addEventListener("keydown",onKeyDown);
  document.addEventListener("keyup",onKeyUp);
  window.addEventListener("resize",onResize);
  camera.position.set(0,240*S,RD/2-150*S);
  yaw=0;updateRotation();animate();
}

function buildRoom(){
  const wallMat   =new THREE.MeshLambertMaterial({color:0x1a1408});
  const wallLight =new THREE.MeshLambertMaterial({color:0x221a0c});
  const goldMat   =new THREE.MeshLambertMaterial({color:0x8a6008});
  const goldDark  =new THREE.MeshLambertMaterial({color:0x6a4806});
  const creamMat  =new THREE.MeshLambertMaterial({color:0xd0c8a8});
  const floorMat  =new THREE.MeshLambertMaterial({color:0x1a1408});
  const ceilMat   =new THREE.MeshLambertMaterial({color:0x6a5c20});
  const darkWood  =new THREE.MeshLambertMaterial({color:0x180e04});
  const richWood  =new THREE.MeshLambertMaterial({color:0x281808});
  const marbleMat =new THREE.MeshLambertMaterial({color:0xe8e0d0});
  const marbleDark=new THREE.MeshLambertMaterial({color:0xc0b8a8});
  const ironMat   =new THREE.MeshLambertMaterial({color:0x181614});
  const velvetMat =new THREE.MeshLambertMaterial({color:0x380818});
  const velvetBlue=new THREE.MeshLambertMaterial({color:0x0a1838});
  const candleMat =new THREE.MeshLambertMaterial({color:0xf0e8c8});
  const flameMat  =new THREE.MeshLambertMaterial({color:0xffaa00,emissive:0xff6600,emissiveIntensity:1});
  const emberMat  =new THREE.MeshLambertMaterial({color:0xff3300,emissive:0xaa1100,emissiveIntensity:1});

  // ── Parquet floor ──
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),floorMat);floor.rotation.x=-Math.PI/2;scene.add(floor);
  const pSz=60*S;
  for(let ix=0;ix<Math.ceil(RW/pSz);ix++)for(let iz=0;iz<Math.ceil(RD/pSz);iz++){
    const c=(ix+iz)%2===0?0x1e1608:0x160e04;
    const p=new THREE.Mesh(new THREE.BoxGeometry(pSz-2,2*S,pSz-2),new THREE.MeshLambertMaterial({color:c}));
    p.position.set(-RW/2+pSz*(ix+0.5),1*S,-RD/2+pSz*(iz+0.5));scene.add(p);
    // Diagonal inlay lines
    const inlay=new THREE.Mesh(new THREE.BoxGeometry(pSz-2,2.5*S,2*S),goldDark);
    inlay.rotation.y=Math.PI/4;inlay.position.set(-RW/2+pSz*(ix+0.5),2*S,-RD/2+pSz*(iz+0.5));scene.add(inlay);
  }

  // ── Ornate ceiling ──
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),ceilMat);ceil.rotation.x=Math.PI/2;ceil.position.y=RH;scene.add(ceil);
  // Ceiling fresco panel centre
  const frescoPanel=new THREE.Mesh(new THREE.PlaneGeometry(RW*0.5,RD*0.5),makeSVGTexture(SVG_BAROQUE_CEILING));frescoPanel.rotation.x=Math.PI/2;frescoPanel.position.y=RH-1*S;scene.add(frescoPanel);
  // Ceiling gold moulding border
  for(let i=0;i<4;i++){
    const angle=i*Math.PI/2;const isLong=i%2===0;
    const mould=new THREE.Mesh(new THREE.BoxGeometry(isLong?RW:RD,16*S,12*S),goldMat);
    mould.rotation.y=angle;mould.position.set(Math.sin(angle)*(isLong?0:RD/2-6*S),RH-8*S,Math.cos(angle)*(isLong?-RD/2+6*S:0));scene.add(mould);
  }
  // Ceiling rosettes at corners
  [-RW/3,0,RW/3].forEach(cx=>{[-RD/3,0,RD/3].forEach(cz=>{
    const ros=new THREE.Mesh(new THREE.CylinderGeometry(18*S,18*S,6*S,16),goldMat);ros.position.set(cx,RH-3*S,cz);scene.add(ros);
    const rosIn=new THREE.Mesh(new THREE.CylinderGeometry(10*S,10*S,8*S,12),goldDark);rosIn.position.set(cx,RH-4*S,cz);scene.add(rosIn);
  });});

  // ── Ornate walls — panelled with gold moulding ──
  // Back wall
  const backWall=new THREE.Mesh(new THREE.BoxGeometry(RW,RH,12*S),wallMat);backWall.position.set(0,RH/2,-RD/2+6*S);scene.add(backWall);
  // Gold dado rail
  const dado=new THREE.Mesh(new THREE.BoxGeometry(RW,14*S,14*S),goldMat);dado.position.set(0,130*S,-RD/2+12*S);scene.add(dado);
  const cornice=new THREE.Mesh(new THREE.BoxGeometry(RW,18*S,16*S),goldMat);cornice.position.set(0,RH-9*S,-RD/2+12*S);scene.add(cornice);
  // Gold panel mouldings on back wall
  for(let i=0;i<4;i++){
    const pw=RW/4-20*S,ph=RH*0.55;
    const px=-RW/2+RW/4*(i+0.5);
    const frame=new THREE.Mesh(new THREE.BoxGeometry(pw,ph,8*S),goldDark);frame.position.set(px,RH*0.6,-RD/2+13*S);scene.add(frame);
    const inner=new THREE.Mesh(new THREE.BoxGeometry(pw-12*S,ph-12*S,6*S),wallLight);inner.position.set(px,RH*0.6,-RD/2+14*S);scene.add(inner);
    const topScroll=new THREE.Mesh(new THREE.CylinderGeometry(8*S,8*S,6*S,8),goldMat);topScroll.position.set(px,RH*0.6+ph/2+4*S,-RD/2+13*S);scene.add(topScroll);
  }
  // Side walls
  [-1,1].forEach(s=>{
    const sw=new THREE.Mesh(new THREE.BoxGeometry(12*S,RH,RD),wallMat);sw.position.set(s*(RW/2-6*S),RH/2,0);scene.add(sw);
    const sdado=new THREE.Mesh(new THREE.BoxGeometry(14*S,14*S,RD),goldMat);sdado.position.set(s*(RW/2-12*S),130*S,0);scene.add(sdado);
    const scornice=new THREE.Mesh(new THREE.BoxGeometry(16*S,18*S,RD),goldMat);scornice.position.set(s*(RW/2-12*S),RH-9*S,0);scene.add(scornice);
    [-RD/4,RD/4].forEach(pz=>{
      const pw=RD/3,ph=RH*0.55;
      const frame=new THREE.Mesh(new THREE.BoxGeometry(8*S,ph,pw),goldDark);frame.position.set(s*(RW/2-13*S),RH*0.6,pz);scene.add(frame);
      const inner=new THREE.Mesh(new THREE.BoxGeometry(6*S,ph-12*S,pw-12*S),wallLight);inner.position.set(s*(RW/2-14*S),RH*0.6,pz);scene.add(inner);
    });
  });
  // Front wall with exit door
  const dGapW=220*S,fSideW=(RW-dGapW)/2;
  const fL=new THREE.Mesh(new THREE.BoxGeometry(fSideW,RH,12*S),wallMat);fL.position.set(-(dGapW/2+fSideW/2),RH/2,RD/2-6*S);scene.add(fL);
  const fR=fL.clone();fR.position.x=dGapW/2+fSideW/2;scene.add(fR);
  // Gold moulding on front wall
  const fdado=new THREE.Mesh(new THREE.BoxGeometry(RW,14*S,14*S),goldMat);fdado.position.set(0,130*S,RD/2-12*S);scene.add(fdado);
  const fcornice=new THREE.Mesh(new THREE.BoxGeometry(RW,18*S,16*S),goldMat);fcornice.position.set(0,RH-9*S,RD/2-12*S);scene.add(fcornice);
  // Exit door — ornate
  const dW=100*S,dH=380*S,doorZ=RD/2-6*S;
  const dFrame=new THREE.Mesh(new THREE.BoxGeometry(dW*2+50*S,dH+30*S,14*S),goldMat);dFrame.position.set(0,dH/2,doorZ);scene.add(dFrame);
  [-1,1].forEach(s=>{
    const door=new THREE.Mesh(new THREE.BoxGeometry(dW-2,dH-2,10*S),darkWood);door.position.set(s*dW/2,dH/2,doorZ);scene.add(door);
    [0.2,0.5,0.78].forEach(py=>{const pnl=new THREE.Mesh(new THREE.BoxGeometry(dW-18*S,dH*0.2,4*S),richWood);pnl.position.set(s*dW/2,py*dH,doorZ+4*S);scene.add(pnl);});
    const hdl=new THREE.Mesh(new THREE.SphereGeometry(5*S,8,8),goldMat);hdl.position.set(s*(dW-16*S),dH*0.45,doorZ+7*S);scene.add(hdl);
  });
  // Pediment above exit door
  const ped=new THREE.Mesh(new THREE.BoxGeometry(dW*2+50*S,20*S,14*S),goldMat);ped.position.set(0,dH+24*S,doorZ);scene.add(ped);
  const pedTop=new THREE.Mesh(new THREE.CylinderGeometry(24*S,24*S,12*S,3),goldDark);pedTop.position.set(0,dH+40*S,doorZ);scene.add(pedTop);

  // ── BAROQUE FIREPLACE — back wall centre ──
  const fpG=new THREE.Group();
  const fpW=380*S,fpH=320*S,fpD=90*S;
  // Marble columns
  [-1,1].forEach(s=>{

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
function updateRotation(){camera.rotation.order="YXZ";camera.rotation.set(0,yaw,0);}

const exitCooldown=(new URLSearchParams(window.location.search).get("from")==="floor2")?Date.now()+4000:0;
let exitTriggered=false,nearExit=false;

function checkExitDoor(){
  if(exitTriggered)return;if(Date.now()<exitCooldown)return;
  nearExit=camera.position.x>-180*S&&camera.position.x<180*S&&camera.position.z>RD/2-200*S;
  document.getElementById("doorHint").style.display=nearExit?"block":"none";
}

function checkClosetDoor(){
  const dx=camera.position.x-RW/2+20*S;
  const dz=camera.position.z-RD/4;
  nearCloset=Math.sqrt(dx*dx+dz*dz)<180*S&&!closetTriggered;
  const hint=document.getElementById("closetHint");
  if(nearCloset&&!nearExit){
    hint.textContent=closetDoorsOpen?"Press E — Enter Dressing Room":"Press E — Open Dressing Room";
    hint.style.display="block";
  }else hint.style.display="none";
}

function animateClosetDoors(delta){
  const target=closetDoorsOpen?Math.PI*0.72:0;
  closetDoorPivots.forEach(({pivot,s})=>{
    pivot.rotation.y+=(s*target-pivot.rotation.y)*Math.min(1,delta*5);
  });
}

function onKeyDown(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.code==="KeyM"){toggleEditMode();return;}
  if(e.code==="KeyG"){toggleDebug();return;}
if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
    if(e.code==="KeyE"){
    if(nearCloset&&!nearExit){
      if(!closetDoorsOpen){closetDoorsOpen=true;return;}
      closetTriggered=true;
      document.getElementById("closetHint").style.display="none";
      document.getElementById("exitFade").classList.add("show");
      setTimeout(()=>window.location.href="baroquecloset.html",600);
      return;
    }
    if(nearExit&&!exitTriggered){
      exitTriggered=true;
      document.getElementById("doorHint").style.display="none";
      document.getElementById("exitFade").classList.add("show");
      setTimeout(()=>window.location.href="floor2.html?from=baroque_room",600);
    }
    return;
  }
  if(EDIT_MODE&&selectedObject){
    if(e.code==="Delete"||e.code==="Backspace"){e.preventDefault();scene.remove(selectedObject);const idx=editableObjects.indexOf(selectedObject);if(idx>-1)editableObjects.splice(idx,1);showStatus("🗑 Deleted");selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
    const speed=e.shiftKey?1:8;
    if(!e.shiftKey){if(e.code==="ArrowUp")selectedObject.position.z-=speed;if(e.code==="ArrowDown")selectedObject.position.z+=speed;if(e.code==="ArrowLeft")selectedObject.position.x-=speed;if(e.code==="ArrowRight")selectedObject.position.x+=speed;}
    if(e.shiftKey&&e.code==="ArrowUp")selectedObject.position.y+=speed;
    if(e.shiftKey&&e.code==="ArrowDown")selectedObject.position.y-=speed;
    if(e.code==="KeyR")selectedObject.rotation.y+=e.shiftKey?0.05:0.1;
    return;
  }
  if(!EDIT_MODE){
    if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=true;
    if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=true;
    if(e.code==="ArrowLeft")turnLeft=true;
    if(e.code==="ArrowRight")turnRight=true;
  }
}
function onKeyUp(e){
  if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=false;
  if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=false;
  if(e.code==="ArrowLeft")turnLeft=false;
  if(e.code==="ArrowRight")turnRight=false;
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),delta=(now-prevTime)/1000;prevTime=now;
  if(!EDIT_MODE){
    if(turnLeft)yaw+=2.2*delta;if(turnRight)yaw-=2.2*delta;
    const mv=Number(moveForward)-Number(moveBackward);
    if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    camera.position.x=Math.max(-RW/2+20*S,Math.min(RW/2-20*S,camera.position.x+fwd.x*mv*110*delta));
    camera.position.z=Math.max(-RD/2+20*S,Math.min(RD/2-15*S,camera.position.z+fwd.z*mv*110*delta));
    camera.position.y=240*S;
  }
  checkExitDoor();checkClosetDoor();animateClosetDoors(delta);updateRotation();renderer.render(scene,camera);
  EvidenceSystem.update();
}

</script>

<script>
(async()=>{
  await MysteryEngine.init();
  let scenario=await MysteryState.load();
  if(!scenario){scenario=MysteryEngine.generate();await MysteryState.save(scenario);}
  window._scenario=scenario;
  MysteryUI.init(scenario,false);
  MysteryUI.setZone('closetroom');
  init();
  EvidenceSystem.init({ camera, scene, renderer, zoneId: 'closetroom' });
  const _sa=()=>{if(window.SoundSystem)SoundSystem.startAmbient();window.removeEventListener('keydown',_sa);window.removeEventListener('click',_sa);};
  window.addEventListener('keydown',_sa);window.addEventListener('click',_sa);
})();
</script>
