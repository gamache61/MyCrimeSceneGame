<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Staff Quarters</title>
<style>
body{margin:0;overflow:hidden;background:#000;}
canvas{display:block;}
#exitFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.6s ease;}
#exitFade.show{opacity:1;}
#fadeOverlay{position:fixed;inset:0;background:#000;z-index:9999;animation:fadeOut 0.8s ease forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
#doorHint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#ffdd88;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
#instructionLine{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:5px 12px;font-size:11px;color:#bbb;background:rgba(0,0,0,0.60);border-radius:8px;z-index:30;pointer-events:none;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;white-space:nowrap;max-width:70vw;overflow:hidden;text-overflow:ellipsis;}
#roomLabel{position:fixed;top:0;left:50%;transform:translateX(-50%);padding:0 20px;background:none;color:rgba(255,255,255,0.7);font-size:13px;font-family:system-ui,Arial,sans-serif;z-index:62;pointer-events:none;display:none;line-height:36px;}
#editHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
#editBtn,#saveBtn,#loadBtn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.72);color:#eee;cursor:pointer;user-select:none;}
#editIndicator{padding:6px 10px;border-radius:999px;font-size:12px;letter-spacing:0.4px;border:1px solid rgba(255,255,255,0.20);background:rgba(80,20,20,0.8);color:#ffd0d0;}
#editIndicator.on{background:rgba(20,80,20,0.85);color:#d5ffd5;}
#editLight{display:inline-block;margin-right:8px;font-size:13px;color:#444;vertical-align:middle;cursor:pointer;transition:color 0.25s,text-shadow 0.25s;}
#editLight.on{color:#44ff88;text-shadow:0 0 6px #44ff88,0 0 12px #44ff88;}
#editHint{position:fixed;top:42px;left:50%;transform:translateX(-50%);padding:7px 16px;background:rgba(0,0,0,0.8);color:#aaffaa;border-radius:7px;font-size:13px;display:none;z-index:60;font-family:system-ui,Arial,sans-serif;pointer-events:none;}
#selInfo{position:fixed;top:48px;left:10px;padding:8px 12px;background:rgba(0,0,0,0.8);color:#aaddff;border-radius:8px;font-size:12px;display:none;z-index:60;font-family:monospace;}
</style>
</head>
<body>
<div id="exitFade"></div>
<div id="doorHint">Press E — Return to Floor 1</div>
<div id="instructionLine">
<span id="editLight" title="Edit Mode (press M or use ☰ Menu)">●</span>
<b>LIVING QUARTERS</b> — W/↑ Forward • S/↓ Back • ←/→ Turn • R Rotate • M = Edit Mode • Shift+C = Copy picture • E = Exit
</div>
<div id="roomLabel"></div>
<div id="editHud">
<button id="editBtn" type="button">Edit Mode</button>
<button id="saveBtn" type="button">Save Layout</button>
<button id="loadBtn" type="button">Load Layout</button>
<div id="editIndicator">OFF</div>
</div>
<div id="editHint">Click object to select • ←→↑↓ Move • Shift+↑↓ Height • R Rotate • Shift+C Copy • Del Remove • Esc Deselect</div>
<div id="selInfo"></div>
<div id="fadeOverlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const S = 0.5;

// Layout constants
const HW = 220*S;   // hallway width
const HL = 2400*S;  // hallway length (fits 3 rooms per side)
const RW = 1100*S;  // room width (doubled)
const RD = 900*S;   // room depth (doubled)
const RH = 340*S;   // room height
const HH = 360*S;   // hallway height
const WT = 18*S;    // wall thickness
const DW = 140*S;   // door width
const DH = 240*S;   // door height
// Interior bedroom dividing wall
const BDW = RW*0.45; // bedroom section width (45% of room)

// Room positions along hallway (3 per side, evenly spaced)
const ROOM_SPACING = HL / 3; // space each room 800*S apart
const ROOM_ZS = [-HL/2 + ROOM_SPACING*0.5, -HL/2 + ROOM_SPACING*1.5, -HL/2 + ROOM_SPACING*2.5];
const ROOM_NAMES = ['White Room','Green Room','Orange Room',' Black Room','Red Room','Purple Room'];
// Rooms 1-3 on left (negative X), 4-6 on right (positive X)

let scene, camera, renderer;
let moveForward=false, moveBackward=false, turnLeft=false, turnRight=false;
let yaw=Math.PI, prevTime=performance.now();
let nearExit=false, exitTriggered=false;

// ── EDIT SYSTEM ──────────────────────────────────────────────────────
let EDIT_MODE=false;
let editableObjects=[];
let selectedObj=null;
const SAVE_KEY='staffquarters_layout';
const _ray=new THREE.Raycaster();
const _mouse=new THREE.Vector2();
let _editIdSeq=0;

function eId(prefix,roomIdx){ return prefix+'_r'+roomIdx+'_'+(++_editIdSeq); }
function reg(mesh,id){ if(!mesh.userData)mesh.userData={}; mesh.userData.editId=id; editableObjects.push(mesh); return mesh; }

// Group-based furniture: all parts move together
function makeGroup(id){
  const g=new THREE.Group();
  g.userData={editId:id};
  scene.add(g);
  editableObjects.push(g);
  return g;
}
// Add a box to a group (position relative to group origin)
function GB(group,w,h,d,m,x,y,z){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set(x,y,z);
  group.add(mesh);
  return mesh;
}
function GC(group,rt,rb,h,seg,m,x,y,z){
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);
  mesh.position.set(x,y,z);
  group.add(mesh);
  return mesh;
}

function updateEditUI(){
  const ind=document.getElementById('editIndicator');
  if(ind){ind.textContent=EDIT_MODE?'ON':'OFF';ind.classList.toggle('on',EDIT_MODE);}
  const light=document.getElementById('editLight');
  if(light){light.classList.toggle('on',EDIT_MODE);light.title=EDIT_MODE?'Edit Mode ON — click or press M to turn off':'Edit Mode OFF — click or press M to turn on';}
  const menuBtn=document.getElementById('rightMenuBtn');
  if(menuBtn){menuBtn.textContent=EDIT_MODE?'☰ Menu  ✏️':'☰ Menu';menuBtn.style.borderColor=EDIT_MODE?'rgba(68,255,136,0.6)':'rgba(255,255,255,0.25)';}
  const editBtn=document.getElementById('editBtn');
  if(editBtn){editBtn.textContent=EDIT_MODE?'✏️ Edit Mode: ON':'Edit Mode: OFF';editBtn.style.background=EDIT_MODE?'rgba(20,80,20,0.85)':'rgba(0,0,0,0.72)';editBtn.style.color=EDIT_MODE?'#d5ffd5':'#eee';}
  document.getElementById('editHint').style.display=EDIT_MODE?'block':'none';
}
function toggleEdit(){
  EDIT_MODE=!EDIT_MODE;
  updateEditUI();
  if(!EDIT_MODE) deselect();
}
function deselect(){
  if(selectedObj){
    (selectedObj.userData._emvList||[]).forEach(({child,origMat})=>{
      child.material.dispose();
      child.material=origMat;
    });
    selectedObj.userData._emvList=[];
  }
  selectedObj=null;
  document.getElementById('selInfo').style.display='none';
}
function selectObj(obj){
  deselect(); selectedObj=obj;
  obj.userData._emvList=[];
  // Collect all meshes (group children or just the mesh)
  const targets=[];
  if(obj.isGroup){ obj.traverse(ch=>{ if(ch.isMesh) targets.push(ch); }); }
  else if(obj.isMesh) targets.push(obj);
  targets.forEach(child=>{
    if(child.material&&child.material.emissive!==undefined){
      // Clone the material so shared materials don't all highlight
      const origMat=child.material;
      const cloned=child.material.clone();
      child.material=cloned;
      obj.userData._emvList.push({child,origMat,cloned});
      cloned.emissive.setHex(0x226622);
    }
  });
  updateSelInfo();
}
function updateSelInfo(){
  if(!selectedObj)return;
  const p=selectedObj.position;
  const el=document.getElementById('selInfo');
  el.style.display='block';
  el.textContent=`[${selectedObj.userData.editId}]  X:${p.x.toFixed(1)}  Y:${p.y.toFixed(1)}  Z:${p.z.toFixed(1)}  RY:${(selectedObj.rotation.y*180/Math.PI).toFixed(0)}°`;
}
function saveLayout(){
  const deleted=editableObjects.filter(o=>o&&o.userData&&o.userData.editId&&o.userData._deleted).map(o=>o.userData.editId);
  const data=editableObjects.filter(o=>o&&o.userData&&o.userData.editId&&!o.userData._deleted).map(o=>({
    id:o.userData.editId,px:o.position.x,py:o.position.y,pz:o.position.z,ry:o.rotation.y
  }));
  localStorage.setItem(SAVE_KEY,JSON.stringify({layout:data,deleted}));
  const btn=document.getElementById('saveBtn');
  if(btn){const orig=btn.textContent;btn.textContent='✅ Saved!';setTimeout(()=>btn.textContent=orig,1500);}
}
function loadLayout(){
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw) return;
  let parsed;
  try{ parsed=JSON.parse(raw); }catch(e){ return; }
  // Support old format (array) and new format ({layout,deleted})
  const layoutArr=Array.isArray(parsed)?parsed:(parsed.layout||[]);
  const deletedIds=Array.isArray(parsed)?[]:(parsed.deleted||[]);
  layoutArr.forEach(d=>{
    const obj=editableObjects.find(o=>o.userData.editId===d.id);
    if(obj){obj.position.set(d.px,d.py,d.pz);obj.rotation.y=d.ry;}
  });
  deletedIds.forEach(id=>{
    const obj=editableObjects.find(o=>o.userData.editId===id);
    if(obj){ obj.userData._deleted=true; scene.remove(obj); }
  });
}
window.addEventListener('click',e=>{
  if(!EDIT_MODE)return;
  _mouse.x=(e.clientX/innerWidth)*2-1;
  _mouse.y=-(e.clientY/innerHeight)*2+1;
  _ray.setFromCamera(_mouse,camera);
  // Check all scene children recursively so group members are hit
  const hits=_ray.intersectObjects(scene.children,true);
  if(hits.length>0){
    // Walk up to find an editable parent (group or mesh)
    let obj=hits[0].object;
    while(obj){
      if(obj.userData&&obj.userData.editId&&editableObjects.includes(obj)){selectObj(obj);return;}
      obj=obj.parent;
    }
    deselect();
  } else deselect();
});

// ── SEED LAYOUT — copy room 6 (idx=5) positions to all other rooms ──
function seedLayout(){
  const raw=localStorage.getItem(SAVE_KEY);
  let parsed={layout:[],deleted:[]};
  if(raw){ try{ parsed=JSON.parse(raw); if(Array.isArray(parsed)) parsed={layout:parsed,deleted:[]}; }catch(e){} }

  // Room 5 reference: side=+1, rz=400
  const R5 = [
    {id:"headboard",px:495.5,py:0,pz:597.5,ry:1.5707963267948963},
    {id:"bed",px:493,py:0,pz:537.5,ry:1.5707963267948963},
    {id:"toilet",px:583,py:0,pz:323,ry:9.424777960769374},
    {id:"shower",px:406,py:0,pz:203.5,ry:4.71238898038469},
    {id:"sink",px:501.5,py:0,pz:325,ry:4.71238898038469},
    {id:"bathtub",px:549.5,py:0,pz:201.55,ry:17.278759594743857},
    {id:"wardrobe",px:489,py:0,pz:364.5,ry:10.995574287564269},
    {id:"bedroom_rug",px:558,py:0,pz:400,ry:0},
    {id:"sofa",px:218.5,py:0,pz:462.5,ry:1.5707963267948963},
    {id:"coffee_table",px:218.5,py:0,pz:522.5,ry:10.995574287564269},
    {id:"dining_table",px:219,py:0,pz:301,ry:0},
    {id:"bookshelf",px:219,py:0,pz:591.5,ry:9.424777960769374},
    {id:"kitchen_counter",px:306.5,py:0,pz:186.5,ry:6.2831853071795845},
    {id:"kitchen_upper",px:304,py:-35,pz:174,ry:0},
    {id:"kitchen_sink",px:299,py:0,pz:181.5,ry:0},
    {id:"fridge",px:356.5,py:0,pz:187.5,ry:12.566370614359164},
    {id:"paint_door1",px:63,py:92.9,pz:280,ry:1.5707963267948963},
    {id:"paint_door2",px:60.5,py:95.4,pz:512.5,ry:1.5707963267948963},
    {id:"paint_lv_north",px:501.5,py:90,pz:598.5,ry:3.1415926535897936},
    {id:"paint_lv_south",px:219,py:0,pz:614,ry:0},
    {id:"vase",px:199,py:0,pz:610,ry:0},
    {id:"paint_lv_south2",px:219,py:0,pz:614,ry:0},
    {id:"paint_bd_south",px:494,py:0,pz:614,ry:0},
    {id:"paint_bd_north",px:554,py:0,pz:176,ry:1.5707963267948963},
    {id:"paint_bd_south2",px:494,py:0,pz:614,ry:0},
    {id:"paint_ex1",px:167,py:95.6,pz:177.5,ry:12.566370614359164},
    {id:"paint_ex2",px:219,py:76.5,pz:612.5,ry:3.141592653589793},
    {id:"paint_ex3",px:386,py:91,pz:510,ry:14.137166941154058},
    {id:"paint_ex4",px:371.5,py:96.4,pz:330,ry:4.71238898038469},
    {id:"paint_ex5",px:372,py:94.6,pz:507.5,ry:10.995574287564269},
  ];

  // Items deleted in room 5 — delete same items in all rooms
  const r5Deleted=['dressingtable','bedroom_painting','clock','plant','floorplant','print_bd_0','print_bd_1','sconce_lv_0'];

  // Room configs: [roomIdx, side, rz]
  const rooms=[
    [0,-1,-400],[1,-1,0],[2,-1,400],
    [3,1,-400],[4,1,0]
    // room 5 already set, skip
  ];

  let layout=[...parsed.layout];
  let deleted=[...parsed.deleted];

  rooms.forEach(([ri,side,rz])=>{
    const dzFrom5 = rz - 400; // Z delta from room 5's rz
    const xMirror = side; // room 5 is side=+1; left rooms need x negated

    R5.forEach(item=>{
      const newId = item.id+'_r'+ri;
      // Skip if already saved
      if(layout.find(l=>l.id===newId)) return;

      // Transform position from room5 space to target room space
      let px = item.px * xMirror; // mirror X for left-side rooms
      let pz = item.pz + dzFrom5;  // shift Z
      let ry = item.ry;
      // Mirror rotations for left-side rooms
      if(side === -1){
        ry = -ry;
      }

      layout.push({id:newId, px, py:item.py, pz, ry});
    });

    // Apply same deletions
    r5Deleted.forEach(prefix=>{
      const delId = prefix+'_r'+ri;
      if(!deleted.includes(delId)) deleted.push(delId);
    });
  });

  localStorage.setItem(SAVE_KEY, JSON.stringify({layout, deleted}));
}

function init(){
  setTimeout(()=>{const f=document.getElementById('fadeOverlay');if(f)f.remove();},800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0e0c0a);
  scene.fog=new THREE.Fog(0x0e0c0a,200,1200);

  camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);

  // Dim corridor lighting
  scene.add(new THREE.AmbientLight(0x1a1510,1.0));
  // Wall sconces along hallway
  ROOM_ZS.forEach(rz=>{
    [-1,1].forEach(side=>{
      const sconce=new THREE.PointLight(0xffcc88,0.9,200);
      sconce.position.set(side*(HW/2+10*S),HH*0.7,rz); scene.add(sconce);
    });
  });
  // Entry light
  const entryLight=new THREE.PointLight(0xffddaa,1.0,250);
  entryLight.position.set(0,HH*0.8,HL/2-50*S); scene.add(entryLight);

  buildHallway();
  buildAllRooms();
  buildEntrance();
  seedLayout();
  loadLayout();

  document.addEventListener('keydown',onKeyDown);
  document.addEventListener('keyup',onKeyUp);
  window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

  // Spawn just inside entrance
  // Spawn position — just outside door if returning from a room
  const urlParams=new URLSearchParams(window.location.search);
  const urlDoor=parseInt(urlParams.get('door'));
  const storedDoor=parseInt(sessionStorage.getItem('lq_lastDoor'));
  // Use stored index (set when we entered the room) — reliable even if room file sends wrong door param
  const fromDoor=!isNaN(storedDoor)?storedDoor:urlDoor;
  sessionStorage.removeItem('lq_lastDoor');
  if(!isNaN(fromDoor)&&fromDoor>=0&&fromDoor<=5){
    const ri=fromDoor%3;           // which Z slot (0,1,2)
    const side=fromDoor<3?-1:1;   // left or right
    const rz=ROOM_ZS[ri];
    // Spawn in hallway outside that room's door
    camera.position.set(side*(HW/2-80*S), 200*S, rz);
    // White(0) and Black(3) are furthest from entrance — face entrance (yaw=PI)
    // All other rooms (first 4 from entrance) face down the hall (yaw=0)
    yaw=(fromDoor===0||fromDoor===3)?Math.PI:0;
  } else {
    camera.position.set(0,200*S,HL/2-100*S);
    yaw=0;
  }
  updateRotation();
  animate();
}

// ── MATERIALS ──
const wallMat  = new THREE.MeshLambertMaterial({color:0x3a3028});
const floorMat = new THREE.MeshLambertMaterial({color:0x1e1a14});
const ceilMat  = new THREE.MeshLambertMaterial({color:0x2a2420});
const woodDoor = new THREE.MeshLambertMaterial({color:0x5c3a1e});
const darkWood = new THREE.MeshLambertMaterial({color:0x2e1c0c});
const brassMat = new THREE.MeshLambertMaterial({color:0xb8860b});
const bedFrame = new THREE.MeshLambertMaterial({color:0x3a2810});
const mattress = new THREE.MeshLambertMaterial({color:0xd4c8a8});
const pillow   = new THREE.MeshLambertMaterial({color:0xf0ece4});
const blanket  = new THREE.MeshLambertMaterial({color:[0x6a3a2a,0x2a4a6a,0x2a5a3a,0x5a3a6a,0x6a5a2a,0x4a2a4a]});
const deskMat  = new THREE.MeshLambertMaterial({color:0x4a3018});
const rugMats  = [0x8a3a2a,0x2a5a8a,0x3a7a4a,0x6a2a7a,0x7a6a2a,0x4a2a5a].map(c=>new THREE.MeshLambertMaterial({color:c}));
const trimMat  = new THREE.MeshLambertMaterial({color:0x5a4a3a});
const carpetMat= new THREE.MeshLambertMaterial({color:0x4a3e30});

function B(w,h,d,m){ const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m); scene.add(mesh); return mesh; }
function C(rt,rb,h,s,m){ const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m); scene.add(mesh); return mesh; }

function makeSVGTexture(svgString){
  const b64=btoa(unescape(encodeURIComponent(svgString)));
  const url='data:image/svg+xml;base64,'+b64;
  const mat=new THREE.MeshLambertMaterial({transparent:false,color:0xffffff});
  new THREE.TextureLoader().load(url, function(tex){
    tex.encoding=THREE.sRGBEncoding;
    mat.map=tex;
    mat.needsUpdate=true;
  });
  return mat;
}
// ── makePainting: builds a framed picture group, facing +Z by default ──
// Place the group, then rotate group.rotation.y to face the right wall.
// fw/fh = canvas size, svg = SVG string (or null for flat colour mat)
function makePainting(id, fw, fh, svgStr, flatMat){
  const g=makeGroup(id);
  const border=8*S;
  // Frame box
  const frame=new THREE.Mesh(new THREE.BoxGeometry(fw+border*2, fh+border*2, 6*S), darkWood);
  g.add(frame);
  // Canvas plane sits just in front of frame face
  const canvasMat=svgStr ? makeSVGTexture(svgStr) : (flatMat||darkWood);
  const canvas=new THREE.Mesh(new THREE.PlaneGeometry(fw, fh), canvasMat);
  canvas.position.z=4*S; // flush to front face of frame
  g.add(canvas);
  if(svgStr) regSVG(id, svgStr);
  return g;
}

// ── SVG REGISTRY — maps group editId prefix to SVG string ──
const _svgRegistry={};
function regSVG(id,svgStr){ _svgRegistry[id]=svgStr; }

// ── DOOR LABELS (shared between buildHallway and buildRoom) ──
const doorLabels=[
  {name:'White Room', color:'#222222'},
  {name:'Green Room', color:'#1a5a1a'},
  {name:'Orange Room',color:'#8a3a0a'},
  {name:'Black Room', color:'#111111'},
  {name:'Red Room',   color:'#7a1010'},
  {name:'Purple Room',color:'#4a1a6a'},
];
function makeDoorLabel(name, color){
  const canvas=document.createElement('canvas');
  canvas.width=512; canvas.height=128;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle=color;
  ctx.fillRect(0,0,512,128);
  ctx.fillStyle='#ffffff';
  ctx.font='bold 56px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(name,256,64);
  const tex=new THREE.CanvasTexture(canvas);
  return new THREE.MeshBasicMaterial({map:tex,transparent:false});
}

// ── HALLWAY ──
function buildHallway(){
  // Floor — dark wood planks
  const plankA=new THREE.MeshLambertMaterial({color:0x2a2018});
  const plankB=new THREE.MeshLambertMaterial({color:0x221a12});
  for(let i=0;i<Math.ceil(HL/(28*S));i++){
    const p=new THREE.Mesh(new THREE.BoxGeometry(HW-4*S,2*S,26*S),(i%2===0)?plankA:plankB);
    p.position.set(0,1*S,-HL/2+14*S+i*28*S); scene.add(p);
  }

  // Ceiling
  const ceil=B(HW,8*S,HL,ceilMat); ceil.position.set(0,HH+4*S,0);

  // Left wall (rooms on left side)
  const lwZ=-HL/2, lwLen=HL;
  // Build left wall in segments around doorways
  buildWallWithDoors(-HW/2-RW-WT/2, HH, WT, HL, ROOM_ZS, DW, DH, 'left');
  // Right wall
  buildWallWithDoors(HW/2+RW+WT/2, HH, WT, HL, ROOM_ZS, DW, DH, 'right');

  // End wall (far end of corridor)
  const endW=B(HW+RW*2+WT*2,HH,WT,wallMat); endW.position.set(0,HH/2,-HL/2-WT/2);
  // Entrance wall handled in buildEntrance

  // Inner corridor walls (between hallway and rooms)
  // Left inner wall with door openings
  buildInnerWall(-HW/2, HH, HL, ROOM_ZS, DW, DH, -1);
  // Right inner wall with door openings
  buildInnerWall( HW/2, HH, HL, ROOM_ZS, DW, DH,  1);

  // Hallway ceiling light fixtures
  ROOM_ZS.forEach(rz=>{
    const fixture=B(14*S,4*S,40*S,new THREE.MeshLambertMaterial({color:0x888880}));
    fixture.position.set(0,HH-2*S,rz);
    const bulb=new THREE.Mesh(new THREE.BoxGeometry(10*S,2*S,36*S),
      new THREE.MeshLambertMaterial({color:0xffeecc,emissive:0x443300}));
    bulb.position.set(0,HH-4*S,rz); scene.add(bulb);
  });

  // Skirting boards along hallway
  // skirting removed — was bleeding into rooms

  // Runner carpet down hallway
  const runner=B(HW*0.5,0.5*S,HL-20*S,carpetMat); runner.position.set(0,1*S,0);
  // Carpet pattern lines
  for(let i=0;i<12;i++){
    const line=new THREE.Mesh(new THREE.BoxGeometry(HW*0.48,0.5*S,2*S),
      new THREE.MeshLambertMaterial({color:0x6a5040}));
    line.position.set(0,3*S,-HL/2+50*S+i*90*S); scene.add(line);
  }

  // Wall sconce fixtures
  ROOM_ZS.forEach(rz=>{
    [-1,1].forEach(side=>{
      const wx=side*(HW/2-2*S);
      const arm=B(12*S,4*S,4*S,sconceHousing); arm.position.set(wx,HH*0.7,rz);
      const shade=new THREE.Mesh(new THREE.CylinderGeometry(8*S,5*S,12*S,10,1,true),
        new THREE.MeshLambertMaterial({color:0xddcc88,transparent:true,opacity:0.7,side:THREE.DoubleSide}));
      shade.position.set(wx+side*8*S,HH*0.7,rz); scene.add(shade);
    });
  });

  // Room name signs above each door opening on the inner corridor wall
  ROOM_ZS.forEach((rz,i)=>{
    [-1,1].forEach((side,si)=>{
      const roomIdx=si===0?i:i+3;
      const lbl=doorLabels[roomIdx];
      const wallX=side*HW/2; // inner corridor wall face
      const sign=new THREE.Mesh(
        new THREE.PlaneGeometry(DW-4*S, 22*S),
        makeDoorLabel(lbl.name, lbl.color)
      );
      sign.position.set(wallX, DH+16*S, rz);
      sign.rotation.y=side>0?-Math.PI/2:Math.PI/2;
      scene.add(sign);
    });
  });
}

function buildInnerWall(x, h, len, roomZs, dw, dh, side){
  // Build wall segments between door openings
  let z=-len/2;
  roomZs.forEach(rz=>{
    const segLen=(rz-dw/2)-z;
    if(segLen>1){
      const seg=B(WT,h,segLen,wallMat); seg.position.set(x,h/2,z+segLen/2);
    }
    // Above door
    const above=B(WT,h-dh,dw,wallMat); above.position.set(x,dh+(h-dh)/2,rz);
    z=rz+dw/2;
  });
  // Last segment
  const lastLen=len/2-z;
  if(lastLen>1){
    const seg=B(WT,h,lastLen,wallMat); seg.position.set(x,h/2,z+lastLen/2);
  }
}

function buildWallWithDoors(x, h, wt, len, roomZs, dw, dh, side){
  // Solid outer room walls — rooms have their own internal walls
  const wall=B(wt,h,len,wallMat); wall.position.set(x,h/2,0);
}

// ── ENTRANCE ──
function buildEntrance(){
  const ez=HL/2;
  // Front wall with double door opening
  const entDoorW=160*S, entH=HH;
  const fSideW=(HW-entDoorW)/2;
  const fL=B(fSideW,entH,WT,wallMat); fL.position.set(-(entDoorW/2+fSideW/2),entH/2,ez+WT/2);
  const fR=B(fSideW,entH,WT,wallMat); fR.position.set( entDoorW/2+fSideW/2,entH/2,ez+WT/2);
  // Side extensions to meet room outer walls
  [-1,1].forEach(side=>{
    const ext=B(RW+WT,entH,WT,wallMat); ext.position.set(side*(HW/2+RW/2+WT/2),entH/2,ez+WT/2);
  });
  // Double entry doors
  buildDoubleDoor(0,ez+WT/2,entDoorW,entH,woodDoor,darkWood,brassMat,1);
  // Entry mat
  const mat2=B(entDoorW-10*S,1*S,40*S,new THREE.MeshLambertMaterial({color:0x2a1a0c}));
  mat2.position.set(0,2*S,ez-20*S);
}

function buildDoubleDoor(cx,wz,dw,dh,dMat,frameMat,bMat,dir){
  const gap=3*S, slabW=dw/2-gap/2;
  // Jambs
  [-1,1].forEach(s=>{
    const jamb=new THREE.Mesh(new THREE.BoxGeometry(10*S,dh,WT+4*S),frameMat);
    jamb.position.set(cx+s*(dw/2+5*S),dh/2,wz); scene.add(jamb);
  });
  [-1,1].forEach(s=>{
    const sx=cx+s*(gap/2+slabW/2);
    const slab=new THREE.Mesh(new THREE.BoxGeometry(slabW,dh,8*S),dMat);
    slab.position.set(sx,dh/2,wz+dir*2*S); scene.add(slab);
    // Raised panels
    [[dh*0.78,dh*0.14],[dh*0.5,dh*0.22],[dh*0.16,dh*0.2]].forEach(([py,ph])=>{
      const panel=new THREE.Mesh(new THREE.BoxGeometry(slabW-14*S,ph,5*S),frameMat);
      panel.position.set(sx,py,wz+dir*6*S); scene.add(panel);
    });
    // Knob
    const knob=new THREE.Mesh(new THREE.SphereGeometry(4*S,8,8),bMat);
    knob.position.set(cx+s*(-4*S),dh*0.45,wz+dir*8*S); scene.add(knob);
  });
  // Gap strip
  const gs=new THREE.Mesh(new THREE.BoxGeometry(gap,dh,WT+6*S),frameMat);
  gs.position.set(cx,dh/2,wz); scene.add(gs);
}

// ── ALL 6 ROOMS ──
function buildAllRooms(){
  ROOM_ZS.forEach((rz,i)=>{
    buildRoom(-HW/2-RW/2-WT/2, rz, i,   -1); // left rooms 0,1,2
    buildRoom( HW/2+RW/2+WT/2, rz, i+3,  1); // right rooms 3,4,5
  });
}

function buildRoom(cx, rz, roomIdx, side){
  const bMat=new THREE.MeshLambertMaterial({color:0x4a3828});
  // Room floor
  const fl=B(RW,2*S,RD,new THREE.MeshLambertMaterial({color:0x2a2018}));
  fl.position.set(cx,1*S,rz-RD/2+RD/2);
  // room carpet removed — was showing through walls
  // Ceiling
  const rc=B(RW,6*S,RD,ceilMat); rc.position.set(cx,RH+3*S,rz);
  // Back wall
  const backW=B(RW,RH,WT,wallMat); backW.position.set(cx,RH/2,rz-RD/2-WT/2);
  // Side walls
  const sw1=B(WT,RH,RD,wallMat); sw1.position.set(cx-RW/2-WT/2,RH/2,rz);
  const sw2=B(WT,RH,RD,wallMat); sw2.position.set(cx+RW/2+WT/2,RH/2,rz);
  // Front wall (corridor side) — with door opening — handled by inner wall segments

  // Room light
  const rLight=new THREE.PointLight(0xffddaa,0.0,0); // off by default (room is unoccupied)
  rLight.position.set(cx,RH-20*S,rz); scene.add(rLight);
  // Ceiling fixture (off)
  const fix=B(16*S,4*S,16*S,new THREE.MeshLambertMaterial({color:0x666655}));
  fix.position.set(cx,RH-2*S,rz);

  // ── Single door in corridor wall ──
  // Door frame (corridor side)
  const frameX=side<0?-HW/2+WT/2:HW/2-WT/2;
  const jamb1=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,DH,10*S),darkWood);
  jamb1.position.set(frameX,DH/2,rz-DW/2-6*S); scene.add(jamb1);
  const jamb2=jamb1.clone(); jamb2.position.z=rz+DW/2+6*S; scene.add(jamb2);
  const head=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,10*S,DW+12*S),darkWood);
  head.position.set(frameX,DH+5*S,rz); scene.add(head);
  // Corridor-side door slab (ajar)
  const door=new THREE.Mesh(new THREE.BoxGeometry(8*S,DH-4*S,DW-4*S),woodDoor);
  door.position.set(frameX,DH/2,rz);
  door.rotation.y=0;
  scene.add(door);
  // Corridor-side door panels
  [[DH*0.75,DH*0.18],[DH*0.42,DH*0.35]].forEach(([py,ph])=>{
    const pnl=new THREE.Mesh(new THREE.BoxGeometry(6*S,ph,DW-20*S),darkWood);
    pnl.position.set(frameX,py,rz);
    pnl.rotation.y=0;
    scene.add(pnl);
  });
  // Corridor-side knob
  const knob=new THREE.Mesh(new THREE.SphereGeometry(4*S,8,8),brassMat);
  knob.position.set(frameX+side*6*S,DH*0.45,rz-DW/2+14*S); scene.add(knob);
  // Door label
  const dlbl=doorLabels[roomIdx];
  const dlabelTex=makeDoorLabel(dlbl.name, dlbl.color);
  const dlabelBox=new THREE.Mesh(new THREE.BoxGeometry(2*S, 22*S, DW-24*S), dlabelTex);
  dlabelBox.position.set(frameX+(side<0?5*S:-5*S), DH*0.78, rz);
  scene.add(dlabelBox);
  // Door frame (room side) — same style as bedroom doors
  const doorWallX2 = cx - side * RW/2;
  [-DW/2, DW/2].forEach(dz=>{
    const jr=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,DH,10*S),darkWood);
    jr.position.set(doorWallX2,DH/2,rz+dz); scene.add(jr);
  });
  const headr=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,10*S,DW+12*S),darkWood);
  headr.position.set(doorWallX2,DH+5*S,rz); scene.add(headr);
  // Room-side door slab
  const doorR=new THREE.Mesh(new THREE.BoxGeometry(8*S,DH-2*S,DW-4*S),woodDoor);
  doorR.position.set(doorWallX2,DH/2,rz);
  scene.add(doorR);
  // Room-side door panels
  [[DH*0.75,DH*0.18],[DH*0.42,DH*0.35]].forEach(([py,ph])=>{
    const pnl=new THREE.Mesh(new THREE.BoxGeometry(6*S,ph,DW-20*S),darkWood);
    pnl.position.set(doorWallX2,py,rz);
    scene.add(pnl);
  });
  // Knob room side
  const knobr=new THREE.Mesh(new THREE.SphereGeometry(4*S,8,8),brassMat);
  knobr.position.set(doorWallX2-side*6*S,DH*0.45,rz-DW/2+14*S); scene.add(knobr);
  // Number plaque
  const plaque=B(24*S,16*S,3*S,brassMat);
  plaque.position.set(frameX,DH+20*S,rz+DW/2+16*S);

  // ── Furniture ──
  furnishRoom(cx, rz, roomIdx, side);
}

function furnishRoom(cx, rz, roomIdx, side){
  const accent  = [0x6a3a2a,0x2a4a6a,0x2a5a3a,0x5a3a6a,0x6a5a2a,0x4a2a4a][roomIdx];
  const artHue  = [0x8a6a4a,0x4a6a8a,0x5a8a6a,0x7a5a8a,0x8a7a4a,0x6a4a7a][roomIdx];
  const upholst = new THREE.MeshLambertMaterial({color:accent});
  const cush    = new THREE.MeshLambertMaterial({color:0xd4c8a8});
  const artMat  = new THREE.MeshLambertMaterial({color:artHue});

  // ── ROOM ORIENTATION ────────────────────────────────────────────────
  // Corridor runs along Z. Rooms extend in X away from corridor.
  // Door wall (corridor side): x = cx - side*RW/2
  // Back wall (far from door): x = cx + side*RW/2
  // Room Z extents: rz-RD/2 to rz+RD/2
  const doorWallX = cx - side * RW/2;   // corridor/door side
  const backWallX = cx + side * RW/2;   // far back wall
  const northZ    = rz - RD/2;          // one end along corridor
  const southZ    = rz + RD/2;          // other end along corridor

  // Dividing wall runs along Z at 58% into room from door
  // Living/dining = front 58%, Bedroom = back 42%
  const divX = doorWallX + side * RW * 0.58;
  const divDoorW = 110*S, divDoorH = 220*S;
  const divDoorCentreZ = rz; // door centred along room Z

  // Dividing wall with TWO door openings:
  //   1) Bathroom door — near northZ end (living room -> bathroom)
  //   2) Bedroom door  — centred at rz    (living room -> bedroom)
  const btDepthEarly = RD * 0.38;
  const btDoorCZ = northZ + btDepthEarly * 0.5;  // bathroom door centre
  const btDW = 90*S, btDH = 220*S;               // bathroom door size
  const bdDoorCZ = rz;                            // bedroom door centre

  // Helper: build wall segment between two Z points with door opening
  function wallSeg(z0, z1, doorCZ, doorW, doorH) {
    const s1 = (doorCZ - doorW/2) - z0;
    const s2 = z1 - (doorCZ + doorW/2);
    if(s1 > 1){ B(WT,RH,s1,wallMat).position.set(divX, RH/2, z0+s1/2); }
    if(s2 > 1){ B(WT,RH,s2,wallMat).position.set(divX, RH/2, z1-s2/2); }
    B(WT,RH-doorH,doorW,wallMat).position.set(divX, doorH+(RH-doorH)/2, doorCZ);
  }

  // Segment northZ -> between the two doors (bathroom door first)
  wallSeg(northZ, btDoorCZ + btDW/2 + (bdDoorCZ - btDoorCZ - btDW/2 - divDoorW/2)/2,
          btDoorCZ, btDW, btDH);
  // Segment between the two doors -> southZ (bedroom door)
  wallSeg(btDoorCZ + btDW/2 + (bdDoorCZ - btDoorCZ - btDW/2 - divDoorW/2)/2,
          southZ, bdDoorCZ, divDoorW, divDoorH);

  // Bathroom door frame + door
  [-btDW/2, btDW/2].forEach(dz=>{
    const j=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,btDH,10*S),darkWood);
    j.position.set(divX,btDH/2,btDoorCZ+dz); scene.add(j);
  });
  const btIHead=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,10*S,btDW+12*S),darkWood);
  btIHead.position.set(divX,btDH+5*S,btDoorCZ); scene.add(btIHead);
  const btIDoor=new THREE.Mesh(new THREE.BoxGeometry(8*S,btDH-2*S,btDW-4*S),woodDoor);
  btIDoor.position.set(divX,btDH/2,btDoorCZ); btIDoor.rotation.y=0; scene.add(btIDoor);
  const btIKnob=new THREE.Mesh(new THREE.SphereGeometry(3*S,8,8),brassMat);
  btIKnob.position.set(divX+side*5*S,btDH*0.45,btDoorCZ+btDW/2-8*S); scene.add(btIKnob);

  // Bedroom door frame + door
  [-divDoorW/2, divDoorW/2].forEach(dz=>{
    const j=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,divDoorH,10*S),darkWood);
    j.position.set(divX,divDoorH/2,bdDoorCZ+dz); scene.add(j);
  });
  const iHead=new THREE.Mesh(new THREE.BoxGeometry(WT+4*S,10*S,divDoorW+12*S),darkWood);
  iHead.position.set(divX,divDoorH+5*S,bdDoorCZ); scene.add(iHead);
  const iDoor=new THREE.Mesh(new THREE.BoxGeometry(8*S,divDoorH-2*S,divDoorW-4*S),woodDoor);

// ── EXIT ──
const exitCooldown=(new URLSearchParams(window.location.search).get('from')==='floor1')?Date.now()+3000:0;

// Room files indexed by roomIdx (1-6)
const ROOM_FILES=['room6.html','room4.html','room2.html','room5.html','room3.html','room1.html'];

let nearRoomIdx=-1;
function checkExitDoor(){
  if(exitTriggered)return; if(Date.now()<exitCooldown)return;
  // Check proximity to each room door
  nearRoomIdx=-1;
  ROOM_ZS.forEach((rz,i)=>{
    if(Math.abs(camera.position.z-rz)<DW*1.2){
      if(camera.position.x<-HW/2+60*S && camera.position.x>-HW/2-20*S) nearRoomIdx=i;
      if(camera.position.x>HW/2-60*S  && camera.position.x<HW/2+20*S)  nearRoomIdx=i+3;
    }
  });
  // Also check floor1 exit
  nearExit=camera.position.x>-HW/2&&camera.position.x<HW/2&&camera.position.z>HL/2-60*S;
  const hint=document.getElementById('doorHint');
  if(hint){
    if(nearRoomIdx>=0) {
      const roomNum=ROOM_FILES[nearRoomIdx].replace(/\.html.*$/,'').replace('room','');
      const zoneId='lq_room'+roomNum;
      let hasClues=false;
      if(window._scenario && Array.isArray(window._scenario.clues)){
        hasClues=window._scenario.clues.some(c=>c.room===zoneId && !c.collected);
      }
      hint.textContent='Press E — Enter '+ROOM_NAMES[nearRoomIdx]+(hasClues?'  🔍 Evidence inside':'');
      hint.style.display='block';
    }
    else if(nearExit)  { hint.textContent='Press E — Return to Floor 1'; hint.style.display='block'; }
    else hint.style.display='none';
  }
}

function updateRoomLabel(){
  let label='';
  ROOM_ZS.forEach((rz,i)=>{
    if(Math.abs(camera.position.z-rz)<RD/2+HW/2){
      if(camera.position.x<-HW/2) label=ROOM_NAMES[i];
      else if(camera.position.x>HW/2) label=ROOM_NAMES[i+3];
    }
  });
  const el=document.getElementById('roomLabel');
  if(label){el.textContent=label;el.style.display='block';}
  else el.style.display='none';
}

function updateRotation(){camera.rotation.order='YXZ';camera.rotation.set(0,yaw,0);}

    document.body.appendChild(_toast);
  }
  return _toast;
}
function showToast(msg){
  const t=getToast();
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._tid); t._tid=setTimeout(()=>t.style.display='none',2500);
}

function tryCopyNearestPainting(){
  if(!selectedObj){ showToast('Select a painting in Edit Mode first'); return; }
  const orig=selectedObj;

  // Find the SVG for this object
  const svgStr=_svgRegistry[orig.userData.editId];

  const newId='picopy_'+(Date.now());
  const g=new THREE.Group();
  g.userData={editId:newId};

  if(svgStr){
    // Rebuild from SVG — find the frame dimensions from the original
    let fw=100*S, fh=70*S;
    orig.traverse(ch=>{
      if(ch.isMesh&&ch.geometry){
        const p=ch.geometry.parameters;
        if(p&&p.width&&p.height&&p.width>fw){ fw=p.width; fh=p.height; }
      }
    });
    // Frame
    const frame=new THREE.Mesh(new THREE.BoxGeometry(fw+12*S,fh+12*S,6*S),darkWood.clone());
    g.add(frame);
    // Fresh texture plane
    const plane=new THREE.Mesh(new THREE.PlaneGeometry(fw,fh),makeSVGTexture(svgStr));
    plane.position.z=4*S;
    g.add(plane);
    _svgRegistry[newId]=svgStr;
  } else {
    // Non-SVG object — deep clone with cloned materials
    orig.traverse(ch=>{
      if(ch.isMesh){
        const m=new THREE.Mesh(ch.geometry,ch.material.clone());
        m.position.copy(ch.position);
        m.rotation.copy(ch.rotation);
        g.add(m);
      }
    });
  }

  // Place it slightly offset from original
  g.position.set(orig.position.x+12*S, orig.position.y, orig.position.z+12*S);
  g.rotation.copy(orig.rotation);
  scene.add(g);
  editableObjects.push(g);
  selectObj(g);
  showToast('✓ Copied — move with arrow keys');
}

function onKeyDown(e){
  if(e.code==='KeyC'&&e.shiftKey){ e.preventDefault(); tryCopyNearestPainting(); return; }
  if(e.code==='KeyM'){ toggleEdit(); return; }
  if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
  if(e.code==='KeyE'&&!exitTriggered&&!EDIT_MODE){
    if(nearRoomIdx>=0){
      exitTriggered=true;
      document.getElementById('doorHint').style.display='none';
      document.getElementById('exitFade').classList.add('show');
      sessionStorage.setItem('lq_lastDoor', nearRoomIdx);
      if(window.SoundSystem)SoundSystem.play('doorOpen');
    setTimeout(()=>window.location.href=ROOM_FILES[nearRoomIdx],600);
      return;
    }
    if(nearExit){
      exitTriggered=true;
      document.getElementById('doorHint').style.display='none';
      document.getElementById('exitFade').classList.add('show');
      const fromFloor2 = new URLSearchParams(window.location.search).get('from') === 'floor2';
      if(window.SoundSystem)SoundSystem.play('doorOpen');
      setTimeout(()=>window.location.href=fromFloor2?'../floor2/floor2.html?from=livingquarters':'../floor1.html?from=livingquarters',600);
      return;
    }
  }
  if(EDIT_MODE&&selectedObj){
    const step=5*S,rot=Math.PI/12;
    if(e.code==='ArrowLeft'){e.preventDefault();selectedObj.position.x-=step;}
    if(e.code==='ArrowRight'){e.preventDefault();selectedObj.position.x+=step;}
    if(e.code==='ArrowUp'&&!e.shiftKey){e.preventDefault();selectedObj.position.z-=step;}
    if(e.code==='ArrowDown'&&!e.shiftKey){e.preventDefault();selectedObj.position.z+=step;}
    if(e.code==='ArrowUp'&&e.shiftKey){e.preventDefault();selectedObj.position.y+=step;}
    if(e.code==='ArrowDown'&&e.shiftKey){e.preventDefault();selectedObj.position.y-=step;}
    if(e.code==='KeyR')selectedObj.rotation.y+=rot;
    if(e.code==='Escape')deselect();
    if(e.code==='Delete'||e.code==='Backspace'){
      selectedObj.userData._deleted=true;
      scene.remove(selectedObj);
      deselect();
    }
    updateSelInfo(); return;
  }
  if(EDIT_MODE)return;
  if(e.code==='KeyW'||e.code==='ArrowUp')moveForward=true;
  if(e.code==='KeyS'||e.code==='ArrowDown')moveBackward=true;
  if(e.code==='ArrowLeft')turnLeft=true;
  if(e.code==='ArrowRight')turnRight=true;
}
function onKeyUp(e){
  if(e.code==='KeyW'||e.code==='ArrowUp')moveForward=false;
  if(e.code==='KeyS'||e.code==='ArrowDown')moveBackward=false;
  if(e.code==='ArrowLeft')turnLeft=false;
  if(e.code==='ArrowRight')turnRight=false;
}

function animate(){
  requestAnimationFrame(animate);
  const delta=(performance.now()-prevTime)/1000; prevTime=performance.now();
  if(turnLeft)yaw+=2.2*delta; if(turnRight)yaw-=2.2*delta;
  const mv=Number(moveForward)-Number(moveBackward);
  if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
  const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  camera.position.x+=fwd.x*mv*55*delta;
  camera.position.z+=fwd.z*mv*55*delta;
  // Clamp to overall structure bounds
  camera.position.x=Math.max(-HW/2-RW+20*S,Math.min(HW/2+RW-20*S,camera.position.x));
  camera.position.z=Math.max(-HL/2+20*S,Math.min(HL/2+WT+20*S,camera.position.z));
  camera.position.y=180*S;
  checkExitDoor(); updateRoomLabel(); updateRotation(); renderer.render(scene,camera);
  EvidenceSystem.update();
}

  btn.style.background='rgba(0,0,0,0.72)';

  btn.style.cursor='pointer';
  const panel=document.createElement('div');

  panel.style.display='none';
  panel.style.padding='10px';
  panel.style.borderRadius='12px';

  return wrap;
}
function addToRightMenu(el){

  if(!panel||!el) return;
  el.style.display='block'; el.style.width='100%'; el.style.margin='6px 0';
  panel.appendChild(el);
}
