<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Knight's Room</title>
<style>
#exitFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.6s ease;}
#exitFade.show{opacity:1;}
#instructionLine{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:14px;color:#eee;background:rgba(0,0,0,0.6);border-radius:6px;z-index:30;pointer-events:none;white-space:nowrap;}
body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;}
canvas{display:block;}
#fadeOverlay{position:fixed;inset:0;background:#000;z-index:9999;animation:fadeOut 0.8s ease forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
#editHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;}
#editBtn,#saveBtn,#loadBtn,#clearBtn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.72);color:#eee;cursor:pointer;}
#editIndicator{padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,0.20);background:rgba(80,20,20,0.8);color:#ffd0d0;}
#editIndicator.on{background:rgba(20,80,20,0.85);color:#d5ffd5;}
#autoStatus{position:fixed;top:108px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:rgba(0,0,0,0.65);color:#d7f7d7;font:12px/1.35 system-ui;display:none;z-index:70;pointer-events:none;}
#selInfo{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,0.8);color:#aaddff;border-radius:8px;font-size:13px;display:none;z-index:60;pointer-events:none;}
#debugHud{position:fixed;left:10px;bottom:10px;color:#9ff;font:12px monospace;background:rgba(0,0,0,0.7);padding:8px;border-radius:6px;display:none;z-index:100;pointer-events:none;}
</style>
</head>
<body>
<div id="exitFade"></div>
<div id="instructionLine">W/↑ Forward &nbsp; S/↓ Back &nbsp; ←/→ Turn &nbsp; E = Exit &nbsp; M = Edit Mode &nbsp; G = Grid</div>
<div id="doorHint" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#e8c87a;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,160,60,0.4);">Press E — Return to Floor 2</div>
<div id="fadeOverlay"></div>
<div id="editHud">
  <button id="editBtn" type="button">Edit Mode</button>
  <button id="saveBtn" type="button">Save Layout</button>
  <button id="loadBtn" type="button">Load Layout</button>
  <button id="clearBtn" type="button">Clear Save</button>
  <div id="editIndicator">OFF</div>
</div>
<div id="autoStatus"></div>
<div id="selInfo" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,0.8);color:#aaddff;border-radius:8px;font-size:13px;display:none;z-index:60;pointer-events:none;"></div>
<div id="chestHint" style="position:fixed;bottom:120px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#c8a820;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,160,60,0.4);">Press E — Open Chest</div>
<div id="debugHud"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const STORAGE_KEY="knights_room_layout";
const S=0.5;
const RW=1600*S, RD=1600*S, RH=625*S;
let scene,camera,renderer,yaw=0,prevTime=performance.now();
let moveForward=false,moveBackward=false,turnLeft=false,turnRight=false;
let EDIT_MODE=false,selectedObject=null;
const editableObjects=[];
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let _ec=0;
let DEBUG_ON=false,debugGroup=null,positionDisplayInterval=null;

function addGroup(g,id){g.userData.editId=id||("grp_"+(++_ec));editableObjects.push(g);scene.add(g);return g;}
function showStatus(msg,ok=true){const el=document.getElementById("autoStatus");el.style.display="block";el.style.color=ok?"#d7f7d7":"#ffd7d7";el.textContent=msg;setTimeout(()=>{el.style.display="none";},2200);}
function updateEditUI(){const ind=document.getElementById("editIndicator");ind.textContent=EDIT_MODE?"ON":"OFF";ind.classList.toggle("on",EDIT_MODE);const btn=document.getElementById("editBtn");btn.textContent=EDIT_MODE?"✏️ Edit Mode: ON":"Edit Mode: OFF";btn.style.background=EDIT_MODE?"rgba(20,80,20,0.85)":"rgba(0,0,0,0.72)";}
function toggleEditMode(){EDIT_MODE=!EDIT_MODE;if(!EDIT_MODE){selectedObject=null;document.getElementById("selInfo").style.display="none";}updateEditUI();}
function saveLayout(){const objects=editableObjects.map(o=>{const wp=new THREE.Vector3();o.getWorldPosition(wp);const wq=new THREE.Quaternion();o.getWorldQuaternion(wq);return{id:o.userData.editId,position:{x:wp.x,y:wp.y,z:wp.z},quaternion:{x:wq.x,y:wq.y,z:wq.z,w:wq.w},scale:{x:o.scale.x,y:o.scale.y,z:o.scale.z}};});localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,objects}));showStatus("✅ Layout saved");}
function loadLayout(){const json=localStorage.getItem(STORAGE_KEY);if(!json){showStatus("No saved layout",false);return;}try{const d=JSON.parse(json);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}showStatus("✅ Layout loaded");}catch(e){showStatus("Load failed",false);}}
function clearSave(){localStorage.removeItem(STORAGE_KEY);showStatus("🗑 Save cleared");}
function onMouseClick(e){if(!EDIT_MODE)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const meshes=[];editableObjects.forEach(o=>{if(o.isMesh)meshes.push(o);else o.traverse(ch=>{if(ch.isMesh)meshes.push(ch);});});const hits=raycaster.intersectObjects(meshes,false);if(!hits.length){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}let obj=hits[0].object;let cur=obj;while(cur){if(editableObjects.includes(cur)){obj=cur;break;}cur=cur.parent;}selectedObject=obj;document.getElementById("selInfo").style.display="block";document.getElementById("selInfo").textContent=`✏️ ${obj.userData.editId} | Arrows=Move  Shift+↑↓=Height  R=Rotate  Del=Delete`;showStatus("Selected: "+obj.userData.editId);}

function buildDebug(){debugGroup=new THREE.Group();debugGroup.visible=false;scene.add(debugGroup);const g=new THREE.GridHelper(4000,80,0x4488ff,0x222244);g.position.y=5;debugGroup.add(g);const f=new THREE.GridHelper(4000,400,0x335577,0x1a1a22);f.position.y=3;debugGroup.add(f);const a=new THREE.AxesHelper(400);a.position.y=10;debugGroup.add(a);}
function toggleDebug(){DEBUG_ON=!DEBUG_ON;if(debugGroup)debugGroup.visible=DEBUG_ON;const hud=document.getElementById("debugHud");hud.style.display=DEBUG_ON?"block":"none";if(DEBUG_ON){positionDisplayInterval=setInterval(()=>{const p=camera.position,yd=((yaw||0)*(180/Math.PI)).toFixed(1);document.getElementById("debugHud").innerHTML=`X: ${p.x.toFixed(1)}<br>Y: ${p.y.toFixed(1)}<br>Z: ${p.z.toFixed(1)}<br>Yaw: ${yd}°`;},100);}else{clearInterval(positionDisplayInterval);}}

function init(){
  setTimeout(()=>{const f=document.getElementById("fadeOverlay");if(f)f.remove();},800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x020202);
  scene.fog=new THREE.Fog(0x020202,200,1000);
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Dark & moody — torches do the work
  scene.add(new THREE.AmbientLight(0x1a1208,2.0));
  const overhead=new THREE.PointLight(0xffcc66,2.5,1400);overhead.position.set(0,RH-40*S,0);scene.add(overhead);
  const overhead2=new THREE.PointLight(0xffaa44,1.8,1000);overhead2.position.set(-RW/4,RH-60*S,0);scene.add(overhead2);
  const overhead3=new THREE.PointLight(0xffaa44,1.8,1000);overhead3.position.set(RW/4,RH-60*S,0);scene.add(overhead3);
  const fire=new THREE.PointLight(0xff6600,3.5,500);fire.position.set(0,60*S,-RD/2+60*S);scene.add(fire);
  const fire2=new THREE.PointLight(0xff4400,2.0,300);fire2.position.set(0,40*S,-RD/2+40*S);scene.add(fire2);

  buildRoom();
  buildDebug();

  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){try{const d=JSON.parse(saved);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}}catch(err){}}

  document.getElementById("editBtn").addEventListener("click",toggleEditMode);
  document.getElementById("saveBtn").addEventListener("click",saveLayout);
  document.getElementById("loadBtn").addEventListener("click",loadLayout);
  document.getElementById("clearBtn").addEventListener("click",clearSave);
  renderer.domElement.addEventListener("click",onMouseClick);
  document.addEventListener("keydown",onKeyDown);
  document.addEventListener("keyup",onKeyUp);
  window.addEventListener("resize",onResize);
  camera.position.set(0,240*S,RD/2-150*S);
  yaw=0;updateRotation();animate();
}

// ── SVG Texture system ──
const _svgMatCache={};
function makeSVGTexture(svgStr){
  if(_svgMatCache[svgStr])return _svgMatCache[svgStr];
  try{
    const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
    const ctx=canvas.getContext('2d');
    const blob=new Blob([svgStr],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const tex=new THREE.CanvasTexture(canvas);
    const mat=new THREE.MeshLambertMaterial({map:tex,color:0xffffff,side:THREE.DoubleSide});
    const img=new Image();
    img.onload=()=>{ctx.drawImage(img,0,0,512,512);tex.needsUpdate=true;URL.revokeObjectURL(url);};
    img.src=url;
    _svgMatCache[svgStr]=mat;
    return mat;
  }catch(e){return new THREE.MeshLambertMaterial({color:0x1a1208,side:THREE.DoubleSide});}
}

function buildRoom(){
  const stoneMat  =new THREE.MeshLambertMaterial({color:0x181614});
  const stoneDark =new THREE.MeshLambertMaterial({color:0x0c0a08});
  const stoneLight=new THREE.MeshLambertMaterial({color:0x222018});
  const floorMat  =new THREE.MeshLambertMaterial({color:0x0a0806});
  const ceilMat   =new THREE.MeshLambertMaterial({color:0x080604});
  const darkWood  =new THREE.MeshLambertMaterial({color:0x120c04});
  const richWood  =new THREE.MeshLambertMaterial({color:0x1e1008});
  const ironMat   =new THREE.MeshLambertMaterial({color:0x1a1a1c});
  const steelMat  =new THREE.MeshLambertMaterial({color:0x2a2a30});
  const goldMat   =new THREE.MeshLambertMaterial({color:0xb8900a});
  const redFabric =new THREE.MeshLambertMaterial({color:0x220808});
  const brownMat  =new THREE.MeshLambertMaterial({color:0x1a1008});
  const flameMat  =new THREE.MeshLambertMaterial({color:0xff8800,emissive:0xff4400,emissiveIntensity:1});
  const candleMat =new THREE.MeshLambertMaterial({color:0xe8e0c0});
  const emberMat  =new THREE.MeshLambertMaterial({color:0xff3300,emissive:0xaa1100,emissiveIntensity:1});

  // ── Stone floor ──
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),floorMat);
  floor.rotation.x=-Math.PI/2;scene.add(floor);
  const tSz=80*S;
  for(let ix=0;ix<Math.ceil(RW/tSz);ix++)for(let iz=0;iz<Math.ceil(RD/tSz);iz++){
    const t=new THREE.Mesh(new THREE.BoxGeometry(tSz-4,2*S,tSz-4),(ix+iz)%2===0?stoneMat:stoneDark);
    t.position.set(-RW/2+tSz*(ix+0.5),1*S,-RD/2+tSz*(iz+0.5));scene.add(t);
  }
  const jm=new THREE.MeshLambertMaterial({color:0x060402});
  for(let ix=0;ix<=Math.ceil(RW/tSz);ix++){const j=new THREE.Mesh(new THREE.BoxGeometry(3*S,2.5*S,RD),jm);j.position.set(-RW/2+tSz*ix,1.5*S,0);scene.add(j);}
  for(let iz=0;iz<=Math.ceil(RD/tSz);iz++){const j=new THREE.Mesh(new THREE.BoxGeometry(RW,2.5*S,3*S),jm);j.position.set(0,1.5*S,-RD/2+tSz*iz);scene.add(j);}

  // ── Ceiling with wooden beams ──
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),ceilMat);
  ceil.rotation.x=Math.PI/2;ceil.position.y=RH;scene.add(ceil);
  [-RW/3,0,RW/3].forEach(bx=>{
    const beam=new THREE.Mesh(new THREE.BoxGeometry(20*S,20*S,RD),darkWood);beam.position.set(bx,RH-10*S,0);scene.add(beam);
  });
  for(let iz=-2;iz<=2;iz++){
    const beam=new THREE.Mesh(new THREE.BoxGeometry(RW,14*S,14*S),richWood);beam.position.set(0,RH-7*S,iz*(RD/4));scene.add(beam);
  }

  // ── Stone walls with block pattern ──
  const backWall=new THREE.Mesh(new THREE.BoxGeometry(RW,RH,18*S),stoneMat);backWall.position.set(0,RH/2,-RD/2+9*S);scene.add(backWall);
  for(let bx=0;bx<6;bx++)for(let by=0;by<5;by++){
    const bk=new THREE.Mesh(new THREE.BoxGeometry(RW/6-6,RH/5-6,4*S),(bx+by)%2===0?stoneLight:stoneMat);
    bk.position.set(-RW/2+RW/6*(bx+0.5),RH/5*(by+0.5),-RD/2+20*S);scene.add(bk);
  }
  const leftWall=new THREE.Mesh(new THREE.BoxGeometry(18*S,RH,RD),stoneMat);leftWall.position.set(-RW/2+9*S,RH/2,0);scene.add(leftWall);
  const rightWall=leftWall.clone();rightWall.position.x=RW/2-9*S;scene.add(rightWall);
  [-1,1].forEach(s=>{for(let bz=0;bz<5;bz++)for(let by=0;by<5;by++){const bk=new THREE.Mesh(new THREE.BoxGeometry(4*S,RH/5-6,RD/5-6),(bz+by)%2===0?stoneLight:stoneMat);bk.position.set(s*(RW/2-20*S),RH/5*(by+0.5),-RD/2+RD/5*(bz+0.5));scene.add(bk);}});

  // Front wall with door
  const dGapW=240*S;const fSideW=(RW-dGapW)/2;
  const fL=new THREE.Mesh(new THREE.BoxGeometry(fSideW,RH,18*S),stoneMat);fL.position.set(-(dGapW/2+fSideW/2),RH/2,RD/2-9*S);scene.add(fL);
  const fR=fL.clone();fR.position.x=dGapW/2+fSideW/2;scene.add(fR);
  const dW2=110*S,dH2=360*S,doorZ=RD/2-8*S;

    const bc1=new THREE.Mesh(new THREE.BoxGeometry(60*S,8*S,5*S),goldMat);bc1.position.set(0,130*S,-32*S);cg.add(bc1);
    const bc2=new THREE.Mesh(new THREE.BoxGeometry(8*S,80*S,5*S),goldMat);bc2.position.set(0,121*S,-32*S);cg.add(bc2);
    [[-30*S,30*S],[30*S,30*S],[-30*S,-30*S],[30*S,-30*S]].forEach(([ox,oz])=>{const leg=new THREE.Mesh(new THREE.CylinderGeometry(5*S,5*S,60*S,6),ironMat);leg.position.set(ox,30*S,oz);cg.add(leg);});
    cg.position.set(100*S+s*100*S,0,RD/4);cg.rotation.y=s===1?Math.PI:0;
    addGroup(cg,"chair_"+(i+1));
  });

  // ── LARGE SHIELD ON LEFT WALL ──
  const lshG=new THREE.Group();
  const lsh=new THREE.Mesh(new THREE.BoxGeometry(120*S,150*S,10*S),ironMat);lshG.add(lsh);
  const lshBot=new THREE.Mesh(new THREE.ConeGeometry(60*S,60*S,4),ironMat);lshBot.position.set(0,-105*S,0);lshBot.rotation.y=Math.PI/4;lshG.add(lshBot);
  const lshRim=new THREE.Mesh(new THREE.BoxGeometry(128*S,10*S,6*S),goldMat);lshRim.position.set(0,70*S,6*S);lshG.add(lshRim);
  const lshV=new THREE.Mesh(new THREE.BoxGeometry(10*S,150*S,6*S),goldMat);lshV.position.z=6*S;lshG.add(lshV);
  const lshH=new THREE.Mesh(new THREE.BoxGeometry(120*S,10*S,6*S),goldMat);lshH.position.z=6*S;lshG.add(lshH);
  const lshBoss=new THREE.Mesh(new THREE.SphereGeometry(20*S,10,10),steelMat);lshBoss.position.z=8*S;lshG.add(lshBoss);
  lshG.position.set(-RW/2+12*S,RH*0.55,-RD/4);lshG.rotation.y=Math.PI/2;
  addGroup(lshG,"shield_wall");

  // ── DARK RUG ──
  const rugG=new THREE.Group();
  const rugB=new THREE.Mesh(new THREE.BoxGeometry(380*S,2*S,220*S),new THREE.MeshLambertMaterial({color:0x080404}));rugB.position.y=1*S;rugG.add(rugB);
  const rug=new THREE.Mesh(new THREE.BoxGeometry(365*S,3*S,205*S),redFabric);rug.position.y=2*S;rugG.add(rug);
  // Iron cross pattern on rug
  const rugCross1=new THREE.Mesh(new THREE.BoxGeometry(300*S,4*S,16*S),new THREE.MeshLambertMaterial({color:0x0a0606}));rugCross1.position.y=3*S;rugG.add(rugCross1);
  const rugCross2=new THREE.Mesh(new THREE.BoxGeometry(16*S,4*S,160*S),new THREE.MeshLambertMaterial({color:0x0a0606}));rugCross2.position.y=3*S;rugG.add(rugCross2);
  rugG.position.set(100*S,0,RD/4);
  addGroup(rugG,"rug");

  // ── CHEST — foot of bed ──
  const chG=new THREE.Group();
  const chBody=new THREE.Mesh(new THREE.BoxGeometry(200*S,80*S,100*S),darkWood);chBody.position.set(0,40*S,0);chG.add(chBody);
  const lidPivot=new THREE.Group();lidPivot.position.set(0,80*S,-50*S);
  const cLid=new THREE.Mesh(new THREE.BoxGeometry(200*S,28*S,100*S),darkWood);cLid.position.set(0,14*S,50*S);lidPivot.add(cLid);
  const cLidTop=new THREE.Mesh(new THREE.CylinderGeometry(50*S,50*S,200*S,16,1,false,0,Math.PI),richWood);cLidTop.rotation.z=Math.PI/2;cLidTop.position.set(0,28*S,50*S);lidPivot.add(cLidTop);
  chG.add(lidPivot);chG.userData.lidPivot=lidPivot;
  [-70*S,0,70*S].forEach(bx=>{const s=new THREE.Mesh(new THREE.BoxGeometry(7*S,112*S,102*S),ironMat);s.position.set(bx,54*S,0);chG.add(s);});
  const lock=new THREE.Mesh(new THREE.BoxGeometry(20*S,20*S,7*S),goldMat);lock.position.set(0,74*S,51*S);chG.add(lock);
  chG.position.set(-RW/2+bW/2+30*S+bW/2+60*S,0,-RD/2+500*S+80*S);
  addGroup(chG,"chest");

  // ── Knight Paintings ──
  function makePainting(svgStr,fw,fh,id,pos,rotY){
    const pg=new THREE.Group();
    const frame=new THREE.Mesh(new THREE.BoxGeometry(fw+24*S,fh+24*S,12*S),new THREE.MeshLambertMaterial({color:0x1a1008}));pg.add(frame);
    const inner=new THREE.Mesh(new THREE.BoxGeometry(fw+10*S,fh+10*S,14*S),new THREE.MeshLambertMaterial({color:0xb8900a}));inner.position.z=-1*S;pg.add(inner);
    const canvas=new THREE.Mesh(new THREE.PlaneGeometry(fw,fh),makeSVGTexture(svgStr));canvas.position.z=7*S;pg.add(canvas);
    pg.position.copy(pos);if(rotY!==undefined)pg.rotation.y=rotY;
    addGroup(pg,id);
  }
  makePainting(SVG_KNIGHT_A,100*S,136*S,"painting_knight_a",new THREE.Vector3(-RW/2+12*S,280*S,-RD/4),Math.PI/2);
  makePainting(SVG_KNIGHT_BATTLE,150*S,110*S,"painting_battle",new THREE.Vector3(RW/4,280*S,-RD/2+14*S));
  makePainting(SVG_KNIGHT_B,100*S,136*S,"painting_knight_b",new THREE.Vector3(-RW/4,280*S,-RD/2+14*S));
}

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
function updateRotation(){camera.rotation.order="YXZ";camera.rotation.set(0,yaw,0);}

const exitCooldown=(new URLSearchParams(window.location.search).get("from")==="floor2")?Date.now()+4000:0;
let exitTriggered=false,nearExit=false;
let nearChest=false,chestOpen=false,chestGroup=null;

function checkExitDoor(){
  if(exitTriggered)return;if(Date.now()<exitCooldown)return;
  nearExit=camera.position.x>-200*S&&camera.position.x<200*S&&camera.position.z>RD/2-200*S;
  document.getElementById("doorHint").style.display=nearExit?"block":"none";
}

function checkChest(){
  if(!chestGroup)chestGroup=editableObjects.find(o=>o.userData.editId==="chest");
  if(!chestGroup)return;
  const wp=new THREE.Vector3();chestGroup.getWorldPosition(wp);
  const dx=camera.position.x-wp.x,dz=camera.position.z-wp.z;
  nearChest=Math.sqrt(dx*dx+dz*dz)<180*S;
  const hint=document.getElementById("chestHint");
  if(nearChest&&!nearExit){hint.textContent=chestOpen?"Press E — Close Chest":"Press E — Open Chest";hint.style.display="block";}
  else hint.style.display="none";
}

function animateChest(delta){
  if(!chestGroup)return;const pivot=chestGroup.userData.lidPivot;if(!pivot)return;
  const target=chestOpen?-Math.PI*0.75:0;
  pivot.rotation.x+=(target-pivot.rotation.x)*Math.min(1,delta*6);
}

function onKeyDown(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.code==="KeyM"){toggleEditMode();return;}
  if(e.code==="KeyG"){toggleDebug();return;}
if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
    if(e.code==="KeyE"){
    if(nearChest&&!nearExit){chestOpen=!chestOpen;return;}
    if(nearExit&&!exitTriggered){
      exitTriggered=true;
      document.getElementById("doorHint").style.display="none";
      document.getElementById("exitFade").classList.add("show");
      setTimeout(()=>window.location.href="floor2.html?from=knights_room",600);
    }
    return;
  }
  if(EDIT_MODE&&selectedObject){
    if(e.code==="Delete"||e.code==="Backspace"){e.preventDefault();scene.remove(selectedObject);const idx=editableObjects.indexOf(selectedObject);if(idx>-1)editableObjects.splice(idx,1);showStatus("🗑 Deleted");selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
    const speed=e.shiftKey?1:8;
    if(!e.shiftKey){if(e.code==="ArrowUp"){selectedObject.position.z-=speed;}if(e.code==="ArrowDown"){selectedObject.position.z+=speed;}if(e.code==="ArrowLeft"){selectedObject.position.x-=speed;}if(e.code==="ArrowRight"){selectedObject.position.x+=speed;}}
    if(e.shiftKey&&e.code==="ArrowUp")selectedObject.position.y+=speed;
    if(e.shiftKey&&e.code==="ArrowDown")selectedObject.position.y-=speed;
    if(e.code==="KeyR")selectedObject.rotation.y+=e.shiftKey?0.05:0.1;
    return;
  }
  if(!EDIT_MODE){
    if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=true;
    if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=true;
    if(e.code==="ArrowLeft")turnLeft=true;
    if(e.code==="ArrowRight")turnRight=true;
  }
}
function onKeyUp(e){
  if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=false;
  if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=false;
  if(e.code==="ArrowLeft")turnLeft=false;
  if(e.code==="ArrowRight")turnRight=false;
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),delta=(now-prevTime)/1000;prevTime=now;
  if(!EDIT_MODE){
    if(turnLeft)yaw+=2.2*delta;if(turnRight)yaw-=2.2*delta;
    const mv=Number(moveForward)-Number(moveBackward);
    if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    camera.position.x=Math.max(-RW/2+20*S,Math.min(RW/2-20*S,camera.position.x+fwd.x*mv*110*delta));
    camera.position.z=Math.max(-RD/2+20*S,Math.min(RD/2-15*S,camera.position.z+fwd.z*mv*110*delta));
    camera.position.y=240*S;
  }
  checkExitDoor();checkChest();animateChest(delta);updateRotation();renderer.render(scene,camera);
  EvidenceSystem.update();
}

// engine scripts loaded below
</script>
<script src="../floor1/sound-system.js"></script>

<script src="../floor1/mystery-state.js"></script>
<script src="../floor1/mystery-ui.js"></script>

<script>
(async()=>{
  await MysteryEngine.init();
  let scenario=await MysteryState.load();
  if(!scenario){scenario=MysteryEngine.generate();await MysteryState.save(scenario);}
  window._scenario=scenario;
  MysteryUI.init(scenario,false);
  MysteryUI.setZone('knights_room');
  init();
  EvidenceSystem.init({ camera, scene, renderer, zoneId: 'knightsroom' });
  const _sa=()=>{if(window.SoundSystem)SoundSystem.startAmbient();window.removeEventListener('keydown',_sa);window.removeEventListener('click',_sa);};
  window.addEventListener('keydown',_sa);window.addEventListener('click',_sa);
})();
</script>
