(function () {
  const show = (title, err) => {
    const msg = (err && (err.stack || err.message)) ? (err.stack || err.message) : String(err);
    let el = document.getElementById("fatalErrorOverlay");
    if (!el) {
      el = document.createElement("div");

      el.style.cssText =
        "position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,0.92);" +
        "color:#ffb3b3;font:14px/1.4 system-ui,Segoe UI,Arial;padding:16px;" +
        "white-space:pre-wrap;overflow:auto;";
      document.addEventListener("DOMContentLoaded", () => document.body.appendChild(el));
    }
    el.textContent = "🚨 " + title + "\n\n" + msg;
  };

  window.addEventListener("error", (e) => show("JS Error", e.error || (e.message + " @ " + e.filename + ":" + e.lineno)));
  window.addEventListener("unhandledrejection", (e) => show("Unhandled Promise Rejection", e.reason || e));
})();

// ===== SEEDED RANDOM (DETERMINISTIC WORLD BUILD) =====
// Fixed seed so Ctrl+Shift+R produces the SAME layout every time.
// Change the number below if you EVER want a different baseline.
let __SEED__ = 13371337;
function rand() {
  __SEED__ |= 0;
  __SEED__ = (__SEED__ + 0x6D2B79F5) | 0;
  let t = Math.imul(__SEED__ ^ (__SEED__ >>> 15), 1 | __SEED__);
  t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

// 🔒 Override Math.random globally (intentional & safe here)

// ====================== SVG PICTURE SYSTEM (same as livingroom) ======================
const _svgMatCache={};
function makeSVGTexture(svgString){
  if(_svgMatCache[svgString]) return _svgMatCache[svgString];
  try{
    const canvas=document.createElement('canvas'); canvas.width=512; canvas.height=512;
    const ctx=canvas.getContext('2d');
    const blob=new Blob([svgString],{type:'image/svg+xml'});
    const url=URL.createObjectURL(blob);
    const tex=new THREE.CanvasTexture(canvas);
    const mat=new THREE.MeshLambertMaterial({map:tex,color:0xffffff,side:THREE.DoubleSide});
    const img=new Image();
    img.onload=()=>{ctx.drawImage(img,0,0,512,512);tex.needsUpdate=true;URL.revokeObjectURL(url);};
    img.src=url;
    _svgMatCache[svgString]=mat;
    return mat;
  }catch(e){return new THREE.MeshLambertMaterial({color:0x4a3a2a,side:THREE.DoubleSide});}
}

// ====================== PICTURE FRAME FACTORY ======================
function makeFramedPicture(frameW = 260, frameH = 360, svgStr) {
 const g = new THREE.Group();
 g.userData = g.userData || {};
 g.userData.isPictureFrame = true;
 g.userData.frameW = frameW;
 g.userData.frameH = frameH;

 const frameMat = new THREE.MeshLambertMaterial({
  color: 0x0f0803,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
 });
 const outer = new THREE.Mesh(new THREE.BoxGeometry(frameW+28, frameH+28, 10), frameMat);
 g.add(outer);

 const lip = new THREE.Mesh(new THREE.BoxGeometry(frameW+10, frameH+10, 12),
  new THREE.MeshLambertMaterial({color:0x0f0803}));
 lip.position.z = 2;
 g.add(lip);

 const canvasMat = makeSVGTexture(svgStr);
 const art = new THREE.Mesh(new THREE.PlaneGeometry(frameW, frameH), canvasMat);
 art.position.z = 12;
 art.userData.isPictureArt = true;
 g.add(art);

 return g;
}

// ====================== PLACE 8 FRAMED PICTURES PER SEGMENT (NEW) ======================

function addFramedPicturesToCorridorSegment(parent, center, angle, len) {
 const perSide = (len > 1200) ? 3 : 1;
 const spacing = len / (perSide + 1);

 const dirX = Math.sin(angle);
 const dirZ = Math.cos(angle);
 const cos = Math.cos(angle);
 const sin = Math.sin(angle);

 const insetFromWall = 6;
 const wallOffset = (CORRIDOR_W / 1.9) - insetFromWall;

 let imgIndex = Math.floor(Math.random() * CORRIDOR_SVG_IMAGES.length);

 for (let i = 1; i <= perSide; i++) {
  const along = i * spacing - len / 2;
  const x = center.x + dirX * along;
  const z = center.z + dirZ * along;

  // LEFT wall
  {
   const img = CORRIDOR_SVG_IMAGES[imgIndex++ % CORRIDOR_SVG_IMAGES.length];
   const frame = makeFramedPicture(195, 270, img);

   // ✅ stable ID + editable
   setEditId(frame, `pic_${Math.round(center.x)}_${Math.round(center.z)}_${Math.round(angle * 1000)}_L_${i}`);
   editableObjects.push(frame);

   frame.position.set(
    x - cos * wallOffset,
    WALL_H * 0.50,
    z + sin * wallOffset
   );
   frame.rotation.y = angle + Math.PI / 2;
   parent.add(frame);
  }

  // RIGHT wall
  {
   const img = CORRIDOR_SVG_IMAGES[imgIndex++ % CORRIDOR_SVG_IMAGES.length];
   const frame = makeFramedPicture(195, 270, img);

   // ✅ stable ID + editable
   setEditId(frame, `pic_${Math.round(center.x)}_${Math.round(center.z)}_${Math.round(angle * 1000)}_R_${i}`);
   editableObjects.push(frame);

   frame.position.set(
    x + cos * wallOffset,
    WALL_H * 0.50,
    z - sin * wallOffset
   );
   frame.rotation.y = angle - Math.PI / 2;
   parent.add(frame);
  }
 }
}
// Furniture code cleaned up - minimal version


function addAntiqueFurnitureToCorridorSegment(parent, center, angle, len) {
  const perSide = Math.max(1, Math.floor(len / 900));
  const spacing = len / (perSide + 1);

  const dirX = Math.sin(angle);
  const dirZ = Math.cos(angle);
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);

  const wallOffset = CORRIDOR_W / 2 - 45;

  // Fully deterministic placement - no random movement on reload
  for (let i = 1; i <= perSide; i++) {
    const along = i * spacing - len / 2;
    const x = center.x + dirX * along;
    const z = center.z + dirZ * along;

    const side = (i % 2 === 0) ? 1 : -1;
    const fx = x - cos * wallOffset * side + (i * 12);   // tiny fixed offset
    const fz = z + sin * wallOffset * side;

   const furniture = createAntiqueFurniturePiece();

    // ✅ Stable ID so this furniture gets included in save/load
    setEditId(
      furniture,
      `furn_${Math.round(center.x)}_${Math.round(center.z)}_${Math.round(angle * 1000)}_${i}_${side}`
    );

    furniture.position.set(fx, 0, fz);
    furniture.rotation.y = angle + (side > 0 ? 0 : Math.PI);
    parent.add(furniture);

    editableObjects.push(furniture);

  }
}

function saveLayout() {
  try {

  for (const w of editableWalls) {

  const walls = editableWalls
    .filter(w => w.mesh && w.mesh.userData && w.mesh.userData.floorEdit)
    .map(w => {

      w.mesh.getWorldPosition(wp);
      w.mesh.getWorldQuaternion(wq);
      const e = new THREE.Euler().setFromQuaternion(wq, "YXZ");
      return {
        id: String(w.mesh.userData.editId),
        angle: w.angle,
        currentLen: w.currentLen,
        position: { x: wp.x, y: wp.y, z: wp.z },
        rotationY: e.y,
        anchorIsA: w.anchorIsA,
        isTunnel:   !!(w.mesh.userData && w.mesh.userData.isTunnelWall),
        geomHeight: w.mesh.userData.geomHeight || null,
        geomThick:  w.mesh.userData.geomThick  || null
      };
    });

  const objects = editableObjects
    .filter(o => o && o.userData && o.userData.editId)
    .map(o => {
      return {
        id: o.userData.editId,
        position: { x: o.position.x, y: o.position.y, z: o.position.z },
        quaternion: { x: o.quaternion.x, y: o.quaternion.y, z: o.quaternion.z, w: o.quaternion.w },
        scale: { x: o.scale.x, y: o.scale.y, z: o.scale.z },
        extra: (o.userData.isRailingRail && o.userData.currentLen != null)
          ? { currentLen: o.userData.currentLen }

  const payload = { version: 1, savedAt: Date.now(), walls, objects };

 // --- SAFETY SNAPSHOT (NEW KEY EVERY SAVE) ---
// Format: <FLOOR_ID>_snapshot_<YYYY-MM-DD>_<HH-MM-SS> (local time)

  now.getFullYear() + "-" +

  String(now.getDate()).padStart(2, "0");

  String(now.getHours()).padStart(2, "0") + "-" +
  String(now.getMinutes()).padStart(2, "0") + "-" +
  String(now.getSeconds()).padStart(2, "0");

// ✅ Make snapshot keys truly unique (prevents overwriting when multiple saves happen in the same second)
const ms = String(now.getMilliseconds()).padStart(3, "0");
const seqKey = FLOOR_ID + "_snapshot_seq";
const seq = (parseInt(localStorage.getItem(seqKey) || "0", 10) + 1);
localStorage.setItem(seqKey, String(seq));

const snapKey = `${FLOOR_ID}_snapshot_${date}_${time}-${ms}_${seq}`;
localStorage.setItem(snapKey, json);
// ✅ ALSO persist latest snapshot to the primary layout key (REQUIRED for walls)
// ✅ DON'T overwrite shared layout - backups stay independent
// snapshot index
const indexKey = FLOOR_ID + "_snapshot_index";
const list = JSON.parse(localStorage.getItem(indexKey) || "[]");

// ✅ Trim old snapshots — keep only last 5 to prevent localStorage overflow
while (list.length >= 5) {
  const oldKey = list.pop();
  try { localStorage.removeItem(oldKey); } catch(e) {}
}

// ✅ Put newest FIRST so order is authoritative
list.unshift(snapKey);

localStorage.setItem(indexKey, JSON.stringify(list));

// update dropdown if present

if (sel) {

    o.textContent = k;

}

  var wMesh = new THREE.Mesh(new THREE.BoxGeometry(2000, 10, 600), wMat);

  var rp = [{x:0.25,y:0.35},{x:0.65,y:0.60},{x:0.45,y:0.20},{x:0.75,y:0.30},{x:0.15,y:0.70}];
  window.__updatePoolWater = function(t) {
    var g = wCtx.createLinearGradient(0,0,WC,WC);
    g.addColorStop(0,"#00446a"); g.addColorStop(0.5,"#005f8a"); g.addColorStop(1,"#003355");
    wCtx.fillStyle = g; wCtx.fillRect(0,0,WC,WC);
    rp.forEach(function(src,i) {
      for(var r=0;r<3;r++){
        var ph=((t*0.6+i*0.4+r*0.25)%1), rd=ph*WC*0.55, al=(1-ph)*0.5;
        wCtx.beginPath(); wCtx.arc(src.x*WC,src.y*WC,rd,0,Math.PI*2);
        wCtx.strokeStyle="rgba(120,210,255,"+al+")"; wCtx.lineWidth=2; wCtx.stroke();
      }
    });
    wTex.needsUpdate = true;
  };
})();

const rotateTowerSetInPlace = (towerIndex, yawDelta) => {
  const center = getTowerCenterWorld(towerIndex);
  if (!center) {
    console.warn(`Cannot rotate tower ${towerIndex} - no center found`);
    return;
  }

  forEachTowerPiece(towerIndex, (o) => {
    if (!o) return;

    if (o.userData?.isRailingGroup) {
      o.rotation.y += yawDelta;
      return;
    }

    const isRing = o.userData?.isRailingRail ||
                   String(o.userData?.editId || "").startsWith("tower_top_ring_");

    if (isRing) {
      o.rotation.z += yawDelta;
    } else {
      // POSTS: rotate position around center + orientation
      const pos = o.position.clone();
      const offset = pos.clone().sub(center);
      const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yawDelta);
      offset.applyQuaternion(q);
      o.position.copy(center).add(offset);
      o.rotation.y += yawDelta;
    }
  });

  markEdited();
  console.log(`✅ Tower ${towerIndex} ring + posts rotated together in place`);
};

function onPointerDown(event) {
  if (!EDIT_MODE) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  // Pick EVERYTHING editable (walls + rails + posts + furniture)
  const wallMeshes = editableWalls.map(w => w.mesh).filter(Boolean);
  const pickables = wallMeshes.concat(editableObjects);

const hits = raycaster.intersectObjects(pickables, true);

// ✅ NEW: if nothing hit → we're clicking a HOLE → create/select doorway
if (!hits.length) {

 const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);

 // project point forward into the doorway space
 const p = camera.position.clone().add(forward.multiplyScalar(200));

 // ✅ create a selectable doorway handle EXACTLY where you're aiming
 let handle = new THREE.Mesh(
  new THREE.BoxGeometry(120, 180, 60),
  new THREE.MeshBasicMaterial({ visible:false })
 );

 handle.position.copy(p);
 handle.userData = handle.userData || {};
 handle.userData.isCatacombDoorway = true;

 setEditId(handle, "door_" + Date.now());
 editableObjects.push(handle);
 scene.add(handle);

 selectedObject = handle;

 if (typeof showAutoStatus === "function") {
  showAutoStatus("🟢 Doorway selected", true);
 }

 return;
}
  // Reset wall selection each click
  selectedWall = null;

  // Start from the hit object
  let obj = hits[0].object;

 // If it’s a furniture group or other grouped editableObject, climb up to the registered root
let root = obj;

// ✅ NEW: If we clicked a child of a grouped railing, bubble up to the group
// (so clicking any post/ring selects the ONE group you move)
while (
 root &&
 root.parent &&
 root.parent !== scene &&
 !editableObjects.includes(root) &&
 !(root.userData && root.userData.isRailingGroup)
) {
 root = root.parent;

 function getMeshWorldAxisZ(mesh) {
   return new THREE.Vector3(0,0,1).applyQuaternion(mesh.getWorldQuaternion(new THREE.Quaternion())).normalize();

 function getWallEndpointsWorld(wallRec) {
   const axis = getMeshWorldAxisZ(wallRec.mesh);
   const half = wallRec.currentLen * 0.5;
   const c = wallRec.mesh.getWorldPosition(new THREE.Vector3());
   const endA = c.clone().add(axis.clone().multiplyScalar(-half));

 function ensurePivotAnchoredAtNearestEnd(wallRec, clickPoint) {
   if (wallRec.pivot) return;
   const { endA, endB } = getWallEndpointsWorld(wallRec);
   const distA = clickPoint.distanceTo(endA);
   const distB = clickPoint.distanceTo(endB);
   const freeIsA = distA < distB;
   const anchorWorld = freeIsA ? endB : endA;
   const pivot = new THREE.Object3D();
   pivot.position.copy(anchorWorld);
   pivot.position.y = (wallRec.wallBaseY != null) ? wallRec.wallBaseY : WALL_H / 2;
   const wallYaw = wallRec.mesh.rotation.y;
   pivot.rotation.set(0, wallYaw + (freeIsA ? Math.PI : 0), 0);
   scene.add(pivot);
   pivot.add(wallRec.mesh);
   wallRec.mesh.rotation.set(0,0,0);
   wallRec.mesh.scale.set(1,1,1);
   wallRec.mesh.position.set(0,0,0);
   wallRec.pivot = pivot;
   wallRec.anchorIsA = !freeIsA;
   wallRec.editDir = new THREE.Vector3(0,0,1).applyQuaternion(pivot.quaternion).normalize();
   wallRec.editNormal = new THREE.Vector3(1,0,0).applyQuaternion(pivot.quaternion).normalize();

function moveSelectedWall(wallRec, deltaWorld) {
 if (!wallRec || !wallRec.pivot) return;

 // Apply requested movement
 wallRec.pivot.position.x += deltaWorld.x;
 wallRec.pivot.position.z += deltaWorld.z;
 wallRec.pivot.position.y = (wallRec.wallBaseY != null) ? wallRec.wallBaseY : WALL_H / 2;

 // ✅ SNAP (tunnel walls only): snap moved wall endpoints to nearby tunnel wall endpoints
 const isTunnel = !!(wallRec.mesh && wallRec.mesh.userData && wallRec.mesh.userData.isTunnelWall);
 if (!isTunnel) return;

 const SNAP_DIST = 85; // tune: bigger = stronger snapping
 const me = getWallEndpointsWorld(wallRec);
 const myEnds = [me.endA, me.endB];

 let bestDelta = null;
 let bestDist = Infinity;

 for (let i = 0; i < editableWalls.length; i++) {
  const other = editableWalls[i];
  if (!other || other === wallRec || !other.mesh) continue;
  if (!(other.mesh.userData && other.mesh.userData.isTunnelWall)) continue;

  const oe = getWallEndpointsWorld(other);
  const oEnds = [oe.endA, oe.endB];

  for (let a = 0; a < 2; a++) {
   for (let b = 0; b < 2; b++) {
    const d = myEnds[a].distanceTo(oEnds[b]);
    if (d > SNAP_DIST) continue;
    if (d < bestDist) {
     bestDist = d;
     bestDelta = oEnds[b].clone().sub(myEnds[a]);
    }
   }
  }
 }

 if (bestDelta) {
  wallRec.pivot.position.x += bestDelta.x;
  wallRec.pivot.position.z += bestDelta.z;
  wallRec.pivot.position.y = (wallRec.wallBaseY != null) ? wallRec.wallBaseY : WALL_H / 2;
 }
}

 function makeOldMedievalBrickTexture() {
   const canvas = document.createElement("canvas");

   const ctx = canvas.getContext("2d");
   ctx.fillStyle = "#4a443b";
   ctx.fillRect(0,0,512,512);
   const irand = (min,max)=>Math.floor(min+Math.random()*(max-min));
   const brickH = 40, brickW = 92, mortar = 6;
   for (let y=0; y<512; y += brickH + mortar){

       ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
       ctx.fillRect(x+mortar, y+mortar, brickW, brickH);
       ctx.strokeStyle = "rgba(0,0,0,0.22)";
       ctx.lineWidth = 2;
       ctx.strokeRect(x+mortar+1, y+mortar+1, brickW-2, brickH-2);

 // 4. Optional: prune objects that were deleted in edit mode
const savedIds = new Set([

]);

    const keep =

        eid.startsWith("tnl_") ||

    // If it has an id, and it's NOT in the saved snapshot, and it's not protected → remove it

<!-- ================================================================
     DATA SECURITY ENHANCEMENTS
     - Defines markEdited() with dirty tracking (was called but never defined)
     - Warns before closing tab with unsaved changes
     - Auto-saves to IndexedDB every 2 min (survives cache/cookie clears)
     - Prunes old localStorage snapshots so the quota never overflows
     - Adds a timestamped "📦 Backup" download button
     - Adds an IDB recovery button when localStorage is empty
     ================================================================ -->
<script>
(function () {
  "use strict";

  // ── 1. DEFINE markEdited (called throughout the app but was never defined) ──
  let _isDirty = false;
  window.markEdited = function () { _isDirty = true; };

  // Make the instruction-bar light clickable to toggle edit mode
  setTimeout(() => {
    const light = document.getElementById("editLight");
    if (light && typeof toggleEditMode === "function") {
      light.addEventListener("click", () => {
        toggleEditMode();
      });
    }
  }, 800);

  // ── 2. WARN BEFORE CLOSING TAB WITH UNSAVED CHANGES ──
  window.addEventListener("beforeunload", (e) => {
    // unsaved changes warning removed
  });

  // ── 3. PATCH saveLayout TO RESET DIRTY FLAG + PRUNE OLD SNAPSHOTS ──
  const MAX_SNAPSHOTS = 20; // keep newest 20 in the index
  function pruneOldSnapshots() {
    try {
      const indexKey = (typeof FLOOR_ID !== "undefined" ? FLOOR_ID : "floor2") + "_snapshot_index";
      const list = JSON.parse(localStorage.getItem(indexKey) || "[]");
      if (list.length <= MAX_SNAPSHOTS) return;
      // ✅ Trim the index list only — the actual snapshot data is NEVER deleted
      list.splice(MAX_SNAPSHOTS);
      localStorage.setItem(indexKey, JSON.stringify(list));
      console.log("🧹 Snapshot index trimmed to", MAX_SNAPSHOTS, "entries (all data kept)");
    } catch (_) {}
  }

  // Wait until saveLayout is definitely defined (it's declared in the main script above)
  const _origSave = window.saveLayout;
  if (typeof _origSave === "function") {
    window.saveLayout = function () {
      _origSave.call(this);
      _isDirty = false;
      pruneOldSnapshots();
    };
  }

  // ── 4. IndexedDB HELPER (much larger & survives "Clear Browsing Data") ──
  const IDB_NAME  = (typeof FLOOR_ID !== "undefined" ? FLOOR_ID : "floor2") + "_backups";
  const IDB_STORE = "layouts";
  let   _idb      = null;

  function openIDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = (e) => e.target.result.createObjectStore(IDB_STORE);
      req.onsuccess  = (e) => resolve(e.target.result);
      req.onerror    = (e) => reject(e.target.error);
    });
  }
  async function idbSet(key, value) {
    try {
      if (!_idb) _idb = await openIDB();
      await new Promise((res, rej) => {
        const tx  = _idb.transaction(IDB_STORE, "readwrite");
        const req = tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch (e) { console.warn("IDB write failed:", e); }
  }
  async function idbGet(key) {
    try {
      if (!_idb) _idb = await openIDB();
      return await new Promise((res, rej) => {
        const tx  = _idb.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => res(req.result);
        req.onerror   = () => rej(req.error);
      });
    } catch (e) { console.warn("IDB read failed:", e); return null; }
  }

  // ── 5. BUILD LAYOUT PAYLOAD (mirrors saveLayout logic, used by auto-save) ──
  function buildPayload() {
    try {
      if (typeof editableWalls === "undefined" || typeof editableObjects === "undefined") return null;
      const walls = editableWalls
        .filter(w => w.mesh && w.mesh.userData && w.mesh.userData.floorEdit)
        .map(w => {
          const wp = new THREE.Vector3();
          const wq = new THREE.Quaternion();
          w.mesh.getWorldPosition(wp);
          w.mesh.getWorldQuaternion(wq);
          const euler = new THREE.Euler().setFromQuaternion(wq, "YXZ");
          return {
            id: String(w.mesh.userData.editId),
            angle: w.angle, currentLen: w.currentLen,
            position: { x: wp.x, y: wp.y, z: wp.z },
            rotationY: euler.y, anchorIsA: w.anchorIsA
          };
        });
      const objects = editableObjects
        .filter(o => o && o.userData && o.userData.editId)
        .map(o => ({
          id: o.userData.editId,
          position:   { x: o.position.x,   y: o.position.y,   z: o.position.z   },
          quaternion: { x: o.quaternion.x,  y: o.quaternion.y, z: o.quaternion.z, w: o.quaternion.w },
          scale:      { x: o.scale.x,       y: o.scale.y,      z: o.scale.z      }
        }));
      return { version: 1, savedAt: Date.now(), walls, objects };
    } catch (e) { console.warn("buildPayload failed:", e); return null; }
  }

  // ── 6. AUTO-SAVE TO IndexedDB EVERY 2 MINUTES ──
  const IDB_AUTOSAVE_KEY = "autosave_latest";
  setInterval(async () => {
    const payload = buildPayload();
    if (!payload) return;
    const json = JSON.stringify(payload);
    await idbSet(IDB_AUTOSAVE_KEY, json);
    // Keep a rolling 10-slot ring of timestamped IDB snapshots
    const now = new Date();
    const slot = `autosave_slot_${now.getMinutes() % 10}`; // overwrites oldest every 20 min
    await idbSet(slot, json);
    console.log("💾 Auto-saved to IndexedDB (" + Math.round(json.length / 1024) + " KB)");
    if (typeof showAutoStatus === "function") showAutoStatus("💾 Auto-saved", true);
  }, 2 * 60 * 1000);

  // ── 7. TIMESTAMPED BACKUP DOWNLOAD BUTTON ──
  function addBackupButton() {
    const hud = document.getElementById("editHud");
    if (!hud || document.getElementById("backupBtn")) return;
    const btn = document.createElement("button");
    btn.id        = "backupBtn";
    btn.type      = "button";
    btn.textContent = "📦 Backup";
    btn.title     = "Download a timestamped backup file you can keep anywhere";
    btn.style.cssText = [
      "padding:8px 12px", "border-radius:10px",
      "border:1px solid rgba(255,255,255,0.25)",
      "background:rgba(0,0,0,0.72)", "color:#eee",
      "cursor:pointer", "user-select:none"
    ].join(";");
    btn.addEventListener("click", () => {
      const payload = buildPayload();
      if (!payload) { alert("World is still loading — try again in a moment."); return; }
      const json = JSON.stringify(payload, null, 2);
      const now  = new Date();
      const ts   = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-") + "_" + [
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0")
      ].join("");
      const filename = `${typeof FLOOR_ID !== "undefined" ? FLOOR_ID : "floor2"}_backup_${ts}.json`;
      const blob = new Blob([json], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
      _isDirty = false; // backing up counts as saved
      if (typeof showAutoStatus === "function") showAutoStatus("📦 Backup: " + filename, true);
    });
    hud.appendChild(btn);
  }
  // Run after DOM settles
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", addBackupButton);
  } else {
    setTimeout(addBackupButton, 500);
  }

  // ── 8. IDB RECOVERY BANNER (shown only when localStorage snapshots are gone) ──
  async function checkIDBRecovery() {
    await new Promise(r => setTimeout(r, 3000)); // let the world fully load first
    const indexKey = (typeof FLOOR_ID !== "undefined" ? FLOOR_ID : "floor2") + "_snapshot_index";
    const lsSnaps  = JSON.parse(localStorage.getItem(indexKey) || "[]");
    if (lsSnaps.length > 0) return; // localStorage is fine — nothing to do

    const idbJson = await idbGet(IDB_AUTOSAVE_KEY);
    if (!idbJson) return; // no IDB data either

    let parsedDate = "unknown";
    try { parsedDate = new Date(JSON.parse(idbJson).savedAt).toLocaleString(); } catch (_) {}

    const banner = document.createElement("div");
    banner.style.cssText = [
      "position:fixed", "bottom:70px", "left:50%", "transform:translateX(-50%)",
      "padding:14px 28px", "border-radius:12px",
      "border:2px solid #ffaa00", "background:rgba(50,25,0,0.95)",
      "color:#ffdd88", "font:15px/1.4 system-ui,Arial",
      "z-index:99999", "text-align:center", "max-width:480px"
    ].join(";");
    banner.innerHTML =
      `⚠️ <b>localStorage is empty</b> but an IndexedDB backup was found<br>` +
      `<span style="font-size:12px;opacity:0.8">Saved: ${parsedDate}</span><br><br>` +
      `<button id="idbRecoverBtn" type="button" style="` +
        `padding:8px 20px;border-radius:8px;border:none;` +
        `background:#ffaa00;color:#000;font-weight:bold;cursor:pointer;margin-right:10px` +
      `">✅ Restore from backup</button>` +
      `<button id="idbDismissBtn" type="button" style="` +
        `padding:8px 14px;border-radius:8px;border:1px solid #666;` +
        `background:transparent;color:#aaa;cursor:pointer` +
      `">Dismiss</button>`;
    document.body.appendChild(banner);

    document.getElementById("idbRecoverBtn").addEventListener("click", async () => {
      try {
        const data = JSON.parse(idbJson);
        if (typeof applyLayoutData === "function") {
          applyLayoutData(data);
          if (typeof showAutoStatus === "function") showAutoStatus("✅ Recovered from IndexedDB backup!", true);
        }
      } catch (e) { alert("Recovery failed: " + e.message); }
      banner.remove();
    });
    document.getElementById("idbDismissBtn").addEventListener("click", () => banner.remove());
  }
  checkIDBRecovery();

  console.log("🔒 Data security enhancements active (dirty tracking, IDB auto-save, snapshot pruning)");
})();

    const blob = new Blob([json], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = "captured-zones.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    console.log("%c📦 Downloaded " + _captures.length + " zones — upload to Claude!", "color:lime;font-weight:bold");
  };
  console.log("%c📍 Zone capture ready — type captureZone(\"corridor1\") to capture, downloadZones() to download", "color:lime;font-size:13px");
})();
</script>
</body>
