  <text x="256" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#b8860b" letter-spacing="2">CROWSNEST</text>
  <text x="256" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#7a5a2a" letter-spacing="4">CASTLE</text>
