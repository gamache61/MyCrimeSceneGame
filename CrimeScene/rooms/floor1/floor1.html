let __SEED__ = 13371337;
function rand() {
  __SEED__ |= 0;
  __SEED__ = (__SEED__ + 0x6D2B79F5) | 0;
  let t = Math.imul(__SEED__ ^ (__SEED__ >>> 15), 1 | __SEED__);
  t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

function makeSVGTexture(svgString){
  try {
    const b64=btoa(unescape(encodeURIComponent(svgString)));
    const url='data:image/svg+xml;base64,'+b64;
    const mat=new THREE.MeshLambertMaterial({transparent:false,color:0xffffff,side:THREE.DoubleSide});
    new THREE.TextureLoader().load(url,function(tex){
      tex.encoding=THREE.sRGBEncoding; mat.map=tex; mat.needsUpdate=true;
    });
    return mat;
  } catch(e) {
    return new THREE.MeshLambertMaterial({color:0x4a3a2a,side:THREE.DoubleSide});
  }
}

// ====================== PICTURE FRAME FACTORY ======================
function makeFramedPicture(frameW = 260, frameH = 360, svgStr) {
 const g = new THREE.Group();
 g.userData = g.userData || {};
 g.userData.isPictureFrame = true;
 g.userData.frameW = frameW;
 g.userData.frameH = frameH;

 const frameMat = new THREE.MeshLambertMaterial({
  color: 0x0f0803,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
 });
 const outer = new THREE.Mesh(new THREE.BoxGeometry(frameW+28, frameH+28, 10), frameMat);
 g.add(outer);

 const lip = new THREE.Mesh(new THREE.BoxGeometry(frameW+10, frameH+10, 12),
  new THREE.MeshLambertMaterial({color:0x0f0803}));
 lip.position.z = 2;
 g.add(lip);

 const canvasMat = makeSVGTexture(svgStr);
 const art = new THREE.Mesh(new THREE.PlaneGeometry(frameW, frameH), canvasMat);
 art.position.z = 12;
 art.userData.isPictureArt = true;
 g.add(art);

 return g;
}
// ====================== PLACE 8 FRAMED PICTURES PER SEGMENT (NEW) ======================

function addFramedPicturesToCorridorSegment(parent, center, angle, len) {
 const perSide = (len > 1200) ? 3 : 1;
 const spacing = len / (perSide + 1);

 const dirX = Math.sin(angle);
 const dirZ = Math.cos(angle);
 const cos = Math.cos(angle);
 const sin = Math.sin(angle);

 const insetFromWall = 6;
 const wallOffset = (CORRIDOR_W / 1.9) - insetFromWall;

 let imgIndex = Math.floor(Math.random() * CORRIDOR_SVG_IMAGES.length);

 for (let i = 1; i <= perSide; i++) {
  const along = i * spacing - len / 2;
  const x = center.x + dirX * along;
  const z = center.z + dirZ * along;

  // LEFT wall
  {
   const img = CORRIDOR_SVG_IMAGES[imgIndex++ % CORRIDOR_SVG_IMAGES.length];
   const frame = makeFramedPicture(195, 270, img);

   // ✅ stable ID + editable
   setEditId(frame, `pic_${Math.round(center.x)}_${Math.round(center.z)}_${Math.round(angle * 1000)}_L_${i}`);
   editableObjects.push(frame);

   frame.position.set(
    x - cos * wallOffset,
    WALL_H * 0.50,
    z + sin * wallOffset
   );
   frame.rotation.y = angle + Math.PI / 2;
   parent.add(frame);
  }

  // RIGHT wall
  {
   const img = CORRIDOR_SVG_IMAGES[imgIndex++ % CORRIDOR_SVG_IMAGES.length];
   const frame = makeFramedPicture(195, 270, img);

   // ✅ stable ID + editable
   setEditId(frame, `pic_${Math.round(center.x)}_${Math.round(center.z)}_${Math.round(angle * 1000)}_R_${i}`);
   editableObjects.push(frame);

   frame.position.set(
    x + cos * wallOffset,
    WALL_H * 0.50,
    z - sin * wallOffset
   );
   frame.rotation.y = angle - Math.PI / 2;
   parent.add(frame);
  }
 }
}
// Furniture code cleaned up - minimal version


function addAntiqueFurnitureToCorridorSegment(parent, center, angle, len) {
  const perSide = Math.max(1, Math.floor(len / 900));
  const spacing = len / (perSide + 1);

  const dirX = Math.sin(angle);
  const dirZ = Math.cos(angle);
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);

  const wallOffset = CORRIDOR_W / 2 - 45;

  // Fully deterministic placement - no random movement on reload
  for (let i = 1; i <= perSide; i++) {
    const along = i * spacing - len / 2;
    const x = center.x + dirX * along;
    const z = center.z + dirZ * along;

    const side = (i % 2 === 0) ? 1 : -1;
    const fx = x - cos * wallOffset * side + (i * 12);   // tiny fixed offset
    const fz = z + sin * wallOffset * side;

   const furniture = createAntiqueFurniturePiece();

    // ✅ Stable ID so this furniture gets included in save/load
    setEditId(
      furniture,
      `furn_${Math.round(center.x)}_${Math.round(center.z)}_${Math.round(angle * 1000)}_${i}_${side}`
    );

    furniture.position.set(fx, 0, fz);
    furniture.rotation.y = angle + (side > 0 ? 0 : Math.PI);
    parent.add(furniture);

    editableObjects.push(furniture);

  }
}

// Active layout name pointer (defaults to "main")
const ACTIVE_LAYOUT_KEY = FLOOR_ID + "_layout_active";
function getActiveLayoutName() {
  return localStorage.getItem(ACTIVE_LAYOUT_KEY) || "main";
}
function setActiveLayoutName(name) {
  localStorage.setItem(ACTIVE_LAYOUT_KEY, String(name || "main"));
}

// ✅ FIX: always call as a function so the active slot is resolved at the
// moment it is needed — NOT frozen to a const once at page load.
function getLayoutStorageKey() {
  return FLOOR_ID + "_layout_" + getActiveLayoutName();
}

const TOWER_GAP_ANGLE = Math.PI * 2 * 0.10;

const INTERACT_RADIUS = 100;

// ✅ Shared payload builder — used by saveLayout() (browser autosave) and
// bakeLayoutIntoFile() (permanent write into this HTML file).
function buildLayoutPayload() {
  // normalize walls
  for (const w of editableWalls) {
    if (w && w.pivot) detachWallFromPivotIfNeeded(w);
  }

  const walls = editableWalls
    .filter(w => w.mesh && w.mesh.userData && w.mesh.userData.floorEdit)
    .map(w => {
      const wp = new THREE.Vector3();
      const wq = new THREE.Quaternion();
      w.mesh.getWorldPosition(wp);
      w.mesh.getWorldQuaternion(wq);
      const e = new THREE.Euler().setFromQuaternion(wq, "YXZ");
      return {
        id: String(w.mesh.userData.editId),
        angle: w.angle,
        currentLen: w.currentLen,
        position: { x: wp.x, y: wp.y, z: wp.z },
        rotationY: e.y,
        anchorIsA: w.anchorIsA,
        isTunnel:   !!(w.mesh.userData && w.mesh.userData.isTunnelWall),
        geomHeight: w.mesh.userData.geomHeight || null,
        geomThick:  w.mesh.userData.geomThick  || null
      };
    });

  const objects = editableObjects
    .filter(o => o && o.userData && o.userData.editId)
    .map(o => {
      return {
        id: o.userData.editId,
        position: (()=>{ const wp=new THREE.Vector3(); o.getWorldPosition(wp); return {x:wp.x,y:wp.y,z:wp.z}; })(),
        quaternion: (()=>{ const wq=new THREE.Quaternion(); o.getWorldQuaternion(wq); return {x:wq.x,y:wq.y,z:wq.z,w:wq.w}; })(),
        scale: { x: o.scale.x, y: o.scale.y, z: o.scale.z },
        extra: (o.userData.isRailingRail && o.userData.currentLen != null)
          ? { currentLen: o.userData.currentLen }
          : null
      };
    });

  return { version: 1, savedAt: Date.now(), walls, objects, deletedWallIds: Array.from(window._deletedWallIds || []) };
}

function saveLayout() {
  const payload = buildLayoutPayload();
  const json = JSON.stringify(payload);

 // --- SAFETY SNAPSHOT (NEW KEY EVERY SAVE) ---
// Format: <FLOOR_ID>_snapshot_<YYYY-MM-DD>_<HH-MM-SS> (local time)
const now = new Date();

const date =
  now.getFullYear() + "-" +
  String(now.getMonth() + 1).padStart(2, "0") + "-" +
  String(now.getDate()).padStart(2, "0");

const time =
  String(now.getHours()).padStart(2, "0") + "-" +
  String(now.getMinutes()).padStart(2, "0") + "-" +
  String(now.getSeconds()).padStart(2, "0");

// ✅ Make snapshot keys truly unique (prevents overwriting when multiple saves happen in the same second)
const ms = String(now.getMilliseconds()).padStart(3, "0");
const seqKey = FLOOR_ID + "_snapshot_seq";
const seq = (parseInt(localStorage.getItem(seqKey) || "0", 10) + 1);
localStorage.setItem(seqKey, String(seq));

const snapKey = `${FLOOR_ID}_snapshot_${date}_${time}-${ms}_${seq}`;
localStorage.setItem(snapKey, json);
localStorage.setItem(getLayoutStorageKey(), json);
const indexKey = FLOOR_ID + "_snapshot_index";
const list = JSON.parse(localStorage.getItem(indexKey) || "[]");
list.unshift(snapKey);
localStorage.setItem(indexKey, JSON.stringify(list));

const sel = document.getElementById("snapshotSelect");
if (sel) {
  sel.innerHTML = "";
  list.forEach(k => {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = k;

const rotateTowerSetInPlace = (towerIndex, yawDelta) => {
  const center = getTowerCenterWorld(towerIndex);

    return;

  forEachTowerPiece(towerIndex, (o) => {

    const isRing = o.userData?.isRailingRail ||
                   String(o.userData?.editId || "").startsWith("tower_top_ring_");

    if (isRing) {
      o.rotation.z += yawDelta;
    } else {

      const pos = o.position.clone();
      const offset = pos.clone().sub(center);
      const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), yawDelta);
      offset.applyQuaternion(q);
      o.position.copy(center).add(offset);
      o.rotation.y += yawDelta;
    }
  });

  markEdited();

 function drawCompass() {
   if (!DEBUG_ON) return;
   const canvas = document.getElementById("compassCanvas");
   if (!canvas) return;
   const ctx = canvas.getContext("2d");
   const cx = 45, cy = 45, r = 38;
   ctx.clearRect(0, 0, 90, 90);

   // Background
   ctx.beginPath();
   ctx.arc(cx, cy, r, 0, Math.PI * 2);
   ctx.fillStyle = "rgba(0,0,0,0.75)";
   ctx.fill();
   ctx.strokeStyle = "rgba(255,255,255,0.3)";
   ctx.lineWidth = 1.5;
   ctx.stroke();

   // Cardinal labels (fixed)
   const labels = [["N", 0], ["E", 90], ["S", 180], ["W", 270]];
   ctx.font = "bold 11px system-ui";
   ctx.textAlign = "center";
   ctx.textBaseline = "middle";
   labels.forEach(([lbl, deg]) => {
     const rad = (deg - 90) * Math.PI / 180;
     const lx = cx + Math.cos(rad) * (r - 10);
     const ly = cy + Math.sin(rad) * (r - 10);
     ctx.fillStyle = lbl === "N" ? "#ff4444" : "#ffffff";
     ctx.fillText(lbl, lx, ly);
   });

   // Needle — points in the direction the player faces
   // yaw=0 → +Z, yaw=PI/2 → +X; we map to screen angle
   const needleAngle = -yaw; // counter-clockwise yaw → clockwise screen
   const nx = cx + Math.cos(needleAngle - Math.PI / 2) * (r - 18);
   const ny = cy + Math.sin(needleAngle - Math.PI / 2) * (r - 18);
   const tx = cx + Math.cos(needleAngle + Math.PI / 2) * (r - 18);
   const ty = cy + Math.sin(needleAngle + Math.PI / 2) * (r - 18);

   // Red tip (forward)
   ctx.beginPath();
   ctx.moveTo(nx, ny);
   ctx.lineTo(cx + Math.cos(needleAngle - Math.PI / 2 + Math.PI / 8) * 8, cy + Math.sin(needleAngle - Math.PI / 2 + Math.PI / 8) * 8);
   ctx.lineTo(cx, cy);
   ctx.lineTo(cx + Math.cos(needleAngle - Math.PI / 2 - Math.PI / 8) * 8, cy + Math.sin(needleAngle - Math.PI / 2 - Math.PI / 8) * 8);
   ctx.closePath();
   ctx.fillStyle = "#ff3333";
   ctx.fill();

   // White tail
   ctx.beginPath();
   ctx.moveTo(tx, ty);
   ctx.lineTo(cx + Math.cos(needleAngle + Math.PI / 2 + Math.PI / 8) * 8, cy + Math.sin(needleAngle + Math.PI / 2 + Math.PI / 8) * 8);
   ctx.lineTo(cx, cy);
   ctx.lineTo(cx + Math.cos(needleAngle + Math.PI / 2 - Math.PI / 8) * 8, cy + Math.sin(needleAngle + Math.PI / 2 - Math.PI / 8) * 8);
   ctx.closePath();
   ctx.fillStyle = "#cccccc";
   ctx.fill();
 }

const snapToRailingGroup = (o) => {
 let cur = o;
 while (cur && cur.parent) {
  if (cur.userData && cur.userData.isRailingGroup) return cur;
  cur = cur.parent;
 }
 return null;
};

let railingGroupHit = snapToRailingGroup(obj);
if (!railingGroupHit && root) railingGroupHit = snapToRailingGroup(root);

if (railingGroupHit) {
 selectedObject = railingGroupHit;
} else if (editableObjects.includes(root)) {
 selectedObject = root;
} else {
 selectedObject = obj;
}

// If selectedObject is a roof top-rail, pick which end is anchored based on click (each end edits independently)
  if (selectedObject && selectedObject.userData && selectedObject.userData.isRailingRail && hits[0] && hits[0].point) {
    const hitWorld = hits[0].point.clone();
    const hitLocal = selectedObject.worldToLocal(hitWorld);

    const baseLen = selectedObject.userData.baseLen || 1;
    let curLen = selectedObject.userData.currentLen;
    if (!isFinite(curLen)) curLen = baseLen * (selectedObject.scale ? selectedObject.scale.z : 1);

    // local z: 0 = pivot end, curLen = far end
    selectedObject.userData.anchorFarEnd = (hitLocal.z > (curLen * 0.5));
  }

  console.log("✅ Object selected");
// --- SPECIAL FIX: courtyard roof must behave like a one-end rail ---
  // If the roof was created before the one-end-geometry translation existed,
  // its local origin is centered and the rail-resize math won’t move the end correctly.
  if (selectedObject && selectedObject.userData && String(selectedObject.userData.editId) === "courtyard_roof") {

    // Force rail behavior flags (so the ArrowLeft/Right rail-resize block runs)
    selectedObject.userData.isRailingRail = true;
    selectedObject.userData.pivotIsOneEnd = true;

    // Set baseLen/currentLen from geometry if missing
    const bb = new THREE.Box3().setFromObject(selectedObject);
    const size = new THREE.Vector3();
    bb.getSize(size);

    // Courtyard roof length axis is LOCAL +Z (we scale .z in the rail code)
    if (!isFinite(selectedObject.userData.baseLen) || selectedObject.userData.baseLen <= 0) {
      selectedObject.userData.baseLen = Math.max(1, size.z);
      selectedObject.userData.currentLen = selectedObject.userData.baseLen;
    }

    // Apply one-end pivot geometry ONCE (translate geometry so local z=0 is the pivot end)
    if (!selectedObject.userData._oneEndPivotApplied) {
      const baseLen = selectedObject.userData.baseLen;

      if (selectedObject.geometry && typeof selectedObject.geometry.translate === "function") {
        selectedObject.geometry.translate(0, 0, baseLen * 0.5);

        // Because we moved geometry forward, pull the mesh back so it stays visually in place
        // (assuming it’s unrotated or primarily scaled along Z like other rails)
        const back = new THREE.Vector3(0, 0, baseLen * 0.5).applyQuaternion(selectedObject.quaternion);
        selectedObject.position.sub(back);

        selectedObject.userData._oneEndPivotApplied = true;
      }
    }
  }

  console.log("✅ Object selected");
}

     camera.position.x < box.max.x + 10 &&
     camera.position.z > box.min.z - 10 &&
     camera.position.z < box.max.z + 10;

    if (camera.position.y < box.min.y - ENGAGE_MARGIN || !CLOSE_TO_STAIRS) continue;

  let cosY = Math.cos(obj.rotation.y);
 let sinY = Math.sin(obj.rotation.y);

  cosY = 0;
  sinY = -1;

 let ax = cosY, az = sinY;
 const px = -sinY, pz = cosY; 

    const dx2 = camera.position.x - center.x;
    const dz2 = camera.position.z - center.z;

    const run = dx2 * ax + dz2 * az;
    const perp = dx2 * px + dz2 * pz;

    const halfPerp = size.z * 0.5;

    const perpClamped = THREE.MathUtils.clamp(perp, -halfPerp, halfPerp);

    const targetX = center.x + ax * run + px * perpClamped;
    const targetZ = center.z + az * run + pz * perpClamped;

    camera.position.x = THREE.MathUtils.lerp(camera.position.x, targetX, 0.55);
    camera.position.z = THREE.MathUtils.lerp(camera.position.z, targetZ, 0.55);

    const RUN_LEN = Math.max(size.z, 1);

    const progress = 1 - THREE.MathUtils.clamp(
     (run + RUN_LEN * 0.5) / RUN_LEN,
     0,
     1
    );

    const EYE = 88;

    let baseY = box.min.y + EYE;
    let topY  = box.max.y + EYE;

    if (obj.userData.__stairsYOffset == null) {
     obj.userData.__stairsYOffset = Math.max(0, camera.position.y - baseY);
    }

    const yOff = obj.userData.__stairsYOffset;
    baseY += yOff;
    topY  += yOff;

    let targetY = THREE.MathUtils.lerp(baseY, topY, progress);

    const currentY = camera.position.y;

    const maxDrop = 65;
    const entryLift = 35;

    if (currentY < baseY - maxDrop) {
     targetY = Math.max(targetY, currentY + entryLift);

    }

    camera.position.y = THREE.MathUtils.lerp(
     camera.position.y,
     Math.max(targetY, baseY),
     0.75
    );

// ===== BAKE INTO FILE (writes current positions permanently into this HTML file) =====
let __bakeFileHandle = null;

async function bakeLayoutIntoFile() {
  if (!window.showOpenFilePicker) {
    showAutoStatus("❌ Bake needs Chrome/Edge on Windows", false);
    alert("This button needs Chrome or Edge on Windows (or Mac). It uses a feature those browsers have for saving straight back to a local file.");
    return;
  }

  try {
    if (!__bakeFileHandle) {
      showAutoStatus("📂 Pick your floor1.html file…", true);
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: "HTML file", accept: { "text/html": [".html"] } }],
        excludeAcceptAllOption: false
      });
      __bakeFileHandle = handle;
    }

    const file = await __bakeFileHandle.getFile();
    let text = await file.text();

    const payload = buildLayoutPayload();
    const json = JSON.stringify(payload);
    const newDecl = `const BAKED_LAYOUT = ${json}; /*BAKED_LAYOUT_END*/`;

    if (/const BAKED_LAYOUT\s*=[\s\S]*?\/\*BAKED_LAYOUT_END\*\//.test(text)) {
      text = text.replace(/const BAKED_LAYOUT\s*=[\s\S]*?\/\*BAKED_LAYOUT_END\*\//, newDecl);
    } else {
      // Fallback: file doesn't have the marker yet — insert right after FLOOR_ID
      text = text.replace(
        /const FLOOR_ID = "floor1";/,
        `const FLOOR_ID = "floor1";\n${newDecl}`
      );
    }

    const writable = await __bakeFileHandle.createWritable();
    await writable.write(text);
    await writable.close();

    showAutoStatus("🔒 Baked! Positions saved permanently into the file.", true);
  } catch (e) {
    console.error("Bake failed:", e);
    if (e && e.name === "AbortError") {
      showAutoStatus("Bake cancelled", false);
    } else {
      showAutoStatus("❌ Bake failed: " + (e && e.message ? e.message : e), false);
    }
  }
}
 function getMeshWorldAxisZ(mesh) {
   return new THREE.Vector3(0,0,1).applyQuaternion(mesh.getWorldQuaternion(new THREE.Quaternion())).normalize();
 }

 function getWallEndpointsWorld(wallRec) {
   const axis = getMeshWorldAxisZ(wallRec.mesh);
   const half = wallRec.currentLen * 0.5;
   const c = wallRec.mesh.getWorldPosition(new THREE.Vector3());
   const endA = c.clone().add(axis.clone().multiplyScalar(-half));
   const endB = c.clone().add(axis.clone().multiplyScalar(+half));
   return { endA, endB, axis };
 }

 function ensurePivotAnchoredAtNearestEnd(wallRec, clickPoint) {
   if (wallRec.pivot) return;
   const { endA, endB } = getWallEndpointsWorld(wallRec);
   const distA = clickPoint.distanceTo(endA);
   const distB = clickPoint.distanceTo(endB);
   const freeIsA = distA < distB;
   const anchorWorld = freeIsA ? endB : endA;
   const pivot = new THREE.Object3D();
   pivot.position.copy(anchorWorld);
   pivot.position.y = (wallRec.wallBaseY != null) ? wallRec.wallBaseY : WALL_H / 2;
   const wallYaw = wallRec.mesh.rotation.y;
   pivot.rotation.set(0, wallYaw + (freeIsA ? Math.PI : 0), 0);
   scene.add(pivot);
   pivot.add(wallRec.mesh);
   wallRec.mesh.rotation.set(0,0,0);
   wallRec.mesh.scale.set(1,1,1);
   wallRec.mesh.position.set(0,0,0);
   wallRec.pivot = pivot;
   wallRec.anchorIsA = !freeIsA;
   wallRec.editDir = new THREE.Vector3(0,0,1).applyQuaternion(pivot.quaternion).normalize();
   wallRec.editNormal = new THREE.Vector3(1,0,0).applyQuaternion(pivot.quaternion).normalize();
   setWallLengthOneEnd(wallRec, wallRec.currentLen);
 }

   if (!wallRec || !wallRec.mesh) return;
   newLen = Math.max(60, newLen);

   wallRec.mesh.scale.set(1, 1, scaleZ);

  if (!(other.mesh.userData && other.mesh.userData.isTunnelWall)) continue;

  const oe = getWallEndpointsWorld(other);
  const oEnds = [oe.endA, oe.endB];

  for (let a = 0; a < 2; a++) {
   for (let b = 0; b < 2; b++) {
    const d = myEnds[a].distanceTo(oEnds[b]);
    if (d > SNAP_DIST) continue;
    if (d < bestDist) {
     bestDist = d;
     bestDelta = oEnds[b].clone().sub(myEnds[a]);
    }
   }
  }
 }

 if (bestDelta) {
  wallRec.pivot.position.x += bestDelta.x;
  wallRec.pivot.position.z += bestDelta.z;
  wallRec.pivot.position.y = (wallRec.wallBaseY != null) ? wallRec.wallBaseY : WALL_H / 2;

function updateTower1Door(dt) {
  const dm = doorMarkers.find(m => m.userData && m.userData.kind === "tower_door" && m.userData.doorPivot);

  tower1Door_t = clamp01(approach(tower1Door_t, tower1Door_target, DOOR_SPEED * dt));

function updateNearInteractable() {

    for (const m of doorMarkers) {

        const p = m.getWorldPosition(new THREE.Vector3());
        const d = p.distanceTo(camPos);
        if (d < INTERACT_RADIUS && d < bestD) {
          bestD = d;
          nearDoor = m;
        }
      }
    }
  } else {
    // Normal door scan
    for (const m of doorMarkers) {
      const p = m.getWorldPosition(new THREE.Vector3());
      let d;
      if (m.userData && m.userData.kind === "room_door") {
        // For room doors, use 2D distance (ignore Y), and use a wider radius
        d = Math.hypot(p.x - camPos.x, p.z - camPos.z);
      } else {
        d = p.distanceTo(camPos);
      }
      const radius = (m.userData && m.userData.kind === "room_door") ? (m.userData.hintRadius || 350) : INTERACT_RADIUS;
      if (d < radius && d < bestD) {
        bestD = d;
        nearDoor = m;

    }
  }

  const hint = document.getElementById("doorHint");

 function wallMaterialForLength(len) {
   const t = baseWallTexture.clone();
   t.wrapS = t.wrapT = THREE.RepeatWrapping;
   t.repeat.set(Math.max(1, len/300), 2.2);
   t.encoding = THREE.sRGBEncoding;
   t.needsUpdate = true;
   return new THREE.MeshLambertMaterial({ map: t, color: 0xffffff, emissive: 0x000000 });
 }

 function floorMaterialForLength(len) {
   const t = baseWallTexture.clone();
   t.wrapS = t.wrapT = THREE.RepeatWrapping;
   const repLen = Math.max(1, len/300);
   t.repeat.set(2.2, repLen);
   t.encoding = THREE.sRGBEncoding;
   t.needsUpdate = true;
   return new THREE.MeshStandardMaterial({
     map: t,
     color:  0xe8e8e8,
     roughness: 1.0,
     metalness: 0.0
   });
 }

 function makeOldMedievalBrickTexture() {
   const canvas = document.createElement("canvas");
   canvas.width = 512;
   canvas.height = 512;
   const ctx = canvas.getContext("2d");
   ctx.fillStyle = "#4a443b";
   ctx.fillRect(0,0,512,512);
   const irand = (min,max)=>Math.floor(min+Math.random()*(max-min));
   const brickH = 40, brickW = 92, mortar = 6;
   for (let y=0; y<512; y += brickH + mortar){
     const row = Math.floor(y/(brickH+mortar));
     const offset = (row % 2) ? brickW/2 : 0;
     for (let x=-offset; x<512; x += brickW + mortar){
       const g = irand(55, 85) + irand(-6, 6);
       ctx.fillStyle = "rgb(" + g + "," + g + "," + g + ")";
       ctx.fillRect(x+mortar, y+mortar, brickW, brickH);
       ctx.strokeStyle = "rgba(0,0,0,0.22)";
       ctx.lineWidth = 2;
       ctx.strokeRect(x+mortar+1, y+mortar+1, brickW-2, brickH-2);
     }
   }
   const tex = new THREE.CanvasTexture(canvas);
   tex.needsUpdate = true;
   return tex;
 }

    ctx.fillStyle = '#000000';
    ctx.font = 'italic 64px "IM Fell English", serif';

    ctx.textBaseline = 'middle';
    ctx.fillText(text, 256, 64);

        if (w && w.mesh && String(w.mesh.userData.editId) === id) {
          if (w.mesh.removeFromParent) w.mesh.removeFromParent();

if (data.walls && Array.isArray(data.walls)) {
 for (const saved of data.walls) {
  // Original tunnel walls (tnl_*) always rebuild from code at the correct width.
  // Only skip them if they are NOT copies — copies (_dup_) must restore from saves.
  if (String(saved.id || "").startsWith("tnl_") &&
      !String(saved.id || "").includes("dup") &&
      !String(saved.id || "").includes("basement_wall")) continue;

  let rec = editableWalls.find(
   w => w.mesh && w.mesh.userData && String(w.mesh.userData.editId) === String(saved.id)
  );

  // ✅ If a saved wall does NOT exist in this run (copied basement walls), recreate it now
  if (!rec || !rec.mesh) {
   const isTunnelGuess =
    (saved.position && saved.position.y != null && isFinite(saved.position.y) && Math.abs(saved.position.y - (WALL_H / 2)) > 0.01) ||
    String(saved.id || "").startsWith("basement_wall");

   const L = Math.max(60, (saved.currentLen != null && isFinite(saved.currentLen)) ? saved.currentLen : 60);
   // Use saved geometry values if present; otherwise detect from position
   const isTunnelWall = saved.isTunnel || isTunnelGuess;
   const h     = (saved.geomHeight && isFinite(saved.geomHeight)) ? saved.geomHeight
               : isTunnelWall ? 780 : WALL_H;
   const thick = (saved.geomThick  && isFinite(saved.geomThick))  ? saved.geomThick
               : isTunnelWall ? 32  : WALL_THICK;
   const mat   = isTunnelWall
               ? (window._tunnelWallMaterial || new THREE.MeshLambertMaterial({ color: 0x776655 }))
               : wallMaterialForLength(L);

          const dz = camera.position.z - orb.z;
          const d = Math.sqrt(dx * dx + dz * dz);
          if (d < ROOF_PICK_RADIUS && d < bestDist) { bestDist = d; best = i; }
        });
        window.__roofNearIdx = best;
        if (hint) hint.style.display = best >= 0 ? "block" : "none";
      };
    }
  })();
</script>
<script>
// ── Zone coordinate capture ──────────────────────────────────────────────────
// Walk to a spot, open console (F12), type: captureZone("zoneid")
// When done all spots, type: downloadZones()
(function(){
  const _captures = [];
  window.captureZone = function(zoneId) {
    if (!window.camera) { console.error("Camera not ready"); return; }
    const entry = {
      zoneId: zoneId,
      x: Math.round(window.camera.position.x),
      y: Math.round(window.camera.position.y),
      z: Math.round(window.camera.position.z)
    };
    _captures.push(entry);
    console.log("%c✅ Captured: " + zoneId + " at x:" + entry.x + " z:" + entry.z + " (total: " + _captures.length + ")", "color:lime;font-weight:bold");
  };
  window.downloadZones = function() {
    if (_captures.length === 0) { console.error("No zones captured yet"); return; }
    const json = JSON.stringify({ zones: _captures }, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = "captured-zones.json";
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    console.log("%c📦 Downloaded " + _captures.length + " zones — upload to Claude!", "color:lime;font-weight:bold");
  };
  console.log("%c📍 Zone capture ready — type captureZone(\"corridor1\") to capture, downloadZones() to download", "color:lime;font-size:13px");
})();
</script>
