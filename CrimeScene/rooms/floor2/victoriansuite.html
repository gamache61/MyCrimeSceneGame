<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Victorian Suite</title>
<style>
#exitFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.6s ease;}
#exitFade.show{opacity:1;}
#instructionLine{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:14px;color:#eee;background:rgba(0,0,0,0.6);border-radius:6px;z-index:30;pointer-events:none;white-space:nowrap;}
body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;}
canvas{display:block;}
#fadeOverlay{position:fixed;inset:0;background:#000;z-index:9999;animation:fadeOut 0.8s ease forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
#editHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;font-family:system-ui,Arial,sans-serif;}
#editBtn,#saveBtn,#loadBtn,#clearBtn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.72);color:#eee;cursor:pointer;user-select:none;}
#editIndicator{padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,0.20);background:rgba(80,20,20,0.8);color:#ffd0d0;}
#editIndicator.on{background:rgba(20,80,20,0.85);color:#d5ffd5;}
#autoStatus{position:fixed;top:108px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);background:rgba(0,0,0,0.65);color:#d7f7d7;font:12px/1.35 system-ui,Arial;display:none;z-index:70;pointer-events:none;white-space:nowrap;}
#selInfo{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,0.8);color:#aaddff;border-radius:8px;font-size:13px;display:none;z-index:60;pointer-events:none;}
</style>
</head>
<body>
<div id="exitFade"></div>
<div id="instructionLine">W/↑ Forward &nbsp; S/↓ Back &nbsp; ←/→ Turn &nbsp; E = Exit &nbsp; M = Edit Mode</div>
<div id="doorHint" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#e8c87a;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,160,60,0.4);">Press E — Return to Floor 2</div>
<div id="fadeOverlay"></div>
<div id="editHud">
  <button id="editBtn" type="button">Edit Mode</button>
  <button id="saveBtn" type="button">Save Layout</button>
  <button id="loadBtn" type="button">Load Layout</button>
  <button id="clearBtn" type="button">Clear Save</button>
  <div id="editIndicator">OFF</div>
</div>
<div id="autoStatus"></div>
<div id="selInfo"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const FLOOR_ID = "victorian_suite";
const STORAGE_KEY = FLOOR_ID + "_layout";

let scene, camera, renderer;
let moveForward=false, moveBackward=false, turnLeft=false, turnRight=false;
let yaw=Math.PI, prevTime=performance.now();
const S=0.5;
const RW=1100*S, RD=900*S, RH=480*S;

// ── Edit system ──
let EDIT_MODE=false;
let selectedObject=null;
const editableObjects=[];
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let _isDirty=false;
function markEdited(){_isDirty=true;}
function setEditId(obj,id){if(!obj.userData)obj.userData={};if(!obj.userData.editId)obj.userData.editId=String(id);}
let _editCounter=0;
function addGroup(group,idHint){setEditId(group,idHint||("grp_"+(++_editCounter)));editableObjects.push(group);scene.add(group);return group;}

function showAutoStatus(msg,ok=true){
  const el=document.getElementById("autoStatus");
  if(!el)return;
  el.style.display="block";el.style.color=ok?"#d7f7d7":"#ffd7d7";el.textContent=msg;
  setTimeout(()=>{el.style.display="none";},2200);
}
function updateEditUI(){
  const ind=document.getElementById("editIndicator");
  ind.textContent=EDIT_MODE?"ON":"OFF";ind.classList.toggle("on",EDIT_MODE);
  const btn=document.getElementById("editBtn");
  btn.textContent=EDIT_MODE?"✏️ Edit Mode: ON":"Edit Mode: OFF";
  btn.style.background=EDIT_MODE?"rgba(20,80,20,0.85)":"rgba(0,0,0,0.72)";
  btn.style.color=EDIT_MODE?"#d5ffd5":"#eee";
}
function toggleEditMode(){EDIT_MODE=!EDIT_MODE;if(!EDIT_MODE){selectedObject=null;document.getElementById("selInfo").style.display="none";}updateEditUI();}
function saveLayout(){
  const objects=editableObjects.map(o=>{
    const wp=new THREE.Vector3();o.getWorldPosition(wp);
    const wq=new THREE.Quaternion();o.getWorldQuaternion(wq);
    return {id:o.userData.editId,position:{x:wp.x,y:wp.y,z:wp.z},quaternion:{x:wq.x,y:wq.y,z:wq.z,w:wq.w},scale:{x:o.scale.x,y:o.scale.y,z:o.scale.z}};
  });
  localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,savedAt:Date.now(),objects}));
  _isDirty=false;showAutoStatus("✅ Layout saved",true);
}
function loadLayout(){
  const json=localStorage.getItem(STORAGE_KEY);
  if(!json){showAutoStatus("No saved layout found",false);return;}
  try{
    const d=JSON.parse(json);
    for(const e of d.objects){
      const o=editableObjects.find(x=>x.userData.editId===e.id);
      if(!o)continue;
      o.position.set(e.position.x,e.position.y,e.position.z);
      o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);
      o.scale.set(e.scale.x,e.scale.y,e.scale.z);
    }
    showAutoStatus("✅ Layout loaded",true);
  }catch(e){showAutoStatus("Load failed: "+e.message,false);}
}
function clearAutoSave(){localStorage.removeItem(STORAGE_KEY);showAutoStatus("🗑 Save cleared",true);}

function onMouseClick(e){
  if(!EDIT_MODE)return;
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const meshes=[];
  editableObjects.forEach(o=>{if(o.isMesh)meshes.push(o);else o.traverse(ch=>{if(ch.isMesh)meshes.push(ch);});});
  const hits=raycaster.intersectObjects(meshes,false);
  if(!hits.length){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
  let obj=hits[0].object,cur=obj;
  while(cur){if(editableObjects.includes(cur)){obj=cur;break;}cur=cur.parent;}
  if(!editableObjects.includes(obj)){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
  selectedObject=obj;
  const eid=obj.userData&&obj.userData.editId?obj.userData.editId:"object";
  const si=document.getElementById("selInfo");
  si.style.display="block";
  si.textContent=`✏️ Selected: ${eid} | Arrows=Move  Shift+↑↓=Height  R=Rotate  Del=Delete`;
  showAutoStatus("Selected: "+eid,true);
}

function onKeyDown(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.code==="KeyM"){toggleEditMode();return;}
if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
    if(e.code==="KeyE"){
    if(nearExit&&!exitTriggered){
      exitTriggered=true;
      document.getElementById("doorHint").style.display="none";
      document.getElementById("exitFade").classList.add("show");
      setTimeout(()=>window.location.href="floor2.html?from=victorian_suite",600);
      return;
    }
  }
  if(EDIT_MODE&&selectedObject){
    if(e.code==="Delete"||e.code==="Backspace"){
      e.preventDefault();
      scene.remove(selectedObject);
      const idx=editableObjects.indexOf(selectedObject);
      if(idx>-1)editableObjects.splice(idx,1);
      showAutoStatus("🗑 Deleted: "+selectedObject.userData.editId,true);
      selectedObject=null;document.getElementById("selInfo").style.display="none";markEdited();return;
    }
    const speed=e.shiftKey?1:8;let moved=false;
    if(!e.shiftKey){
      if(e.code==="ArrowUp"){selectedObject.position.z-=speed;moved=true;}
      if(e.code==="ArrowDown"){selectedObject.position.z+=speed;moved=true;}
      if(e.code==="ArrowLeft"){selectedObject.position.x-=speed;moved=true;}
      if(e.code==="ArrowRight"){selectedObject.position.x+=speed;moved=true;}
    }
    if(e.shiftKey&&e.code==="ArrowUp"){selectedObject.position.y+=speed;moved=true;}
    if(e.shiftKey&&e.code==="ArrowDown"){selectedObject.position.y-=speed;moved=true;}
    if(e.code==="KeyR"){selectedObject.rotation.y+=e.shiftKey?0.05:0.1;moved=true;}
    if(moved){markEdited();return;}
  }
  if(!EDIT_MODE){
    if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=true;
    if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=true;
    if(e.code==="ArrowLeft")turnLeft=true;
    if(e.code==="ArrowRight")turnRight=true;
  }
}
function onKeyUp(e){
  if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=false;
  if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=false;
  if(e.code==="ArrowLeft")turnLeft=false;
  if(e.code==="ArrowRight")turnRight=false;
}

// ── Canvas painting system (no SVG/file:// issues) ──
function makeCanvasPainting(w,h,drawFn){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');
  drawFn(ctx,w,h);
  const tex=new THREE.CanvasTexture(c);
  tex.encoding=THREE.sRGBEncoding;
  return new THREE.MeshLambertMaterial({map:tex,side:THREE.DoubleSide});
}
function makePicture(pw,ph,drawFn,id){
  const g=new THREE.Group();
  const border=10*S;
  const frame=new THREE.Mesh(new THREE.BoxGeometry(pw+border*2,ph+border*2,10*S),
    new THREE.MeshLambertMaterial({color:0xc8a820}));
  g.add(frame);
  const lip=new THREE.Mesh(new THREE.BoxGeometry(pw+border,ph+border,11*S),
    new THREE.MeshLambertMaterial({color:0x4a3010}));
  lip.position.z=0.5*S;g.add(lip);
  const canvas=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),makeCanvasPainting(512,Math.round(512*ph/pw),drawFn));
  canvas.position.z=8*S;g.add(canvas);
  addGroup(g,id);
  return g;
}

// Botanical painting
function drawBotanical(ctx,w,h){
  ctx.fillStyle='#f5f0e8';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#e0d8c0';ctx.fillRect(0,h*0.82,w,h*0.18);
  // Stems
  ctx.strokeStyle='#4a3010';ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(w/2,h);ctx.quadraticCurveTo(w/2-20,h*0.55,w/2,h*0.45);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w/2,h*0.7);ctx.quadraticCurveTo(w/2-50,h*0.55,w/2-70,h*0.38);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w/2,h*0.65);ctx.quadraticCurveTo(w/2+40,h*0.5,w/2+65,h*0.35);ctx.stroke();
  // Leaves
  ctx.fillStyle='#2a5a1a';
  [[w/2,h*0.45,60,80],[w/2-70,h*0.38,50,65],[w/2+65,h*0.35,48,62]].forEach(([cx,cy,rw,rh])=>{
    ctx.beginPath();ctx.ellipse(cx,cy,rw/2,rh/2,0,0,Math.PI*2);ctx.fill();
  });
  // Roses
  [[w/2,h*0.3,0x9c1c2c],[w/2-68,h*0.22,0xb02030],[w/2+62,h*0.2,0xa81828]].forEach(([cx,cy,col])=>{
    const r=(col>>16)&255,gr=(col>>8)&255,b=col&255;
    for(let ring=3;ring>=0;ring--){
      ctx.fillStyle=`rgba(${r+ring*10},${gr},${b},0.9)`;
      ctx.beginPath();ctx.ellipse(cx,cy,28-ring*4,22-ring*3,0,0,Math.PI*2);ctx.fill();
    }
  });
  // Label
  ctx.fillStyle='#4a3820';ctx.font='italic 18px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('Rosa Centifolia',w/2,h*0.92);
}

// Portrait painting
function drawPortrait(ctx,w,h){
  ctx.fillStyle='#8a7060';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#6a5040';ctx.fillRect(0,h*0.75,w,h*0.25);
  // Figure dress
  ctx.fillStyle='#2a1a3a';
  ctx.beginPath();ctx.ellipse(w/2,h*0.72,w*0.28,h*0.28,0,0,Math.PI*2);ctx.fill();
  ctx.fillRect(w*0.36,h*0.38,w*0.28,h*0.36);
  // Arms
  ctx.fillRect(w*0.18,h*0.4,w*0.18,h*0.24);
  ctx.fillRect(w*0.64,h*0.4,w*0.18,h*0.24);
  // Neck/skin
  ctx.fillStyle='#e8c8a0';
  ctx.beginPath();ctx.ellipse(w/2,h*0.27,w*0.16,h*0.14,0,0,Math.PI*2);ctx.fill();
  // Hair
  ctx.fillStyle='#1a0e08';
  ctx.beginPath();ctx.ellipse(w/2,h*0.19,w*0.15,h*0.07,0,0,Math.PI*2);ctx.fill();
  // Eyes
  ctx.fillStyle='#3a2010';
  ctx.beginPath();ctx.ellipse(w*0.44,h*0.26,4,3,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(w*0.56,h*0.26,4,3,0,0,Math.PI*2);ctx.fill();
  // Lace collar
  ctx.fillStyle='#f0e8f8';ctx.globalAlpha=0.7;
  ctx.beginPath();ctx.ellipse(w*0.43,h*0.37,8,4,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.ellipse(w*0.57,h*0.37,8,4,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

// Curio/trinket painting
function drawTrinkets(ctx,w,h){
  ctx.fillStyle='#1a0e06';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#2a1608';ctx.fillRect(0,h*0.75,w,h*0.25);
  // Shelf
  ctx.fillStyle='#3a2010';ctx.fillRect(0,h*0.72,w,h*0.06);
  // Tall vase left
  ctx.fillStyle='#4a2a6a';
  ctx.beginPath();ctx.ellipse(w*0.18,h*0.5,w*0.08,h*0.22,0,0,Math.PI*2);ctx.fill();
  ctx.fillRect(w*0.15,h*0.28,w*0.06,h*0.1);
  ctx.fillStyle='#7a5a9a';ctx.beginPath();ctx.ellipse(w*0.18,h*0.28,w*0.04,h*0.04,0,0,Math.PI*2);ctx.fill();
  // Clock centre
  ctx.fillStyle='#1a1a1a';ctx.fillRect(w*0.38,h*0.28,w*0.14,h*0.44);
  ctx.fillStyle='#e8e8e0';ctx.beginPath();ctx.arc(w*0.45,h*0.44,w*0.07,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#2a1a08';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(w*0.45,h*0.44);ctx.lineTo(w*0.45,h*0.37);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w*0.45,h*0.44);ctx.lineTo(w*0.5,h*0.44);ctx.stroke();
  // Blue bottle right
  ctx.fillStyle='#1a4a7a';
  ctx.beginPath();ctx.ellipse(w*0.72,h*0.52,w*0.07,h*0.18,0,0,Math.PI*2);ctx.fill();
  ctx.fillRect(w*0.69,h*0.34,w*0.06,h*0.08);
  ctx.fillStyle='#4a6a9a';ctx.beginPath();ctx.ellipse(w*0.72,h*0.34,w*0.03,h*0.03,0,0,Math.PI*2);ctx.fill();
  // Book stack
  ctx.fillStyle='#8a4010';ctx.fillRect(w*0.82,h*0.5,w*0.12,h*0.22);
  ctx.fillStyle='#6a2808';ctx.fillRect(w*0.83,h*0.44,w*0.1,h*0.06);
  ctx.fillStyle='#c8a040';ctx.fillRect(w*0.84,h*0.42,w*0.08,h*0.02);
  // Caption
  ctx.fillStyle='#8a6840';ctx.font='italic 14px Georgia,serif';ctx.textAlign='center';
  ctx.fillText('Curios & Antiquities',w/2,h*0.93);
}

function init(){
  setTimeout(()=>{const f=document.getElementById("fadeOverlay");if(f)f.remove();},800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x080408);
  scene.fog=new THREE.Fog(0x080408,400,1800);
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Warm gas-lamp lighting
  scene.add(new THREE.AmbientLight(0x2a1a12,1.4));
  const c1=new THREE.PointLight(0xffcc66,2.2,1100);c1.position.set(0,RH-40*S,0);scene.add(c1);
  const fire=new THREE.PointLight(0xff6600,2.8,450);fire.position.set(0,80*S,-RD/2+60*S);scene.add(fire);
  const fire2=new THREE.PointLight(0xff4400,1.4,280);fire2.position.set(0,50*S,-RD/2+40*S);scene.add(fire2);
  const lamp1=new THREE.PointLight(0xffbb44,1.6,350);lamp1.position.set(-RW/2+120*S,200*S,0);scene.add(lamp1);
  const lamp2=new THREE.PointLight(0xffbb44,1.6,350);lamp2.position.set(RW/2-120*S,200*S,0);scene.add(lamp2);
  const fill=new THREE.PointLight(0xffcc88,1.0,1400);fill.position.set(0,RH/2,0);scene.add(fill);

  buildRoom();

  const _saved=localStorage.getItem(STORAGE_KEY);
  if(_saved){
    try{
      const d=JSON.parse(_saved);
      for(const e of d.objects){
        const o=editableObjects.find(x=>x.userData.editId===e.id);
        if(!o)continue;
        o.position.set(e.position.x,e.position.y,e.position.z);
        o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);
        o.scale.set(e.scale.x,e.scale.y,e.scale.z);
      }
    }catch(err){console.warn("Auto-load failed:",err);}
  }

  document.getElementById("editBtn").addEventListener("click",toggleEditMode);
  document.getElementById("saveBtn").addEventListener("click",saveLayout);
  document.getElementById("loadBtn").addEventListener("click",loadLayout);
  document.getElementById("clearBtn").addEventListener("click",clearAutoSave);
  renderer.domElement.addEventListener("click",onMouseClick);
  document.addEventListener("keydown",onKeyDown);
  document.addEventListener("keyup",onKeyUp);
  window.addEventListener("resize",onResize);

  // Spawn — near the door (front wall, centre)
  const _from=new URLSearchParams(window.location.search).get("from");
  camera.position.set(0,240*S,RD/2-120*S);
  yaw=0;
  updateRotation();
  animate();
}

function buildRoom(){
  // ── Materials ──
  // Deep burgundy-plum wallpaper with pattern suggestion
  const wallMat   =new THREE.MeshLambertMaterial({color:0x2a0e18});
  const wallUpperMat=new THREE.MeshLambertMaterial({color:0x3a1825}); // above dado — richer
  const floorMat  =new THREE.MeshLambertMaterial({color:0x160a04});
  const ceilMat   =new THREE.MeshLambertMaterial({color:0x180c08});
  const darkWood  =new THREE.MeshLambertMaterial({color:0x0e0604});
  const midWood   =new THREE.MeshLambertMaterial({color:0x2a1206});
  const richWood  =new THREE.MeshLambertMaterial({color:0x4a1e0a});
  const goldMat   =new THREE.MeshLambertMaterial({color:0xc8a820});
  const brassMat  =new THREE.MeshLambertMaterial({color:0xb87820});
  const plasterMat=new THREE.MeshLambertMaterial({color:0xe8dcc8});
  const creamMat  =new THREE.MeshLambertMaterial({color:0xe8e0cc});
  const marbleMat =new THREE.MeshLambertMaterial({color:0xd4c8b8});
  const darkMarble=new THREE.MeshLambertMaterial({color:0x1a1210});
  const ironMat   =new THREE.MeshLambertMaterial({color:0x1a1814});
  const emberMat  =new THREE.MeshLambertMaterial({color:0xcc4400,emissive:0x441100});
  const velvetDeep=new THREE.MeshLambertMaterial({color:0x3a0820}); // deep burgundy velvet
  const velvetTeal=new THREE.MeshLambertMaterial({color:0x084838}); // teal accent velvet
  const velvetPurp=new THREE.MeshLambertMaterial({color:0x2a1040}); // purple velvet

  // ── Herringbone parquet floor ──
  const tileA=new THREE.MeshLambertMaterial({color:0x2a1206});
  const tileB=new THREE.MeshLambertMaterial({color:0x1e0c04});
  const tSz=40*S;
  const nX=Math.ceil(RW/tSz), nZ=Math.ceil(RD/tSz);
  for(let ix=0;ix<nX;ix++) for(let iz=0;iz<nZ;iz++){
    const m=(ix+iz)%2===0?tileA:tileB;
    const t=new THREE.Mesh(new THREE.BoxGeometry(tSz-1,1.5*S,tSz-1),m);
    t.position.set(-RW/2+tSz*(ix+0.5),0.5*S,-RD/2+tSz*(iz+0.5));scene.add(t);
  }

  // ── Ceiling ──
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(RW,RD),ceilMat);
  ceil.rotation.x=Math.PI/2;ceil.position.y=RH;scene.add(ceil);
  // Cornice
  [[new THREE.BoxGeometry(RW+20*S,16*S,18*S),0,RH-8*S,-RD/2+9*S],
   [new THREE.BoxGeometry(RW+20*S,16*S,18*S),0,RH-8*S, RD/2-9*S],
   [new THREE.BoxGeometry(16*S,16*S,RD),     -RW/2+9*S,RH-8*S,0],
   [new THREE.BoxGeometry(16*S,16*S,RD),      RW/2-9*S,RH-8*S,0],
  ].forEach(([geo,x,y,z])=>{const m=new THREE.Mesh(geo,plasterMat);m.position.set(x,y,z);scene.add(m);});
  // Ceiling rose
  const rose=new THREE.Mesh(new THREE.CylinderGeometry(42*S,42*S,5*S,20),plasterMat);
  rose.position.set(0,RH-2.5*S,0);scene.add(rose);
  const roseRing=new THREE.Mesh(new THREE.TorusGeometry(38*S,4*S,8,20),plasterMat);
  roseRing.rotation.x=Math.PI/2;roseRing.position.set(0,RH-5*S,0);scene.add(roseRing);
  // Gas chandelier

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
function updateRotation(){camera.rotation.order="YXZ";camera.rotation.set(0,yaw,0);}

const exitCooldown=(new URLSearchParams(window.location.search).get("from")==="floor2")?Date.now()+4000:0;
let exitTriggered=false,nearExit=false;

function checkExitDoor(){
  if(!exitTriggered&&Date.now()>exitCooldown){
    nearExit=Math.abs(camera.position.x)<200*S&&camera.position.z>RD/2-200*S;
    document.getElementById("doorHint").style.display=nearExit?"block":"none";
  }
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();const delta=(now-prevTime)/1000;prevTime=now;
  if(!EDIT_MODE){
    if(turnLeft)yaw+=2.2*delta;if(turnRight)yaw-=2.2*delta;
    const mv=Number(moveForward)-Number(moveBackward);
    if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    camera.position.x+=fwd.x*mv*120*delta;
    camera.position.z+=fwd.z*mv*120*delta;
    camera.position.x=Math.max(-RW/2+20*S,Math.min(RW/2-20*S,camera.position.x));
    camera.position.z=Math.max(-RD/2+20*S,Math.min(RD/2-15*S,camera.position.z));
    camera.position.y=240*S;
  }
  checkExitDoor();updateRotation();
  // Flame flicker
  if(window._flameMats){
    const t=now*0.003;
    window._flameMats.forEach((m,i)=>{
      m.opacity=Math.max(0.1,(i===0?0.85:i===1?0.7:i===2?0.55:0.35)+(Math.sin(t*3.1+i*1.3)*0.12+Math.sin(t*5.7+i*0.9)*0.08));
      m.emissiveIntensity=0.7+Math.sin(t*4.2+i)*0.3;
    });
  }
  renderer.render(scene,camera);
  EvidenceSystem.update();
}

<script>
(async()=>{
  await MysteryEngine.init();

  if(!scenario){scenario=MysteryEngine.generate();await MysteryState.save(scenario);}
  window._scenario=scenario;
  MysteryUI.init(scenario,false);
  MysteryUI.setZone('victorian_suite');
  init();
  EvidenceSystem.init({ camera, scene, renderer, zoneId: 'victoriansuite' });
  const _sa=()=>{if(window.SoundSystem)SoundSystem.startAmbient();window.removeEventListener('keydown',_sa);window.removeEventListener('click',_sa);};
  window.addEventListener('keydown',_sa);window.addEventListener('click',_sa);
})();
</script>
