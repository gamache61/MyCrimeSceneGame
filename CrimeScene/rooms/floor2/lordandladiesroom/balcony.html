<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balcony — Crowsnest</title>
<style>
#exitFade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9999;transition:opacity 0.6s ease;}
#exitFade.show{opacity:1;}
#instructionLine{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:8px 16px;font-size:14px;color:#eee;background:rgba(0,0,0,0.5);border-radius:6px;z-index:30;pointer-events:none;white-space:nowrap;}
body{margin:0;overflow:hidden;background:#7ab0d0;font-family:Arial,sans-serif;}
canvas{display:block;}
#fadeOverlay{position:fixed;inset:0;background:#000;z-index:9999;animation:fadeOut 0.8s ease forwards;}
@keyframes fadeOut{from{opacity:1;}to{opacity:0;}}
#editHud{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:8px;align-items:center;}
#editBtn,#saveBtn,#loadBtn,#clearBtn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.25);background:rgba(0,0,0,0.72);color:#eee;cursor:pointer;user-select:none;}
#editIndicator{padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid rgba(255,255,255,0.20);background:rgba(80,20,20,0.8);color:#ffd0d0;}
#editIndicator.on{background:rgba(20,80,20,0.85);color:#d5ffd5;}
#autoStatus{position:fixed;top:108px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:rgba(0,0,0,0.65);color:#d7f7d7;font:12px/1.35 system-ui,Arial;display:none;z-index:70;pointer-events:none;}
#selInfo{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 18px;background:rgba(0,0,0,0.8);color:#aaddff;border-radius:8px;font-size:13px;display:none;z-index:60;pointer-events:none;}
</style>
</head>
<body>
<div id="exitFade"></div>
<div id="instructionLine">W/↑ Forward &nbsp; S/↓ Back &nbsp; ←/→ Turn &nbsp; E = Return to Bedroom &nbsp; M = Edit Mode</div>
<div id="doorHint" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.8);color:#a8e8ff;border-radius:8px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(100,180,255,0.4);">Press E — Return to Bedroom</div>
<div id="fadeOverlay"></div>
<div id="editHud">
  <button id="editBtn" type="button">Edit Mode</button>
  <button id="saveBtn" type="button">Save Layout</button>
  <button id="loadBtn" type="button">Load Layout</button>
  <button id="clearBtn" type="button">Clear Save</button>
  <div id="editIndicator">OFF</div>
</div>
<div id="autoStatus"></div>
<div id="selInfo"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const STORAGE_KEY="balcony_layout";
let scene,camera,renderer;
let moveForward=false,moveBackward=false,turnLeft=false,turnRight=false;
let yaw=0,prevTime=performance.now();
const S=0.5;
const GROUND_DROP=600;
const BAL_W=800*S*3, BAL_D=500*S*3;

// ── Edit system ──
let EDIT_MODE=false, selectedObject=null;
const editableObjects=[];
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let _editCounter=0;

function addGroup(g,id){
  if(!g.userData) g.userData={};
  g.userData.editId=id||("grp_"+(++_editCounter));
  editableObjects.push(g); scene.add(g); return g;
}
function showAutoStatus(msg,ok=true){
  const el=document.getElementById("autoStatus");
  el.style.display="block"; el.style.color=ok?"#d7f7d7":"#ffd7d7"; el.textContent=msg;
  setTimeout(()=>{el.style.display="none";},2200);
}
function updateEditUI(){
  const ind=document.getElementById("editIndicator");
  ind.textContent=EDIT_MODE?"ON":"OFF"; ind.classList.toggle("on",EDIT_MODE);
  const btn=document.getElementById("editBtn");
  btn.textContent=EDIT_MODE?"✏️ Edit Mode: ON":"Edit Mode: OFF";
  btn.style.background=EDIT_MODE?"rgba(20,80,20,0.85)":"rgba(0,0,0,0.72)";
  btn.style.color=EDIT_MODE?"#d5ffd5":"#eee";
}
function toggleEditMode(){
  EDIT_MODE=!EDIT_MODE;
  if(!EDIT_MODE){selectedObject=null;document.getElementById("selInfo").style.display="none";}
  updateEditUI();
}
function saveLayout(){
  const objects=editableObjects.map(o=>{
    const wp=new THREE.Vector3(); o.getWorldPosition(wp);
    const wq=new THREE.Quaternion(); o.getWorldQuaternion(wq);
    return {id:o.userData.editId,position:{x:wp.x,y:wp.y,z:wp.z},quaternion:{x:wq.x,y:wq.y,z:wq.z,w:wq.w},scale:{x:o.scale.x,y:o.scale.y,z:o.scale.z}};
  });
  localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,savedAt:Date.now(),objects}));
  showAutoStatus("✅ Layout saved",true);
}
function loadLayout(){
  const json=localStorage.getItem(STORAGE_KEY);
  if(!json){showAutoStatus("No saved layout",false);return;}
  try{
    const d=JSON.parse(json);
    for(const e of d.objects){
      const o=editableObjects.find(x=>x.userData.editId===e.id);
      if(!o) continue;
      o.position.set(e.position.x,e.position.y,e.position.z);
      o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);
      o.scale.set(e.scale.x,e.scale.y,e.scale.z);
    }
    showAutoStatus("✅ Layout loaded",true);
  }catch(e){showAutoStatus("Load failed",false);}
}
function clearSave(){localStorage.removeItem(STORAGE_KEY);showAutoStatus("🗑 Save cleared",true);}

function onMouseClick(e){
  if(!EDIT_MODE) return;
  const rect=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
  mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const meshes=[];
  editableObjects.forEach(o=>{if(o.isMesh)meshes.push(o);else o.traverse(ch=>{if(ch.isMesh)meshes.push(ch);});});
  const hits=raycaster.intersectObjects(meshes,false);
  if(!hits.length){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
  let obj=hits[0].object;
  let cur=obj;
  while(cur){if(editableObjects.includes(cur)){obj=cur;break;}cur=cur.parent;}
  if(!editableObjects.includes(obj)){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
  selectedObject=obj;
  const si=document.getElementById("selInfo");
  si.style.display="block";
  si.textContent=`✏️ ${obj.userData.editId} | Arrows=Move  Shift+↑↓=Height  R=Rotate  Del=Delete`;
  showAutoStatus("Selected: "+obj.userData.editId,true);
}

function onKeyDown(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if(e.code==="KeyM"){toggleEditMode();return;}
if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
    if(e.code==="KeyE"&&nearExit&&!exitTriggered){
    exitTriggered=true;
    document.getElementById("doorHint").style.display="none";
    document.getElementById("exitFade").classList.add("show");
    setTimeout(()=>window.location.href="lord&ladiesroom.html?from=balcony",600);
    return;
  }
  if(EDIT_MODE&&selectedObject){
    if(e.code==="Delete"||e.code==="Backspace"){
      e.preventDefault();
      scene.remove(selectedObject);
      const idx=editableObjects.indexOf(selectedObject);
      if(idx>-1) editableObjects.splice(idx,1);
      showAutoStatus("🗑 Deleted: "+selectedObject.userData.editId,true);
      selectedObject=null; document.getElementById("selInfo").style.display="none"; return;
    }
    const speed=e.shiftKey?2:10; let moved=false;
    if(!e.shiftKey){
      if(e.code==="ArrowUp")   {selectedObject.position.z-=speed;moved=true;}
      if(e.code==="ArrowDown") {selectedObject.position.z+=speed;moved=true;}
      if(e.code==="ArrowLeft") {selectedObject.position.x-=speed;moved=true;}
      if(e.code==="ArrowRight"){selectedObject.position.x+=speed;moved=true;}
    }
    if(e.shiftKey&&e.code==="ArrowUp")  {selectedObject.position.y+=speed;moved=true;}
    if(e.shiftKey&&e.code==="ArrowDown"){selectedObject.position.y-=speed;moved=true;}
    if(e.code==="KeyR"){selectedObject.rotation.y+=e.shiftKey?0.05:0.1;moved=true;}
    if(moved) return;
  }
  if(!EDIT_MODE){
    if(e.code==="KeyW"||e.code==="ArrowUp")   moveForward=true;
    if(e.code==="KeyS"||e.code==="ArrowDown") moveBackward=true;
    if(e.code==="ArrowLeft")  turnLeft=true;
    if(e.code==="ArrowRight") turnRight=true;
  }
}
function onKeyUp(e){
  if(e.code==="KeyW"||e.code==="ArrowUp")   moveForward=false;
  if(e.code==="KeyS"||e.code==="ArrowDown") moveBackward=false;
  if(e.code==="ArrowLeft")  turnLeft=false;
  if(e.code==="ArrowRight") turnRight=false;
}

function init(){
  setTimeout(()=>{const f=document.getElementById("fadeOverlay");if(f)f.remove();},800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x7ab0d0);
  scene.fog=new THREE.Fog(0xb0c8e0,1200,5000);
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.1,5000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xd0c8b8,1.0));
  const sun=new THREE.DirectionalLight(0xffd8a0,1.2);
  sun.position.set(300,600,200); scene.add(sun);
  const fill=new THREE.DirectionalLight(0xa8c0d8,0.4);
  fill.position.set(-200,300,-100); scene.add(fill);

  buildBalcony();

  // Auto-load
  const _saved=localStorage.getItem(STORAGE_KEY);
  if(_saved){try{const d=JSON.parse(_saved);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}}catch(err){}}

  document.getElementById("editBtn").addEventListener("click",toggleEditMode);
  document.getElementById("saveBtn").addEventListener("click",saveLayout);
  document.getElementById("loadBtn").addEventListener("click",loadLayout);
  document.getElementById("clearBtn").addEventListener("click",clearSave);
  renderer.domElement.addEventListener("click",onMouseClick);
  document.addEventListener("keydown",onKeyDown);
  document.addEventListener("keyup",onKeyUp);
  window.addEventListener("resize",onResize);

  camera.position.set(0,240*S,-BAL_D/2+120*S);
  yaw=Math.PI; updateRotation(); animate(); // face outward toward garden
}

function buildBalcony(){
  const stoneMat  =new THREE.MeshLambertMaterial({color:0xc8c0b0});
  const stoneDark =new THREE.MeshLambertMaterial({color:0xb0a898});
  const stoneLight=new THREE.MeshLambertMaterial({color:0xd8d0c0});
  const ironMat   =new THREE.MeshLambertMaterial({color:0x2a2828});
  const richWood  =new THREE.MeshLambertMaterial({color:0x4a2010});
  const brassMat  =new THREE.MeshLambertMaterial({color:0xb8860b});
  const lawnMat   =new THREE.MeshLambertMaterial({color:0x4aaa28});
  const waterMat  =new THREE.MeshLambertMaterial({color:0x4488bb,transparent:true,opacity:0.75});
  const glassMat  =new THREE.MeshLambertMaterial({color:0x88c8ff,transparent:true,opacity:0.22,side:THREE.DoubleSide});
  const pathMat   =new THREE.MeshLambertMaterial({color:0xd0c0a0});
  const cushMat   =new THREE.MeshLambertMaterial({color:0x4a0a20});
  const creamMat  =new THREE.MeshLambertMaterial({color:0xf0ece4});
  const houseWallMat=new THREE.MeshLambertMaterial({color:0xd0c8b8});

  // ── Non-editable: floor, walls, balustrade, garden ──
  // Floor
  const floor=new THREE.Mesh(new THREE.BoxGeometry(BAL_W,18*S,BAL_D),stoneMat);
  floor.position.set(0,0,0); scene.add(floor);
  const tW=60*S,tD=60*S;
  for(let ti=0;ti<Math.ceil(BAL_W/tW);ti++)
    for(let tj=0;tj<Math.ceil(BAL_D/tD);tj++){
      if((ti+tj)%2===0) continue;
      const tile=new THREE.Mesh(new THREE.BoxGeometry(tW-3,4*S,tD-3),stoneDark);
      tile.position.set(-BAL_W/2+tW*(ti+0.5),11*S,-BAL_D/2+tD*(tj+0.5)); scene.add(tile);
    }

  // House wall + French doors
  const wallH=600*S, fdW=300*S;
  const wSideW=(BAL_W-fdW)/2;
  [-1,1].forEach(s=>{
    const ws=new THREE.Mesh(new THREE.BoxGeometry(wSideW,wallH,20*S),houseWallMat);
    ws.position.set(s*(fdW/2+wSideW/2),wallH/2-9*S,-BAL_D/2); scene.add(ws);
  });
  const corniceTop=new THREE.Mesh(new THREE.BoxGeometry(BAL_W+20*S,20*S,28*S),stoneLight);
  corniceTop.position.set(0,wallH-9*S,-BAL_D/2+4*S); scene.add(corniceTop);
  const fdFrameMat=new THREE.MeshLambertMaterial({color:0xc8a46e});
  const fdDoorMat=new THREE.MeshLambertMaterial({color:0x5a8a5a});
  [-fdW/2-8*S,fdW/2+8*S].forEach(fx=>{
    const fs=new THREE.Mesh(new THREE.BoxGeometry(16*S,wallH,20*S),fdFrameMat);
    fs.position.set(fx,wallH/2-9*S,-BAL_D/2); scene.add(fs);
  });
  [-1,1].forEach(s=>{
    const leaf=new THREE.Mesh(new THREE.BoxGeometry(fdW/2,wallH,16*S),fdDoorMat);
    leaf.position.set(s*fdW/4,wallH/2-9*S,-BAL_D/2); scene.add(leaf);
    [wallH*0.12,wallH*0.35,wallH*0.58,wallH*0.80].forEach(py=>{
      const pane=new THREE.Mesh(new THREE.BoxGeometry(fdW/2-18*S,wallH*0.16,18*S),glassMat);
      pane.position.set(s*fdW/4,py-9*S,-BAL_D/2); scene.add(pane);
    });
  });
  const divStrip=new THREE.Mesh(new THREE.BoxGeometry(8*S,wallH,20*S),fdFrameMat);
  divStrip.position.set(0,wallH/2-9*S,-BAL_D/2); scene.add(divStrip);

  // Balustrade
  const bMat=new THREE.MeshLambertMaterial({color:0xd8d0c0});
  const railH=180*S, postR=8*S;
  const rFront=new THREE.Mesh(new THREE.BoxGeometry(BAL_W+32*S,16*S,16*S),bMat);
  rFront.position.set(0,railH,BAL_D/2); scene.add(rFront);
  const rFrontBase=new THREE.Mesh(new THREE.BoxGeometry(BAL_W+32*S,16*S,16*S),bMat);
  rFrontBase.position.set(0,9*S,BAL_D/2); scene.add(rFrontBase);
  const rLeft=new THREE.Mesh(new THREE.BoxGeometry(16*S,railH,BAL_D),bMat);
  rLeft.position.set(-BAL_W/2,railH/2,0); scene.add(rLeft);
  const rRight=rLeft.clone(); rRight.position.x=BAL_W/2; scene.add(rRight);
  // Front balusters
  const bCount=Math.floor(BAL_W/50);
  for(let i=0;i<=bCount;i++){
    const bx=-BAL_W/2+i*(BAL_W/bCount);
    const bal=new THREE.Mesh(new THREE.CylinderGeometry(postR*0.6,postR*0.8,railH-16*S,8),bMat);
    bal.position.set(bx,railH/2,BAL_D/2); scene.add(bal);
    const bulge=new THREE.Mesh(new THREE.SphereGeometry(postR*0.9,8,8),bMat);
    bulge.position.set(bx,railH*0.5,BAL_D/2); scene.add(bulge);
  }
  // Side balusters
  const bCountS=Math.floor(BAL_D/50);
  for(let i=1;i<bCountS;i++){
    const bz=-BAL_D/2+i*(BAL_D/bCountS);
    [-BAL_W/2,BAL_W/2].forEach(bx=>{
      const bal=new THREE.Mesh(new THREE.CylinderGeometry(postR*0.6,postR*0.8,railH-16*S,8),bMat);
      bal.position.set(bx,railH/2,bz); scene.add(bal);
      const bulge=new THREE.Mesh(new THREE.SphereGeometry(postR*0.9,8,8),bMat);
      bulge.position.set(bx,railH*0.5,bz); scene.add(bulge);
    });
  }
  // Corner posts
  [[-BAL_W/2,BAL_D/2],[BAL_W/2,BAL_D/2]].forEach(([cx,cz])=>{
    const cp=new THREE.Mesh(new THREE.CylinderGeometry(postR*1.4,postR*1.6,railH+10*S,10),bMat);
    cp.position.set(cx,railH/2+5*S,cz); scene.add(cp);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(postR*1.8,10,10),stoneLight);
    cap.position.set(cx,railH+14*S,cz); scene.add(cap);
  });

  // Ground & garden
  const groundY=-GROUND_DROP;
  const GARDEN_OFFSET=2400*S; // push garden much further out front
  // Large ground plane covering all directions
  const ground=new THREE.Mesh(new THREE.BoxGeometry(16000*S,20*S,16000*S),lawnMat);
  ground.position.set(0,groundY,GARDEN_OFFSET); scene.add(ground);

  // Stone terrace directly below balcony — visible looking straight down
  const terrace=new THREE.Mesh(new THREE.BoxGeometry(BAL_W+400*S,20*S,1200*S),
    new THREE.MeshLambertMaterial({color:0xc8c0b0}));
  terrace.position.set(0,groundY,-BAL_D/2+400*S); scene.add(terrace);
  // Terrace tile pattern
  for(let ti=0;ti<12;ti++) for(let tj=0;tj<6;tj++){
    const tt=new THREE.Mesh(new THREE.BoxGeometry(100*S-4,4*S,120*S-4),
      new THREE.MeshLambertMaterial({color:(ti+tj)%2===0?0xb8b0a0:0xd0c8b8}));
    tt.position.set(-550*S+ti*100*S,groundY+12*S,-BAL_D/2+100*S+tj*120*S); scene.add(tt);
  }

  // Path from terrace into garden
  const path=new THREE.Mesh(new THREE.BoxGeometry(80*S,22*S,4000*S),pathMat);
  path.position.set(0,groundY,GARDEN_OFFSET); scene.add(path);

  // Cross path (left-right)
  const crossPath=new THREE.Mesh(new THREE.BoxGeometry(3000*S,22*S,80*S),pathMat);
  crossPath.position.set(0,groundY,GARDEN_OFFSET+800*S); scene.add(crossPath);

  // Formal garden hedges — symmetric around the path
  [[-300*S,400*S],[300*S,400*S],[-300*S,900*S],[300*S,900*S],
   [-300*S,1400*S],[300*S,1400*S]].forEach(([hx,hz])=>{
    const hedge=new THREE.Mesh(new THREE.BoxGeometry(200*S,90*S,200*S),new THREE.MeshLambertMaterial({color:0x2a6a18}));
    hedge.position.set(hx,groundY+50*S,GARDEN_OFFSET+hz); scene.add(hedge);
  });
  // Long border hedges
  [-1,1].forEach(s=>{
    const longHedge=new THREE.Mesh(new THREE.BoxGeometry(20*S,60*S,2400*S),new THREE.MeshLambertMaterial({color:0x2a6a18}));
    longHedge.position.set(s*500*S,groundY+40*S,GARDEN_OFFSET+700*S); scene.add(longHedge);
  });

  // Fountain centrepiece — bigger
  const fBase=new THREE.Mesh(new THREE.CylinderGeometry(120*S,130*S,24*S,20),stoneMat);
  fBase.position.set(0,groundY+12*S,GARDEN_OFFSET+800*S); scene.add(fBase);
  const fBowl=new THREE.Mesh(new THREE.CylinderGeometry(100*S,80*S,36*S,20,1,true),stoneLight);
  fBowl.position.set(0,groundY+36*S,GARDEN_OFFSET+800*S); scene.add(fBowl);
  const fWater=new THREE.Mesh(new THREE.CylinderGeometry(94*S,94*S,8*S,20),waterMat);
  fWater.position.set(0,groundY+38*S,GARDEN_OFFSET+800*S); scene.add(fWater);
  const fPillar=new THREE.Mesh(new THREE.CylinderGeometry(8*S,12*S,110*S,10),stoneLight);
  fPillar.position.set(0,groundY+90*S,GARDEN_OFFSET+800*S); scene.add(fPillar);
  const fTop=new THREE.Mesh(new THREE.SphereGeometry(20*S,10,10),stoneMat);
  fTop.position.set(0,groundY+150*S,GARDEN_OFFSET+800*S); scene.add(fTop);
  // Upper bowl
  const fBowl2=new THREE.Mesh(new THREE.CylinderGeometry(50*S,40*S,20*S,16,1,true),stoneLight);
  fBowl2.position.set(0,groundY+140*S,GARDEN_OFFSET+800*S); scene.add(fBowl2);

  // Trees — lining both sides of paths and filling sides
  [400*S,700*S,1000*S,1300*S,1600*S,1900*S].forEach(tz=>{
    [-220*S,220*S,-600*S,600*S,-1000*S,1000*S].forEach(tx=>{
      const tH=160+Math.abs(tx)%3*30;
      const trunk=new THREE.Mesh(new THREE.CylinderGeometry(9*S,13*S,tH*S,8),new THREE.MeshLambertMaterial({color:0x3a2010}));
      trunk.position.set(tx,groundY+tH*S/2,GARDEN_OFFSET+tz); scene.add(trunk);
      const canopy=new THREE.Mesh(new THREE.SphereGeometry(65*S+Math.abs(tx)%3*15*S,10,10),new THREE.MeshLambertMaterial({color:0x3a8a28}));
      canopy.scale.set(1,1.2,1); canopy.position.set(tx,groundY+tH*S+55*S,GARDEN_OFFSET+tz); scene.add(canopy);
    });
  });

  // Side gardens — left and right of balcony
  [-1,1].forEach(s=>{
    // Lawn extending sideways
    const sideLawn=new THREE.Mesh(new THREE.BoxGeometry(4000*S,20*S,6000*S),lawnMat);
    sideLawn.position.set(s*3000*S,groundY,-BAL_D/2+2500*S); scene.add(sideLawn);
    // Side trees
    [200*S,600*S,1000*S,1400*S,1800*S].forEach(tz=>{
      [800*S,1400*S,2000*S].forEach(tx=>{
        const tH=150+tx%4*20;
        const trunk=new THREE.Mesh(new THREE.CylinderGeometry(8*S,11*S,tH*S,8),new THREE.MeshLambertMaterial({color:0x3a2010}));
        trunk.position.set(s*(BAL_W/2+tx),groundY+tH*S/2,GARDEN_OFFSET+tz-800*S); scene.add(trunk);
        const canopy=new THREE.Mesh(new THREE.SphereGeometry(60*S,10,10),new THREE.MeshLambertMaterial({color:0x3a8a28}));
        canopy.position.set(s*(BAL_W/2+tx),groundY+tH*S+50*S,GARDEN_OFFSET+tz-800*S); scene.add(canopy);
      });
    });
  });

  // Distant tree line — all the way around
  for(let i=0;i<30;i++){
    const tx=-2400*S+i*160*S, tH=180+i%5*25;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(7*S,10*S,tH*S,6),new THREE.MeshLambertMaterial({color:0x2a1808}));
    trunk.position.set(tx,groundY+tH*S/2,GARDEN_OFFSET+2400*S); scene.add(trunk);
    const canopy=new THREE.Mesh(new THREE.SphereGeometry(60*S+i%4*12*S,8,8),new THREE.MeshLambertMaterial({color:0x2a6018}));
    canopy.position.set(tx,groundY+tH*S+48*S,GARDEN_OFFSET+2400*S); scene.add(canopy);
  }
  // Left treeline
  for(let i=0;i<20;i++){
    const tz=i*200*S, tH=160+i%4*20;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(7*S,10*S,tH*S,6),new THREE.MeshLambertMaterial({color:0x2a1808}));
    trunk.position.set(-2400*S,groundY+tH*S/2,GARDEN_OFFSET+tz); scene.add(trunk);
    const canopy=new THREE.Mesh(new THREE.SphereGeometry(60*S,8,8),new THREE.MeshLambertMaterial({color:0x2a6018}));
    canopy.position.set(-2400*S,groundY+tH*S+48*S,GARDEN_OFFSET+tz); scene.add(canopy);
  }
  // Right treeline
  for(let i=0;i<20;i++){
    const tz=i*200*S, tH=160+i%4*20;
    const trunk=new THREE.Mesh(new THREE.CylinderGeometry(7*S,10*S,tH*S,6),new THREE.MeshLambertMaterial({color:0x2a1808}));
    trunk.position.set(2400*S,groundY+tH*S/2,GARDEN_OFFSET+tz); scene.add(trunk);
    const canopy=new THREE.Mesh(new THREE.SphereGeometry(60*S,8,8),new THREE.MeshLambertMaterial({color:0x2a6018}));
    canopy.position.set(2400*S,groundY+tH*S+48*S,GARDEN_OFFSET+tz); scene.add(canopy);
  }

  // Rolling hills in distance
  [[-1200*S,3000*S,400],[0,3500*S,500],[1200*S,3000*S,350],[-600*S,3800*S,300],[600*S,3600*S,380]].forEach(([hx,hz,hs])=>{
    const hill=new THREE.Mesh(new THREE.SphereGeometry(hs*S,12,12),new THREE.MeshLambertMaterial({color:0x4a7a3a}));
    hill.scale.set(2.5,0.5,2.5); hill.position.set(hx,groundY+hs*S*0.25,GARDEN_OFFSET+hz); scene.add(hill);
  });

  // Clouds
  [[0,350*S,3200*S],[800*S,400*S,2800*S],[-700*S,320*S,3000*S],[400*S,450*S,3600*S],[-400*S,380*S,2600*S]].forEach(([cx,cy,cz])=>{
    const cloud=new THREE.Mesh(new THREE.SphereGeometry(130*S,8,8),new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:0.80}));
    cloud.scale.set(2.8,0.75,1.4); cloud.position.set(cx,cy,GARDEN_OFFSET+cz); scene.add(cloud);
  });

  // ── OCEAN — far out at the edges, well below ground level ──
  const oceanMat=new THREE.MeshLambertMaterial({color:0x40b8e8,transparent:true,opacity:0.92});
  const oceanDeepMat=new THREE.MeshLambertMaterial({color:0x1a90cc,transparent:true,opacity:0.95});
  const seafoamMat=new THREE.MeshLambertMaterial({color:0x88c8e8,transparent:true,opacity:0.5});
  const OCEAN_Y=groundY-40*S; // ocean surface well below ground/garden level
  const OCEAN_SIZE=20000*S;

  // Single huge ocean plane far below — visible only at distant edges
  const ocean=new THREE.Mesh(new THREE.BoxGeometry(OCEAN_SIZE,20*S,OCEAN_SIZE),oceanMat);
  ocean.position.set(0,OCEAN_Y,GARDEN_OFFSET+6000*S); scene.add(ocean);

  // Sandy beach — only at the very far end of garden
  const beachMat=new THREE.MeshLambertMaterial({color:0xe8d8a0});
  const beach=new THREE.Mesh(new THREE.BoxGeometry(OCEAN_SIZE,16*S,400*S),beachMat);
  beach.position.set(0,groundY+6*S,GARDEN_OFFSET+4200*S); scene.add(beach);

  // Seafoam at water edge
  const seafoam=new THREE.Mesh(new THREE.BoxGeometry(OCEAN_SIZE,8*S,80*S),seafoamMat);
  seafoam.position.set(0,OCEAN_Y+12*S,GARDEN_OFFSET+4400*S); scene.add(seafoam);

  // Horizon glow
  const horizonMat=new THREE.MeshLambertMaterial({color:0x88b8d8,transparent:true,opacity:0.4});
  const horizon=new THREE.Mesh(new THREE.BoxGeometry(OCEAN_SIZE*2,80*S,20*S),horizonMat);
  horizon.position.set(0,groundY+200*S,GARDEN_OFFSET+7000*S); scene.add(horizon);

  // ── EDITABLE FURNITURE ──

  // ── 4 Iron chairs ──
  [[-180*S,80*S,0],[180*S,80*S,0],[-180*S,280*S,Math.PI],[180*S,280*S,Math.PI]].forEach(([cx,cz,ry],i)=>{
    const g=new THREE.Group();
    const seat=new THREE.Mesh(new THREE.BoxGeometry(120*S,12*S,110*S),ironMat);
    seat.position.set(0,100*S,0); g.add(seat);
    const back=new THREE.Mesh(new THREE.BoxGeometry(120*S,110*S,12*S),ironMat);
    back.position.set(0,156*S,54*S); g.add(back);
    for(let b=0;b<3;b++){
      const bar=new THREE.Mesh(new THREE.BoxGeometry(8*S,90*S,8*S),ironMat);
      bar.position.set(-40*S+b*40*S,152*S,54*S); g.add(bar);
    }
    [-1,1].forEach(s=>{
      const arm=new THREE.Mesh(new THREE.BoxGeometry(12*S,8*S,110*S),ironMat);
      arm.position.set(s*54*S,150*S,0); g.add(arm);
      const sup=new THREE.Mesh(new THREE.BoxGeometry(8*S,50*S,8*S),ironMat);
      sup.position.set(s*54*S,128*S,42*S); g.add(sup);
    });
    [[-50*S,-45*S],[50*S,-45*S],[-50*S,45*S],[50*S,45*S]].forEach(([lx,lz])=>{
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(5*S,5*S,96*S,8),ironMat);
      leg.position.set(lx,52*S,lz); g.add(leg);
      const foot=new THREE.Mesh(new THREE.SphereGeometry(7*S,8,8),ironMat);
      foot.position.set(lx,8*S,lz); g.add(foot);
    });
    const cush=new THREE.Mesh(new THREE.BoxGeometry(112*S,16*S,100*S),cushMat);
    cush.position.set(0,108*S,0); g.add(cush);
    const bcush=new THREE.Mesh(new THREE.BoxGeometry(108*S,90*S,16*S),cushMat);
    bcush.position.set(0,148*S,46*S); g.add(bcush);
    g.position.set(cx,0,cz); g.rotation.y=ry;
    addGroup(g,"chair_"+(i+1));
  });

  // ── Dining table ──
  const tableG=new THREE.Group();
  const tabTop=new THREE.Mesh(new THREE.BoxGeometry(280*S,14*S,160*S),richWood);
  tabTop.position.set(0,112*S,0); tableG.add(tabTop);
  const tabEdge=new THREE.Mesh(new THREE.BoxGeometry(286*S,8*S,166*S),ironMat);
  tabEdge.position.set(0,107*S,0); tableG.add(tabEdge);
  [[-120*S,-68*S],[120*S,-68*S],[-120*S,68*S],[120*S,68*S]].forEach(([lx,lz])=>{
    const tleg=new THREE.Mesh(new THREE.CylinderGeometry(8*S,8*S,106*S,8),ironMat);
    tleg.position.set(lx,53*S,lz); tableG.add(tleg);
    const tfoot=new THREE.Mesh(new THREE.SphereGeometry(10*S,8,8),ironMat);
    tfoot.position.set(lx,6*S,lz); tableG.add(tfoot);
  });
  // Tea service
  const tray=new THREE.Mesh(new THREE.BoxGeometry(80*S,5*S,55*S),new THREE.MeshLambertMaterial({color:0xc8a46e}));
  tray.position.set(0,120*S,0); tableG.add(tray);
  const teapot=new THREE.Mesh(new THREE.SphereGeometry(16*S,10,10),creamMat);
  teapot.position.set(0,137*S,0); tableG.add(teapot);
  const spout=new THREE.Mesh(new THREE.CylinderGeometry(4*S,5*S,24*S,8),creamMat);
  spout.rotation.z=Math.PI/2.5; spout.position.set(-20*S,137*S,0); tableG.add(spout);
  [[-50*S,-15*S],[50*S,-15*S],[-50*S,15*S],[50*S,15*S]].forEach(([cx,cz])=>{
    const cup=new THREE.Mesh(new THREE.CylinderGeometry(10*S,8*S,14*S,10),creamMat);
    cup.position.set(cx,127*S,cz); tableG.add(cup);
    const saucer=new THREE.Mesh(new THREE.CylinderGeometry(14*S,14*S,4*S,12),creamMat);
    saucer.position.set(cx,122*S,cz); tableG.add(saucer);
  });
  tableG.position.set(0,0,180*S);
  addGroup(tableG,"dining_table");

  // ── 2 Sun Loungers — open flat design ──
  [-250*S,250*S].forEach((lx,i)=>{
    const lg=new THREE.Group();
    const lW=90*S, lL=320*S;

    // Main frame rails (two long side bars)
    [-1,1].forEach(s=>{
      const rail=new THREE.Mesh(new THREE.BoxGeometry(8*S,8*S,lL),ironMat);
      rail.position.set(s*lW/2,42*S,0); lg.add(rail);
    });
    // Cross bars
    [-lL/2+20*S,-lL/6,lL/6,lL/2-20*S].forEach(bz=>{
      const bar=new THREE.Mesh(new THREE.BoxGeometry(lW+8*S,8*S,8*S),ironMat);
      bar.position.set(0,42*S,bz); lg.add(bar);
    });

    // Flat mattress — lower body portion
    const mattress=new THREE.Mesh(new THREE.BoxGeometry(lW-12*S,12*S,lL*0.6),cushMat);
    mattress.position.set(0,50*S,lL*0.2); lg.add(mattress);

    // Raised back — upper third angled up at ~35°
    const backAngle=Math.PI/5.2; // ~35 degrees
    const backLen=lL*0.4;
    const backMesh=new THREE.Mesh(new THREE.BoxGeometry(lW-12*S,12*S,backLen),cushMat);
    backMesh.rotation.x=backAngle;
    backMesh.position.set(0, 50*S+Math.sin(backAngle)*backLen/2, -lL/2+Math.cos(backAngle)*backLen/2);
    lg.add(backMesh);
    // Back frame rail to support incline
    [-1,1].forEach(s=>{
      const sup=new THREE.Mesh(new THREE.BoxGeometry(6*S,6*S,backLen),ironMat);
      sup.rotation.x=backAngle;
      sup.position.set(s*(lW/2-3*S), 50*S+Math.sin(backAngle)*backLen/2, -lL/2+Math.cos(backAngle)*backLen/2);
      lg.add(sup);
    });
    // Back support strut (prop underneath)
    const strut=new THREE.Mesh(new THREE.BoxGeometry(lW-8*S,6*S,6*S),ironMat);
    strut.position.set(0,42*S+30*S,-lL/2+70*S); lg.add(strut);

    // Head pillow — separate editable group so it can be deleted independently
    const pillowG=new THREE.Group();
    const pillowMesh=new THREE.Mesh(new THREE.BoxGeometry(lW-18*S,16*S,40*S),creamMat);
    pillowMesh.rotation.x=backAngle;
    pillowG.add(pillowMesh);
    const pillowZ=-lL/2+Math.cos(backAngle)*backLen;
    const pillowY=50*S+Math.sin(backAngle)*backLen+8*S;
    pillowG.position.set(lx,pillowY,500*S+pillowZ);
    addGroup(pillowG,"lounger_pillow_"+(i+1));

    // Legs — 3 pairs, adjustable-style with cross brace
    [-lL/2+28*S,0,lL/2-28*S].forEach(lz=>{
      [-1,1].forEach(s=>{
        const leg=new THREE.Mesh(new THREE.CylinderGeometry(4*S,4*S,40*S,8),ironMat);
        leg.position.set(s*lW/2,20*S,lz); lg.add(leg);
        const foot=new THREE.Mesh(new THREE.BoxGeometry(16*S,6*S,6*S),ironMat);
        foot.position.set(s*lW/2,3*S,lz); lg.add(foot);
      });
      // Cross brace
      const brace=new THREE.Mesh(new THREE.BoxGeometry(lW+8*S,6*S,6*S),ironMat);
      brace.position.set(0,22*S,lz); lg.add(brace);
    });

    // Armrests — thin flat
    [-1,1].forEach(s=>{
      const arm=new THREE.Mesh(new THREE.BoxGeometry(8*S,6*S,lL*0.7),ironMat);
      arm.position.set(s*(lW/2+4*S),56*S,lL*0.1); lg.add(arm);
    });

    // Side table with drink
    const sidePost=new THREE.Mesh(new THREE.CylinderGeometry(4*S,5*S,55*S,8),ironMat);
    sidePost.position.set(lW/2+32*S,27*S,lL*0.1); lg.add(sidePost);
    const sideTop=new THREE.Mesh(new THREE.CylinderGeometry(24*S,24*S,6*S,12),richWood);
    sideTop.position.set(lW/2+32*S,58*S,lL*0.1); lg.add(sideTop);
    const glass=new THREE.Mesh(new THREE.CylinderGeometry(7*S,5*S,24*S,10),
      new THREE.MeshLambertMaterial({color:0x88ccff,transparent:true,opacity:0.6}));
    glass.position.set(lW/2+32*S,72*S,lL*0.1); lg.add(glass);

    lg.position.set(lx,0,500*S);
    addGroup(lg,"lounger_"+(i+1));
  });

  // ── 2 Potted plants ──
  [[-BAL_W/2+80*S,BAL_D/2-80*S],[BAL_W/2-80*S,BAL_D/2-80*S]].forEach(([px,pz],i)=>{
    const pg=new THREE.Group();
    const pot=new THREE.Mesh(new THREE.CylinderGeometry(22*S,18*S,28*S,12),stoneMat);
    pot.position.set(0,23*S,0); pg.add(pot);
    const plant=new THREE.Mesh(new THREE.SphereGeometry(30*S,10,10),new THREE.MeshLambertMaterial({color:0x3a9a28}));
    plant.scale.set(1,1.3,1); plant.position.set(0,58*S,0); pg.add(plant);
    pg.position.set(px,0,pz);
    addGroup(pg,"plant_"+(i+1));
  });
}

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
function updateRotation(){camera.rotation.order="YXZ";camera.rotation.set(0,yaw,0);}

const exitCooldown=(new URLSearchParams(window.location.search).get("from")==="lord_ladiesroom")?Date.now()+4000:0;
let exitTriggered=false,nearExit=false;
function checkExit(){
  if(exitTriggered||Date.now()<exitCooldown) return;
  nearExit=camera.position.z<-BAL_D/2+200*S;
  document.getElementById("doorHint").style.display=nearExit?"block":"none";
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(); const delta=(now-prevTime)/1000; prevTime=now;
  if(!EDIT_MODE){
    if(turnLeft) yaw+=2.0*delta; if(turnRight) yaw-=2.0*delta;
    const mv=Number(moveForward)-Number(moveBackward);
    if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    camera.position.x+=fwd.x*mv*160*delta;
    camera.position.z+=fwd.z*mv*160*delta;
    camera.position.x=Math.max(-BAL_W/2+20*S,Math.min(BAL_W/2-20*S,camera.position.x));
    camera.position.z=Math.max(-BAL_D/2+10*S,Math.min(BAL_D/2-20*S,camera.position.z));
    camera.position.y=240*S;
  }
  checkExit(); updateRotation(); renderer.render(scene,camera);
  EvidenceSystem.update();
}
// engine scripts loaded below
</script>
<script src="../../floor1/sound-system.js"></script>
<script src="../../floor1/mystery-engine.js"></script>
<script src="../../floor1/mystery-state.js"></script>
<script src="../../floor1/mystery-ui.js"></script>
<script src="../../floor1/evidence-system.js"></script>
<script>
(async()=>{
  await MysteryEngine.init();
  let scenario=await MysteryState.load();
  if(!scenario){scenario=MysteryEngine.generate();await MysteryState.save(scenario);}
  window._scenario=scenario;
  MysteryUI.init(scenario,false);
  MysteryUI.setZone('balcony');
  init();
  EvidenceSystem.init({ camera, scene, renderer, zoneId: 'balcony' });
  const _sa=()=>{if(window.SoundSystem)SoundSystem.startAmbient();window.removeEventListener('keydown',_sa);window.removeEventListener('click',_sa);};
  window.addEventListener('keydown',_sa);window.addEventListener('click',_sa);
})();
</script>
