body{margin:0;overflow:hidden;background:#000;font-family:Arial,sans-serif;}
canvas{display:block;}
#fadeOverlay{position:fixed;inset:0;background:#000;z-index:9999;animation:fadeOut 0.8s ease forwards;}

</head>
<body>
<div id="exitFade"></div>
<div id="instructionLine">W/↑ Forward &nbsp; S/↓ Back &nbsp; ←/→ Turn &nbsp; E = Exit &nbsp; M = Edit Mode &nbsp; G = Grid</div>
<div id="doorHint" style="position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#d4a840;border-radius:4px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,140,40,0.5);">Press E — Return to Floor 2</div>
<div id="closetHint" style="position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 24px;background:rgba(0,0,0,0.85);color:#c8a030;border-radius:4px;font-size:17px;display:none;z-index:50;font-family:Georgia,serif;border:1px solid rgba(200,140,40,0.5);">Press E — Enter Dressing Room</div>
<div id="fadeOverlay"></div>
<div id="editHud">

  <button id="saveBtn" type="button">Save Layout</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
const STORAGE_KEY="roman_imperial_chamber_layout";
const S=0.5;
const RW=1600*S, RD=1600*S, RH=650*S;
let scene,camera,renderer,yaw=0,prevTime=performance.now();
let moveForward=false,moveBackward=false,turnLeft=false,turnRight=false;
let EDIT_MODE=false,selectedObject=null;
const editableObjects=[];
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
let _ec=0;
let DEBUG_ON=false,debugGroup=null,positionDisplayInterval=null;
let nearCloset=false,closetTriggered=false,closetDoorsOpen=false;
let closetDoorPivots=[];

function addGroup(g,id){g.userData.editId=id||("grp_"+(++_ec));editableObjects.push(g);scene.add(g);return g;}
function showStatus(msg,ok=true){const el=document.getElementById("autoStatus");el.style.display="block";el.style.color=ok?"#d7f7d7":"#ffd7d7";el.textContent=msg;setTimeout(()=>{el.style.display="none";},2200);}
function updateEditUI(){const ind=document.getElementById("editIndicator");ind.textContent=EDIT_MODE?"ON":"OFF";ind.classList.toggle("on",EDIT_MODE);const btn=document.getElementById("editBtn");btn.textContent=EDIT_MODE?"✏️ Edit Mode: ON":"Edit Mode: OFF";btn.style.background=EDIT_MODE?"rgba(20,80,20,0.85)":"rgba(0,0,0,0.72)";}
function toggleEditMode(){EDIT_MODE=!EDIT_MODE;if(!EDIT_MODE){selectedObject=null;document.getElementById("selInfo").style.display="none";}updateEditUI();}
function saveLayout(){const objects=editableObjects.map(o=>{const wp=new THREE.Vector3();o.getWorldPosition(wp);const wq=new THREE.Quaternion();o.getWorldQuaternion(wq);return{id:o.userData.editId,position:{x:wp.x,y:wp.y,z:wp.z},quaternion:{x:wq.x,y:wq.y,z:wq.z,w:wq.w},scale:{x:o.scale.x,y:o.scale.y,z:o.scale.z}};});localStorage.setItem(STORAGE_KEY,JSON.stringify({version:1,objects}));showStatus("✅ Saved");}
function loadLayout(){const json=localStorage.getItem(STORAGE_KEY);if(!json){showStatus("No saved layout",false);return;}try{const d=JSON.parse(json);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}showStatus("✅ Loaded");}catch(e){showStatus("Load failed",false);}}
function clearSave(){localStorage.removeItem(STORAGE_KEY);showStatus("🗑 Cleared");}
function onMouseClick(e){if(!EDIT_MODE)return;const rect=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-rect.left)/rect.width)*2-1;mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(mouse,camera);const meshes=[];editableObjects.forEach(o=>{if(o.isMesh)meshes.push(o);else o.traverse(ch=>{if(ch.isMesh)meshes.push(ch);});});const hits=raycaster.intersectObjects(meshes,false);if(!hits.length){selectedObject=null;document.getElementById("selInfo").style.display="none";return;}let obj=hits[0].object;let cur=obj;while(cur){if(editableObjects.includes(cur)){obj=cur;break;}cur=cur.parent;}selectedObject=obj;document.getElementById("selInfo").style.display="block";document.getElementById("selInfo").textContent=`✏️ ${obj.userData.editId} | Arrows=Move Shift+↑↓=Height R=Rotate Del=Delete`;showStatus("Selected: "+obj.userData.editId);}
function buildDebug(){debugGroup=new THREE.Group();debugGroup.visible=false;scene.add(debugGroup);const g=new THREE.GridHelper(4000,80,0x4488ff,0x222244);g.position.y=5;debugGroup.add(g);const f=new THREE.GridHelper(4000,400,0x335577,0x1a1a22);f.position.y=3;debugGroup.add(f);const a=new THREE.AxesHelper(400);a.position.y=10;debugGroup.add(a);}
function toggleDebug(){DEBUG_ON=!DEBUG_ON;if(debugGroup)debugGroup.visible=DEBUG_ON;const hud=document.getElementById("debugHud");hud.style.display=DEBUG_ON?"block":"none";if(DEBUG_ON){positionDisplayInterval=setInterval(()=>{const p=camera.position,yd=((yaw||0)*(180/Math.PI)).toFixed(1);document.getElementById("debugHud").innerHTML=`X: ${p.x.toFixed(1)}<br>Y: ${p.y.toFixed(1)}<br>Z: ${p.z.toFixed(1)}<br>Yaw: ${yd}°`;},100);}else{clearInterval(positionDisplayInterval);}}

// SVG Texture
const _svgMatCache={};
function makeSVGTexture(svgStr,w,h){
  const key=svgStr+(w||512)+(h||512);
  if(_svgMatCache[key])return _svgMatCache[key];
  try{const cw=w||512,ch=h||512;const canvas=document.createElement('canvas');canvas.width=cw;canvas.height=ch;const ctx=canvas.getContext('2d');const blob=new Blob([svgStr],{type:'image/svg+xml'});const url=URL.createObjectURL(blob);const tex=new THREE.CanvasTexture(canvas);const mat=new THREE.MeshLambertMaterial({map:tex,color:0xffffff,side:THREE.DoubleSide});const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,cw,ch);tex.needsUpdate=true;URL.revokeObjectURL(url);};img.src=url;_svgMatCache[key]=mat;return mat;}
  catch(e){return new THREE.MeshLambertMaterial({color:0x9a7050,side:THREE.DoubleSide});}
}

function init(){
  setTimeout(()=>{const f=document.getElementById("fadeOverlay");if(f)f.remove();},800);
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1a1410);
  scene.fog=new THREE.FogExp2(0x1a1410,0.0003);
  camera=new THREE.PerspectiveCamera(72,window.innerWidth/window.innerHeight,0.1,2000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth,window.innerHeight);
  document.body.appendChild(renderer.domElement);

  // Balanced Roman lighting — neutral fill + warm torch accents
  scene.add(new THREE.AmbientLight(0x887060,0.9));  // warm-neutral, not orange
  const fillLight=new THREE.DirectionalLight(0xfff0e0,0.5);fillLight.position.set(0,1,0.5);scene.add(fillLight);

  buildRoom();
  buildDebug();

  const saved=localStorage.getItem(STORAGE_KEY);
  if(saved){try{const d=JSON.parse(saved);for(const e of d.objects){const o=editableObjects.find(x=>x.userData.editId===e.id);if(!o)continue;o.position.set(e.position.x,e.position.y,e.position.z);o.quaternion.set(e.quaternion.x,e.quaternion.y,e.quaternion.z,e.quaternion.w);o.scale.set(e.scale.x,e.scale.y,e.scale.z);}}catch(err){}}

  document.getElementById("editBtn").addEventListener("click",toggleEditMode);
  document.getElementById("saveBtn").addEventListener("click",saveLayout);
  document.getElementById("loadBtn").addEventListener("click",loadLayout);
  document.getElementById("clearBtn").addEventListener("click",clearSave);
  renderer.domElement.addEventListener("click",onMouseClick);
  document.addEventListener("keydown",onKeyDown);
  document.addEventListener("keyup",onKeyUp);
  window.addEventListener("resize",onResize);
  camera.position.set(0,240*S,RD/2-150*S);

}

  const mosG=new THREE.Group();
  const mosBg=new THREE.Mesh(new THREE.BoxGeometry(360*S,3*S,360*S),mosBorderMat);mosBg.position.y=0;mosG.add(mosBg);
  const mosFace=new THREE.Mesh(new THREE.PlaneGeometry(340*S,340*S),makeSVGTexture(SVG_MOSAIC,512,512));mosFace.rotation.x=-Math.PI/2;mosFace.position.y=3*S;mosG.add(mosFace);

  const sfUpperL=new THREE.Mesh(new THREE.BoxGeometry(8*S,RH-160*S,RD),new THREE.MeshLambertMaterial({color:0xbe9850}));sfUpperL.position.set(-(RW/2-5*S),RH/2+20*S,0);scene.add(sfUpperL);

  const rdS=new THREE.Mesh(new THREE.BoxGeometry(14*S,120*S,rSegS_len),frescoRed);rdS.position.set(rWx,60*S,rSegS_z);scene.add(rdS);

  const ruN=new THREE.Mesh(new THREE.BoxGeometry(8*S,RH-160*S,rSegN_len),new THREE.MeshLambertMaterial({color:0xbe9850}));ruN.position.set(RW/2-5*S,RH/2+20*S,rSegN_z);scene.add(ruN);

  const tEdge=new THREE.Mesh(new THREE.BoxGeometry(134*S,8*S,84*S),goldMat);tEdge.position.set(0,83*S,0);tG.add(tEdge);
  [[-52*S,30*S],[52*S,30*S],[-52*S,-30*S],[52*S,-30*S]].forEach(([lx,lz])=>{const l=new THREE.Mesh(new THREE.CylinderGeometry(7*S,9*S,78*S,10),bronzeMat);l.position.set(lx,39*S,lz);tG.add(l);});
  // Wine amphora on table
  const ampBody=new THREE.Mesh(new THREE.CylinderGeometry(14*S,8*S,50*S,10),terracotta);ampBody.position.set(0,120*S,0);tG.add(ampBody);
  const ampNeck=new THREE.Mesh(new THREE.CylinderGeometry(6*S,12*S,18*S,8),terracotta);ampNeck.position.set(0,150*S,0);tG.add(ampNeck);
  const ampMouth=new THREE.Mesh(new THREE.CylinderGeometry(8*S,6*S,8*S,8),terracottaL);ampMouth.position.set(0,162*S,0);tG.add(ampMouth);
  tG.position.set(RW/2-200*S,0,0);
  addGroup(tG,"side_table");

  // ── ROMAN RUG / WOVEN TEXTILE ──
  const rugG=new THREE.Group();
  const rugBase=new THREE.Mesh(new THREE.BoxGeometry(450*S,3*S,280*S),new THREE.MeshLambertMaterial({color:0x6a1808}));rugBase.position.y=1.5*S;rugG.add(rugBase);
  const rugField=new THREE.Mesh(new THREE.BoxGeometry(430*S,3*S,260*S),new THREE.MeshLambertMaterial({color:0x8a2010}));rugField.position.y=4*S;rugG.add(rugField);
  // Gold border
  [-1,1].forEach(s=>{
    const b1=new THREE.Mesh(new THREE.BoxGeometry(430*S,5*S,12*S),goldDark);b1.position.set(0,4.5*S,s*124*S);rugG.add(b1);
    const b2=new THREE.Mesh(new THREE.BoxGeometry(12*S,5*S,260*S),goldDark);b2.position.set(s*209*S,4.5*S,0);rugG.add(b2);
  });
  rugG.position.set(RW/2-200*S,0,0);
  addGroup(rugG,"rug");

  // ── FRESCO PAINTINGS (in marble frames) ──
  function makePainting(svgStr,fw,fh,id,pos,rotY){
    const pg=new THREE.Group();
    // Marble outer frame — deepest
    const outer=new THREE.Mesh(new THREE.BoxGeometry(fw+50*S,fh+50*S,16*S),marbleWhite);outer.position.z=-2*S;pg.add(outer);
    // Gold middle — slightly in front
    const middle=new THREE.Mesh(new THREE.BoxGeometry(fw+32*S,fh+32*S,14*S),goldDark);middle.position.z=0;pg.add(middle);
    // Inner marble liner
    const inner=new THREE.Mesh(new THREE.BoxGeometry(fw+14*S,fh+14*S,12*S),marbleGrey);inner.position.z=1*S;pg.add(inner);
    // Corner acanthus bosses
    [[1,1],[-1,1],[1,-1],[-1,-1]].forEach(([cx,cy])=>{const boss=new THREE.Mesh(new THREE.CylinderGeometry(9*S,9*S,20*S,8),goldMat);boss.position.set(cx*(fw/2+16*S),cy*(fh/2+16*S),0);pg.add(boss);});
    // Canvas face — well proud of all frame geometry
    const face=new THREE.Mesh(new THREE.PlaneGeometry(fw,fh),makeSVGTexture(svgStr,512,Math.round(512*fh/fw)));face.position.z=8*S;pg.add(face);
    pg.position.copy(pos);if(rotY!==undefined)pg.rotation.y=rotY;
    addGroup(pg,id);
  }
  makePainting(SVG_EMPEROR,110*S,148*S,"fresco_emperor",new THREE.Vector3(-RW/4,320*S,-RD/2+20*S));
  makePainting(SVG_GODDESS,110*S,148*S,"fresco_goddess",new THREE.Vector3(RW/4,320*S,-RD/2+20*S));
  makePainting(SVG_BATTLE,150*S,100*S,"fresco_battle",new THREE.Vector3(-RW/2+16*S,300*S,RD/4),Math.PI/2);

  // ── DRESSING ROOM DOOR — right wall (wall runs along Z axis) ──
  const cdoorZ=RD/8;
  const cdW=220*S, cdH=300*S, cdThick=16*S;

  

  // Marble frame proud of wall face
  const cdG=new THREE.Group();
  const jS=new THREE.Mesh(new THREE.BoxGeometry(30*S,cdHw+8*S,26*S),marbleWhite);jS.position.set(RW/2-15*S,cdHw/2,cdoorZw-cdWw/2-13*S);cdG.add(jS);
  const jN=new THREE.Mesh(new THREE.BoxGeometry(30*S,cdHw+8*S,26*S),marbleWhite);jN.position.set(RW/2-15*S,cdHw/2,cdoorZw+cdWw/2+13*S);cdG.add(jN);
  const lintel=new THREE.Mesh(new THREE.BoxGeometry(30*S,30*S,cdWw+52*S),marbleWhite);lintel.position.set(RW/2-15*S,cdHw+15*S,cdoorZw);cdG.add(lintel);
  const lintelG=new THREE.Mesh(new THREE.BoxGeometry(24*S,10*S,cdWw+56*S),goldMat);lintelG.position.set(RW/2-12*S,cdHw+32*S,cdoorZw);cdG.add(lintelG);
  const cdPed=new THREE.Mesh(new THREE.BoxGeometry(22*S,16*S,cdWw+64*S),marbleWhite);cdPed.position.set(RW/2-11*S,cdHw+46*S,cdoorZw);cdG.add(cdPed);
  const ks=new THREE.Mesh(new THREE.BoxGeometry(24*S,32*S,26*S),goldMat);ks.position.set(RW/2-12*S,cdHw+58*S,cdoorZw);cdG.add(ks);
  const pl=new THREE.Mesh(new THREE.BoxGeometry(24*S,16*S,cdWw+52*S),marbleWhite);pl.position.set(RW/2-12*S,8*S,cdoorZw);cdG.add(pl);
  scene.add(cdG);
  addGroup(cdG,"closet_frame");

  // Door leaves — static, placed directly in the opening
  [-1,1].forEach(s=>{
    const door=new THREE.Mesh(new THREE.BoxGeometry(cdThick,cdHw-4*S,cdWw/2-6*S),woodMat);
    door.position.set(RW/2-cdThick/2,cdHw/2,cdoorZw+s*(cdWw/4));
    scene.add(door);
    // Recessed panels
    [0.14,0.38,0.63,0.86].forEach(h=>{
      const pnl=new THREE.Mesh(new THREE.BoxGeometry(cdThick+2,cdHw*0.16,cdWw/2-30*S),new THREE.MeshLambertMaterial({color:0x6a3808}));
      pnl.position.set(RW/2-cdThick/2,h*cdHw,cdoorZw+s*(cdWw/4));scene.add(pnl);
    });
    // Bronze ring handle
    const ring=new THREE.Mesh(new THREE.TorusGeometry(7*S,2*S,6,10),bronzeMat);
    ring.rotation.z=Math.PI/2;
    ring.position.set(RW/2-cdThick-2,cdHw*0.44,cdoorZw+s*12*S);scene.add(ring);
    // Keep pivot for animation (closed position = no rotation)
    const pivot=new THREE.Group();
    pivot.position.set(RW/2-cdThick,0,cdoorZw+s*(cdWw/2));
    scene.add(pivot);

  // ── ROMAN CHANDELIER — suspended oil lamp ring ──
  const chanG=new THREE.Group();

  // Three rings of oil lamps
  [80*S,50*S].forEach((r,tier)=>{
    const lampCount=tier===0?10:6;

    for(let i=0;i<lampCount;i++){
      const angle=i/lampCount*Math.PI*2;
      const lampBody=new THREE.Mesh(new THREE.CylinderGeometry(7*S,5*S,10*S,8),bronzeMat);lampBody.position.set(Math.cos(angle)*r,-tier*28*S-6*S,Math.sin(angle)*r);chanG.add(lampBody);
      const flame=new THREE.Mesh(new THREE.SphereGeometry(4*S,6,6),flameMat);flame.position.set(Math.cos(angle)*r,-tier*28*S+2*S,Math.sin(angle)*r);chanG.add(flame);

    }

}

function onResize(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);}
function updateRotation(){camera.rotation.order="YXZ";camera.rotation.set(0,yaw,0);}

const exitCooldown=(new URLSearchParams(window.location.search).get("from")==="floor2")?Date.now()+4000:0;
let exitTriggered=false,nearExit=false;
if(new URLSearchParams(window.location.search).get("from")==="closet"){
  setTimeout(()=>{camera.position.set(RW/2-80*S,240*S,RD/8);yaw=Math.PI/2;updateRotation();},100);
}

function checkExitDoor(){
  if(exitTriggered)return;if(Date.now()<exitCooldown)return;
  nearExit=camera.position.x>-180*S&&camera.position.x<180*S&&camera.position.z>RD/2-200*S;
  document.getElementById("doorHint").style.display=nearExit?"block":"none";
}

function checkClosetDoor(){
  const dx=camera.position.x-RW/2+20*S;
  const dz=camera.position.z-RD/8;
  nearCloset=Math.sqrt(dx*dx+dz*dz)<180*S&&!closetTriggered;
  const hint=document.getElementById("closetHint");
  if(nearCloset&&!nearExit){hint.textContent="Press E — Enter Dressing Room";hint.style.display="block";}
  else hint.style.display="none";
}

function animateClosetDoors(delta){}

function onKeyDown(e){
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();
  if(e.code==="KeyM"){toggleEditMode();return;}
  if(e.code==="KeyG"){toggleDebug();return;}
if(e.code==='KeyF'&&window.SoundSystem&&window.EvidenceSystem&&EvidenceSystem._nearIdx>=0)SoundSystem.play('pickup');
    if(e.code==="KeyE"){
    if(nearCloset&&!nearExit){
      closetTriggered=true;
      document.getElementById("closetHint").style.display="none";
      document.getElementById("exitFade").classList.add("show");
      setTimeout(()=>window.location.href="romandressingroom.html?from=romansuite",600);
      return;
    }
    if(nearExit&&!exitTriggered){
      exitTriggered=true;
      document.getElementById("doorHint").style.display="none";
      document.getElementById("exitFade").classList.add("show");
      setTimeout(()=>window.location.href="floor2.html?from=roman_suite",600);
    }
    return;
  }
  if(EDIT_MODE&&selectedObject){
    if(e.code==="Delete"||e.code==="Backspace"){e.preventDefault();scene.remove(selectedObject);const idx=editableObjects.indexOf(selectedObject);if(idx>-1)editableObjects.splice(idx,1);showStatus("🗑 Deleted");selectedObject=null;document.getElementById("selInfo").style.display="none";return;}
    const speed=e.shiftKey?1:8;
    if(!e.shiftKey){if(e.code==="ArrowUp")selectedObject.position.z-=speed;if(e.code==="ArrowDown")selectedObject.position.z+=speed;if(e.code==="ArrowLeft")selectedObject.position.x-=speed;if(e.code==="ArrowRight")selectedObject.position.x+=speed;}
    if(e.shiftKey&&e.code==="ArrowUp")selectedObject.position.y+=speed;
    if(e.shiftKey&&e.code==="ArrowDown")selectedObject.position.y-=speed;
    if(e.code==="KeyR")selectedObject.rotation.y+=e.shiftKey?0.05:0.1;
    return;
  }
  if(!EDIT_MODE){
    if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=true;
    if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=true;
    if(e.code==="ArrowLeft")turnLeft=true;
    if(e.code==="ArrowRight")turnRight=true;
  }
}
function onKeyUp(e){
  if(e.code==="KeyW"||e.code==="ArrowUp")moveForward=false;
  if(e.code==="KeyS"||e.code==="ArrowDown")moveBackward=false;
  if(e.code==="ArrowLeft")turnLeft=false;
  if(e.code==="ArrowRight")turnRight=false;
}

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now(),delta=(now-prevTime)/1000;prevTime=now;
  if(!EDIT_MODE){
    if(turnLeft)yaw+=2.2*delta;if(turnRight)yaw-=2.2*delta;
    const mv=Number(moveForward)-Number(moveBackward);
    if(mv!==0&&window.SoundSystem)SoundSystem.footstep();
    const fwd=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
    camera.position.x=Math.max(-RW/2+20*S,Math.min(RW/2-20*S,camera.position.x+fwd.x*mv*110*delta));
    camera.position.z=Math.max(-RD/2+20*S,Math.min(RD/2-15*S,camera.position.z+fwd.z*mv*110*delta));
    camera.position.y=240*S;
  }
  checkExitDoor();checkClosetDoor();animateClosetDoors(delta);updateRotation();renderer.render(scene,camera);
  EvidenceSystem.update();
}

  await MysteryEngine.init();

  window._scenario=scenario;
  MysteryUI.init(scenario,false);
  MysteryUI.setZone('roman_suite');
  init();
  EvidenceSystem.init({ camera, scene, renderer, zoneId: 'romansuite' });
  const _sa=()=>{if(window.SoundSystem)SoundSystem.startAmbient();window.removeEventListener('keydown',_sa);window.removeEventListener('click',_sa);};
  window.addEventListener('keydown',_sa);window.addEventListener('click',_sa);
})();
</script>
